<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K12 城市资源配置</title>
<style>
/* 调色板对齐《20260921 学成战略规划启动会》那份 deck(2026-09-27 用户口径)。
   那套只有**红一族 + 中性灰**,没有一个绿、没有一个蓝,字体是微软雅黑。
   deck 的阶梯(第 5 张「哪些业务加码/维持/观察/收缩」)直接搬过来当三张清单的语义:
     加码 #C8102E 实心  →  红利大市场
     维持 #DC5A6D       →  存量红利市场
     收缩 #D5D8DD 灰    →  红利消退市场
     提示条 #FBEBEE 底 + #C8102E 标签(deck 的「CEO 要点」)
   ⚠ 红在这一页同时是「品牌色」和「全国基准线」的语义色。分法:
     **实心红 --brand 只用于品牌/强调**;**基准线与负向一律用深红 --brand-dk 虚线**。
     混用的话读者分不出「这是重点」还是「这是参照线」。 */
:root{
  /* 品牌红族(色值取自 deck,未自行调) */
  --brand:#c8102e; --brand-dk:#8e0b20; --brand-mid:#dc5a6d; --brand-pale:#edb3bc;
  --brand-lt:#f6c9d0; --brand-bg:#fbebee;
  /* 中性(deck 的墨色/次级/弱化/页底/卡片/线) */
  --ink:#1f2329; --i2:#5f6670; --muted:#8a9099; --gray:#8a9099;
  --pg:#f3f4f6; --sf:#fff; --soft:#f7f8f9; --hover:#fbebee;
  --ln:#e6e8eb; --ln-soft:#f3f4f6; --gr:#d5d8dd;
  /* 三层线:结构线(表头下) / 行线 / 列线,由重到轻 */
  --ln-1:#d5d8dd; --ln-2:#e6e8eb; --ln-3:#f3f4f6;
  /* 旧色名保留成别名,统一指到新色 —— 模板里 --navy/--blue/--green 还有十几处引用,
     逐个改容易漏一处,漏掉的那处就会是唯一的蓝,反而更显眼。 */
  --navy:var(--brand); --blue:var(--brand-dk); --green:var(--brand);
  --sky:var(--brand-pale); --lt-blue:var(--brand-lt); --lt-blue2:var(--brand-bg);
  /* 三张清单:红 → 粉 → 灰(deck 的加码 / 维持 / 收缩) */
  --c-in:#c8102e; --c-deep:#dc5a6d; --c-out:#8a9099;
  --bg-in:#fbebee; --bg-deep:#fdf1f3; --bg-out:#e6e8eb;
  --sh:0 1px 2px rgba(31,35,41,.06);
  --ff:'Microsoft YaHei','微软雅黑','PingFang SC','Hiragino Sans GB',sans-serif;
  /* ⚠ --ff-num 从来没定义过(和 --gr 一样),下面 4 处 var(--ff-num) 一直是坏声明。
     这里**故意把它指回正文字体**,不顺手换个等宽数字体:那会改列宽,而全量表的列宽是手调的。
     想上等宽数字时再单独一轮改,那时要连着重量列宽。 */
  --ff-num:var(--ff);
  /* 字号只有 5 档。要加新字号先想清楚哪一档不够用。 */
  --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:17px; --fs-lg:21px; --fs-xl:27px;
  /* 内容栏:正文与顶栏共用同一组值,改一处两边一起走(否则标题和下面的 tab 会差一截) */
  --wrap-w:1320px; --wrap-pad:20px;
  /* 圆角只有 2 档(胶囊另算) */
  --r-card:8px; --r-ctl:6px; --r-chip:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);font-size:var(--fs-sm);line-height:1.5;background:var(--pg);color:var(--ink)}
/* 顶部横条:品牌红底白字(deck 封面同款), h1 与副标题基线对齐 */
/* 顶栏压扁(用户口径):18px 内边距 + 33px 行高 = 69px,在 1080p 上把整页顶到 1092 > 1080,
   下面那部分被挤出屏幕。改成 9px + 22px 行高 = 40px —— 它是一条标题带,不是内容区。
   ⚠ 行高要显式写死:不写就是 normal(≈1.5),字号一改高度跟着飘。 */
/* (原 header 品牌条的三条规则随顶栏一起删除,2026-09-28) */
/* 上下留白与 tab 行的外边距都压到最小(用户口径:「给图表那块主要内容留更多空间」是原则)。
   卡片外的固定开销原来是 202px:顶栏 40 + 上留白 38 + tab 行 55 + 下间隙 13 + 底部留白 56。
   现在顶栏 34 + 上留白 12 + tab 行 46 + 下间隙 6 + 底部 20 = 118 —— 腾出来的 84px 全给卡片。 */
.wrap{max-width:var(--wrap-w);margin:0 auto;padding:8px var(--wrap-pad) 20px}

/* ── 顶部 Tab:iOS 分段控件(用户口径 2026-09-27)──
   结构照搬 UISegmentedControl:一条浅灰圆角槽,选中的那一段盖一块**白色圆角拇指**
   (带软阴影),切换时整块滑过去。文字:未选中中灰常规,选中近黑半粗。
   三个细节缺一不可 —— 少了凹槽就退回普通 tab,少了拇指就只是变色,少了滑动就只是跳变。
   八段**等分**(flex:1),所以拇指宽度天然固定,也正好铺满整行;不用再 space-between。 */
/* ★ 2026-09-28 用户口径:tab 条太挤(十个等分,1100 下每格 105px,副标题卡到 85px),
   改成**一屏三个 + 可横向滚**(「tab 那一行太挤了 可不可以设计成可以滑动的那种 平时只显示三个tab」)。
   一屏三个 → 每格 1/3 卡宽(1920 下 640px、1100 下 350px),副标题再也不用数字数。
   滚动方式(用户口径):**只自动跟随 + 滚轮/触摸板**,不加左右箭头、不加按住拖
   —— 上次删鼠标拖拽换页的理由在这儿同样成立(按住拖会误伤选文字)。 */
.tabs{position:relative;display:flex;align-items:stretch;background:var(--ln);
  border-radius:9px;padding:3px;margin:4px 0 6px;
  overflow-x:auto;overflow-y:hidden;
  overscroll-behavior-x:contain;   /* 滑到头别把整页带着横滚 */
  /* 有一屏装不下时给一条**细的常显滚动条** —— 「还有 7 个 tab」必须有个可见的说法:
     只露三个、又没有任何提示的话,看到的正好是带序号的 1/2/3,像是"总共就这三个"。
     (不加左右箭头是用户口径;渐隐遮罩会把卡片的圆角一起吃掉,不好看。) */
  }
/* ── 「还有更多」怎么看得出来 ──
   只露三个 tab、又没有提示的话,观众看到的正好是带序号的 1/2/3,像是"总共就这三个"。
   滚动条这条路在 macOS 上走不通(实测两个坑,都留在下面),所以改用**纯 CSS 的滚动阴影**:
   有内容可滚的那一侧才浮出一小片暗影,滚到头就自己消失。不依赖滚动条渲染、不用 JS、不改 DOM。

   原理是两层背景叠出来:
     · 两块**和底色同色**的「盖板」,`background-attachment:local` —— 它随内容滚动,
       滚到端头时正好把那一侧的影子盖住;
     · 两团 `radial-gradient` 影子,默认 `scroll` —— 钉在视口两侧不动。
   一层滚、一层不滚,差值就是"这一侧还有没有内容"。 */
.tabs{
  background:
    linear-gradient(var(--ln),var(--ln)) left  center/26px 100% no-repeat local,
    linear-gradient(var(--ln),var(--ln)) right center/26px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%,   rgba(31,35,41,.22), rgba(31,35,41,0)) left  center/15px 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,rgba(31,35,41,.22), rgba(31,35,41,0)) right center/15px 100% no-repeat,
    var(--ln)}
/* ⚠ 更正(2026-09-28):下面这段曾经写过「macOS 不给画滚动条,::-webkit-scrollbar 只在
   系统设置『始终』时才生效」—— **那个结论是错的**,依据是 headless Chromium 的测量。
   同一天在**有头**浏览器里量清楚了:
       原生滚动条 15px · 自定义 ::-webkit-scrollbar 10px   ← 都正常
       headless   都是 0px                                ← 假象
   所以 ::-webkit-scrollbar 本来是好使的。这条 tab 条上的**滚动阴影**保留(它更贴这一条的
   视觉语言,而且不占横向 10px),但**别再拿"macOS 画不出滚动条"当理由** ——
   趋势视图那边就用了真滚动条(见 .trwrap 的样式),它是对的。 */
/* flex:0 0 calc(100%/3) —— 严格一屏三个。`100%` 是 `.tabs` 的**内容盒**宽(flex 容器的
   padding 已被扣掉),所以三格正好铺满、不留缝。不能再用 flex:1(那会让十格等分)。 */
.tab{position:relative;z-index:1;flex:0 0 calc(100% / 3);min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:5px 10px;border:0;border-radius:7px;background:none;
  cursor:pointer;font:inherit;color:var(--i2);white-space:nowrap;transition:color .18s,background .18s}
/* 悬停只在**未选中**的那段上浮一层半透明白:预告「点下去这块会变成拇指」 */
.tab:hover{color:var(--ink)}
.tab:hover:not(.on){background:rgba(255,255,255,.55)}
.tab.on{color:#fff}   /* 选中段:白字压在品牌红拇指上(用户口径 2026-09-28) */
.tab .tt{font-size:var(--fs-md);font-weight:600;letter-spacing:-.2px;line-height:1.15}
/* 序号(用户口径 2026-09-28):**只有前三个**带 —— 全国→各省→各市是真的下钻阶梯,
   编号恰好在说"这三步是往下钻";后五个是并列的名单/底账,编号会把它们读成"第 4、5、6 步"。
   序号写在 .tt **里面**(小一号、常规字重、灰),这样它随标题字号一起缩放,也不用多一层 flex。 */
/* 加了序号之后最长的那条(「3 各省生源×收入」)在 17px 下要 122px,而每段可用宽度随视口变:
   1920/1440 下 139px(17px 放得下)、1100 下 112px(只够 15px)。所以**按宽度分档降字号**,
   而不是为了最窄那一档把投屏用的 1920/1440 也一起缩小。 */
/* ★ 2026-09-28:tab 条改成「一屏三个 + 可横向滚」之后,原来两档降字号(1250 / 1180)
   全部删除 —— 它们是为了十等分挤到 105px 才加的,现在每格 300px 起,17px 放得开。
   留着不只是多余:上面那些注释写的是"1100 下每段只有 112px",那句话当场就成了假的。 */
/* (原有一档 @media(max-width:1180px) 降字号,同日随十等分一起删除 —— 见上面那条说明。
   它当年是用「CSS 注释不能嵌套」的教训换来的:注释里原样写了自己的终止记号,
   内层那个提前结束了整条注释,把下面这条 @media 一起吃掉,规则在源码里看得见、
   在浏览器里不存在。那条教训留着,规则本身不再需要。) */
/* 副标题(用户口径 2026-09-28):一行说清这一页是什么。
   代价明说:tab 行从 38px 长到 ~52px,而卡片高 = 窗口高 − 卡片顶到页顶 ——
   这 14px 是从图表身上拿的,与「给图表留更多空间」那条原则相反。实测卡片 888→874。
   所以副标题必须**短**:最长 7 个汉字,1100px 宽下也放得开(实测不折行、不裁字)。 */
.tab .ts{display:block;font-size:var(--fs-xs);font-weight:400;color:var(--muted);
  line-height:1.1;margin-top:1px;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab.on .ts{color:rgba(255,255,255,.78)}   /* 副标题比主标题轻一档,但仍要红底上读得出 */
.tab:not(.on) .tt{font-weight:400}
/* 选中段的拇指:left/width 由 moveInd() 算。
   ★ 2026-09-28 改成**品牌红**(用户口径):原来是 iOS 那种白拇指,但这一页的选中态
   与 deck 的品牌色体系不一致 —— 红是这一页的"选中/强调"色(标题条、基准线、tab 指示都是它),
   白的拇指在一排灰字里只是"浮起来一块",没说"当前是这一页"。
   滑块动画保留(换的是颜色,不是交互);阴影也从黑色改成红的一次扩散 ——
   黑投影压在红块下面会发脏。 */
.tind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:7px;background:var(--brand);
  box-shadow:0 2px 6px rgba(200,16,46,.32);
  transition:left .24s cubic-bezier(.32,.72,0,1),width .24s cubic-bezier(.32,.72,0,1)}
.tind.ini{transition:none}   /* 首屏与 resize 瞬移,不从上一个位置滑过来 */
@media(max-width:900px){.tab .tt{font-size:14px}.tab .ts{font-size:10px}.tab{padding:4px 6px}}
/* ── 换页容器 ── */
/* ★ 2026-09-28 用户口径:「鼠标点住拖动会切换 tab,我希望只用键盘左右来切换 tab」。
   原先这里是 拖拽/滑动 换页(pointerdown→move→up,横向位移 >55px 翻一页),已整块删除。
   连带去掉的还有 `cursor:grab` / `:active{cursor:grabbing}` —— 抓取光标是在邀请用户拖,
   功能没了还留着光标,比没有更糟(用户会以为拖不动是卡的)。
   现在换页只剩两条路:**点 tab** 和 **键盘 ←/→**。
   `touch-action:pan-y` 保留:它挡的是触屏上的横向过滚动(浏览器前进/后退手势),
   与换页逻辑无关,删了反而会让触屏上横向划一下跳出页面。 */
.viewport{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--gr);border-radius:var(--r-card);
  box-shadow:var(--sh);
  touch-action:pan-y}
/* 「严格保密」水印(用户口径 2026-09-28)。
   挂在**卡片**上而不是每一页各画一个:卡片是 .viewport、里面是滑动轨道 ——
   挂在卡片上,八页自然都有,而且翻页时水印不动(它属于"这张纸",不属于某一页)。
   ⚠ 必须在内容**之上**(z-index)—— 卡片底色是白的,画在下面会被整块盖掉;
   而盖在上面就必须 pointer-events:none,否则整页点不动(气泡、tab、滑块全废)。
   用内联 SVG 的 <pattern> 平铺,不用 data-URI 背景图 —— 中文写进 data-URI 要百分号转义,
   又长又容易在替换里出错。 */
.wm{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;user-select:none}
/* ⚠ width/height 必须显式写:SVG 是**替换元素**,`inset:0` + `width:auto` 时
   width 取的是它的**固有尺寸 300×150**(HTML 里 <svg> 没写 width/height 的默认值),
   而不是被四边拉伸 —— 于是 320×200 的图案格子在 300×150 的框里一格都铺不满,
   看上去"只有左上一处水印"(实测)。这一条是这轮唯一踩的坑。 */
.track{display:flex;transition:transform .34s cubic-bezier(.4,0,.25,1)}
.slide{flex:0 0 100%;width:100%;min-width:0}
.slide>.why{padding:12px 18px;font-size:var(--fs-sm);color:var(--i2);line-height:1.72;
  border-bottom:1px solid var(--gr)}
.slide.in>.why{background:var(--bg-in)} .slide.deep>.why{background:var(--bg-deep)}
.slide.out>.why{background:var(--bg-out)}

/* ── 左图右表 ── */
.split{display:grid;grid-template-columns:72% 28%}
/* ★ 2026-10-08:「战略空白市场」/「自由筛选」两页的右栏要宽 2 个百分点。
   起因:这两页的表有 **6 列 + 一个 26px 的 # 列**,而 COLS 里的 352 是**不含 # 列**的预算
   (注释写「≤ 360」时漏算了那 26px)—— 于是表实际 378px,而右栏只有 358px,
   最右边的「本市排名」被切掉 20px,且没有任何滚动提示。
   为什么不削列宽:这几列的表头是**折行顶满**的(实测每列 need == 声明宽),
   削任何一种都会把表头切成两截(收入列 70px 时「人均可支配」会断成「收入(万/元)」,这条以前踩过)。
   所以从**布局**上给,不动字号也不动列宽:70/30 → 右栏 ≈386px,378 放得下。
   ⚠ 只对这两页生效 —— 其余页的表是 5 列,恰好 358,不需要也不该改。 */
.slide.big .split,.slide.free .split{grid-template-columns:70% 30%}
/* 竞争格局页没有右栏了(原来那里是「画不上几城」说明 + 地图入口卡片),
   所以这一页让图表独占整宽。留着 28% 空列会让图缩在左边、右边一条空白。 */
.split.solo{grid-template-columns:1fr}
.split.solo .paneR{border-right:0}
.paneR{order:-1;padding:6px 14px 4px;display:flex;flex-direction:column;justify-content:flex-start;border-right:1px solid var(--gr)}
/* 表格区高度上限:省级页有 31 行(≈960px),比图表还高,不封顶就会替图表
   决定卡片高度、把六页一起顶高。封在 680 —— 三张清单表最长 16 行(≈520),不受影响。
   注意:这里必须是 /星号 注释,CSS 不认 // —— 写成 // 会让整条规则被解析器丢弃。 */
/* 右栏表格的高度上限分成两个变量,因为它们要往**相反**的方向动:
     --plhL  三张清单的表(最长 52 行)—— 窗口矮时**往下压**,腾地方;
     --plh   省级页那张(31 行)—— 窗口高时**往上抬**,把它右栏那截空白填满(用户口径)。
   ⚠ 不能合成一个:省级页抬到 966 时,52 行的那两张表会被一起抬到 1055,整张卡顶高 88px(实测)。 */
.paneL{order:0;overflow:auto;max-height:var(--plhL,680px)}
/* 「画不出」带子(2026-09-29,只在「自由筛选」页):图下方一行,列出两轴缺值、图上没有落点的城。
   常驻不隐藏 —— 理由见标记里的注释(半路长出来的一行会把内容顶出 overflow:hidden 的卡片)。
   一行放不下就省略号收尾,完整名单在 title 里(悬停可看)。 */
.nolist{margin-top:4px;padding-top:5px;border-top:1px dashed var(--gr);
  font-size:var(--fs-xs);color:var(--i2);line-height:1.5;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.nolist b{color:var(--ink);font-weight:600}
.nolist .nm{color:var(--muted)}
.nolist .tg{color:var(--brand);margin-left:6px;white-space:nowrap}
/* 点一下展开:整份名单折行显示(封顶 118px,再多就内滚)—— 省得"剩 150 座得靠悬停才看得到"。
   展开会占掉图的高度,所以点击时走 fitCharts() 重排(与窗口 resize 同一条路径),
   不是让它在图下面硬挤 —— 硬挤会被 .viewport{overflow:hidden} 裁掉。 */
.nolist.open{white-space:normal;overflow:auto;max-height:118px;text-overflow:clip}
.slide.prov .paneL,.slide.pc .paneL{max-height:var(--plh,680px)}
/* 各市生源概览:空态那一句要在栏里**居中**,不能顶在上边留一大片白。
   #cp2 撑满栏 → .empty 用 margin:auto 双向居中(只有它和趋势图/气泡两种内容,互不影响)。 */
/* 三个省视图(各市生源概览 / 河北 / 北京)共用:宿主 id 各不相同,所以样式挂**类**上,
   加第四个视图只写 DOM、不用回来补选择器(2026-10-08 加北京时顺手改的)。 */
.slide.sprov .chartbox{flex:1;min-height:0;display:flex;flex-direction:column}
.slide.sprov .chartbox>.empty{margin:auto;max-width:72%;line-height:1.9}
.paneL thead th{white-space:normal;line-height:1.35}
#t1 thead th,#t2 thead th,#t3 thead th,#t1 tbody td,#t2 tbody td,#t3 tbody td{text-align:center}   /* 三张清单表整表居中(表头+单元格,含城市/省名) */
#tp thead th,#tp tbody td,.pctbl thead th,.pctbl tbody td{text-align:center}   /* .pctbl = 省视图的右栏表 */   /* 省级表与各市表整表居中(覆盖 th.l/td.l 的左对齐) */
/* 初/高 口径切换:两页共用同一个状态 */
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* 图例在工具条里:去掉它自己的上外边距(那是给「图下面一行」用的) */
.phead .legend{margin:0;color:var(--i2);white-space:nowrap}
.lvsw{display:inline-flex;border:1px solid var(--ln);border-radius:var(--r-ctl);overflow:hidden}
.lvsw button{font:inherit;font-size:var(--fs-xs);padding:3px 11px;border:0;background:none;
  cursor:pointer;color:var(--muted);white-space:nowrap}
.lvsw button+button{border-left:1px solid var(--ln)}
.lvsw button.on{background:var(--navy);color:#fff;font-weight:600}
/* 全国趋势的学段勾选:真 <input type=checkbox>(要键盘与无障碍),外观自己画 ——
   原生方框在这个字号下太小。
   每项 = 方框 + 学段名。**不带色块**(用户口径):色→学段的对应关系由图例那句
   「线的深浅 = 学段」和曲线上自带的峰值标签(「初中 5553 · 2026 峰」,字色就是线色)承担,
   控件这排只回答「画哪几条」,不再兼一份图例。
   ⚠ 样式定义在 .nathead 那段(和标题放一起,改字号只改一处)。这里不再重复一遍 ——
   同一组选择器写两遍,后写的那份永远赢,前一份就成了看不出作用的死代码。 */
.paneR,.paneL{align-self:stretch}   /* 两栏等高:由较高的一侧决定行高,另一侧撑满 */
@media(max-width:1080px){
  .split{grid-template-columns:1fr}
  .paneR{order:0;border-right:0;border-bottom:1px solid var(--gr)}
  .paneL{max-height:none}
  .paneAll{max-height:72vh}   /* JS 的 fitAll() 在窄屏不接管高度,这里兜底 */
}
.chart{width:100%;height:auto}
.paneR h4,.natwrap h4{font-size:var(--fs-xs);font-weight:700;color:var(--mut);letter-spacing:.4px;margin-bottom:0}
/* ⚠ 上内边距 18→15:「全国趋势」是**决定卡片高度的那一页**(chartNat 就是按填满卡片定的高度),
   加了学段开关那一行之后,本页自然高度从 823 涨到 828,整张卡跟着高 4px(六页全变)。
   把开关行多吃掉的 4px 从上边距里扣回来,其余页面高度纹丝不动。改这里之前先量 vp 高度。 */
.natwrap{padding:15px 18px 14px}
/* 标题与学段勾选:**上下两行、都居中**(用户口径 2026-09-27)。
   ⚠ 原来是两端对齐的一行(标题左、开关右),改两行 + 字号放大后这一块从 20px 涨到 48px。
   而**这一页决定整张卡的高度**(图表按填满卡片定高,六页一起跟着变):
   vp 824 → 861,paneAll 715 → 746。
   量过 1920×1080:卡片底 1036 < 1080,投屏不滚屏 —— 所以**不**为了保住旧高度去压图表。
   要回到 824,把 chartNat 的 H 从 584 降到约 554 即可。 */
.nathead{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:6px}
.nathead h4{font-size:var(--fs-md);font-weight:700;color:var(--ink);letter-spacing:.4px;line-height:1.2}
/* 学段勾选:投屏用,比 --fs-sm 大一档。方框与对勾用 em 定尺,跟着字号一起走 ——
   写死 px 的话下次改字号又要重新对一遍。 */
.natsw{display:flex;align-items:center;gap:18px;font-size:14px}
.natsw label{display:inline-flex;align-items:center;gap:6px;color:var(--i2);
  cursor:pointer;white-space:nowrap;user-select:none}
.natsw label:hover{color:var(--ink)}
.natsw input{appearance:none;-webkit-appearance:none;width:1.1em;height:1.1em;margin:0;flex:none;position:relative;
  border:1.5px solid var(--gr);border-radius:.22em;background:#fff;cursor:pointer}
.natsw input:checked{background:var(--navy);border-color:var(--navy)}
.natsw input:checked::after{content:'';position:absolute;left:.24em;top:0;width:.34em;height:.62em;
  border:solid #fff;border-width:0 .15em .15em 0;transform:rotate(45deg)}
/* 「至少留一条」:只剩它时点不动。⚠ 别加 opacity 或变灰 —— 灰的勾选框与「没勾」长得一样,
   用户会以为这条线被关了。保持勾选的样子,只把光标改 default,由 title 说清原因。 */
.natsw input:disabled{cursor:default}
.natsw input:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.legend{font-size:var(--fs-xs);color:var(--mut);line-height:1.55;margin-top:6px;white-space:normal}   /* slide 是 nowrap,图例必须显式放开,否则长文本溢出到框外被表格盖住 */
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);table-layout:fixed}
thead th{position:sticky;top:0;background:var(--ln-3);color:var(--i2);font-weight:600;text-align:right;
  padding:6px 4px;border-bottom:1px solid var(--gr);white-space:nowrap;font-size:var(--fs-xs);z-index:1;overflow:hidden}
thead th.l{text-align:left}
tbody td{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:right;overflow:hidden;
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.l{text-align:left;white-space:normal}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tbody tr.open{background:var(--ln-3)}
.rk{color:var(--mut)}
thead th:last-child,tbody td:last-child{padding-right:10px}
thead th:first-child,tbody td:first-child{padding-left:8px}
/* 城市名**一律常规字重**(用户口径 2026-09-27):原先窄表里是 600、总表里是 400,
   于是同一屏上"图里的城名(细)"和"表里的城名(粗)"是两种字重,像在表达两种东西。
   名字只是标识,不带强调;要强调的列另有 .tag/.es/.altw 那几样。
   注:`#t0 .city{font-weight:400}` 那条覆盖随之作废,已删 —— 全局就是 400。 */
.city{font-weight:400;white-space:normal}
.prov{color:var(--mut);font-size:var(--fs-xs);white-space:nowrap}   /* 窄表里的次级列,故意压暗压小 */
/* 悬浮窗:盖在 dashboard 上的一层,里面是 deck 的 iframe。
   这样点开 deck 不会把 dashboard 顶掉 —— 筛选条件、高中/初中口径、展开的明细都还在。 */
.deckov{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center}
.deckov[hidden]{display:none}
.deckov-bd{position:absolute;inset:0;background:rgba(31,35,41,.58)}
/* 缩放加在 .deckov-box 上(不是 iframe 上),两者一起缩,关闭按钮跟着走不会跑位。
   transform 不影响布局盒尺寸,所以 flex 居中仍以 1280×720 的中心为准。 */
.deckov-box{position:relative;width:1280px;height:720px;background:#fff;border-radius:6px;
  box-shadow:0 18px 60px rgba(0,0,0,.4);transform-origin:center center}
.deckov-box iframe{display:block;width:1280px;height:720px;border:0;border-radius:6px;background:#e6e8eb}
.deckov-x{position:absolute;top:-15px;right:-15px;width:32px;height:32px;border-radius:50%;
  border:1px solid #d5d8dd;background:#fff;color:#1f2329;font-size:15px;line-height:1;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.18)}
.deckov-x:hover{background:#f3f4f6;color:#1f2329}
/* 提示条挂在下沿居中:上沿左角是 deck 自己的「关闭」、右角是本浮层的 ✕,挤不下第三个元素。
   放下面既不挡内容,也顺带像一条图例。 */
.deckov-hint{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);height:32px;
  display:flex;align-items:center;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.95);
  border:1px solid #d5d8dd;font-size:var(--fs-xs);color:var(--i2);white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.14)}
.deckov-hint b{color:var(--ink);font-weight:600;margin-right:6px}
/* 「本市排名」可点:下划虚线提示「这里能点开」,但不做成按钮 —— 单元格里出现按钮太重,
   整列会花。其余列都是纯文本,只有这一列带下划线,扫一眼就知道哪列能点。 */
/* 生源趋势线(展开行内嵌 SVG)。14 个点、两条线,不值得开浮层。 */
.trsvg{display:block;width:100%;height:auto;margin:2px 0 8px}
.trcap{font-size:var(--fs-xs);font-weight:700;color:var(--mut);letter-spacing:.3px;margin:8px 0 2px}
/* 生源趋势视图的外层:**它自己滚**。两张趋势图 + 该省各市表比画布高,不滚的话表格会被
   `.viewport{overflow:hidden}` 裁掉(用户报「只看得到趋势线,下面表格看不到」)。
   页面整体仍然不滚 —— 「不滚动」那条约束管的是页面,这一层是画布内部的子滚动。
   max-height 由 trCap() 按画布高算并写到内联样式(不能在 CSS 里写死:画布高随窗口变)。
   overscroll-behavior 挡住"滚到头继续滚带动外层"的手感。 */
.trwrap{overflow:auto;overscroll-behavior:contain;padding-right:4px}
/* 趋势视图(高中/初中/小学三张图 + 该省各市表)比画布高,靠这一层自己滚。
   显式画一条**常显**滚动条(用户口径 2026-09-28「最下面小学的看不到 是不是加个滚动条」):
   不显式画的话,它随系统的「显示滚动条」设置走 —— 设成"自动"时只有滚动那一刻才出现,
   而这一页的症状恰恰是"不知道下面还有东西",没有提示就等于够不着。
   ⚠ 这一条能成立,是因为**真浏览器**里 ::-webkit-scrollbar 有效 —— 见下面 tab 条那段注释里
   记的一次误判:headless 下量出来是 0px,据此以为"macOS 不给画",那个结论是错的。 */
.trwrap::-webkit-scrollbar{width:10px}
.trwrap::-webkit-scrollbar-thumb{background:var(--gray);border-radius:5px}
.trwrap::-webkit-scrollbar-thumb:hover{background:var(--i2)}
.trwrap::-webkit-scrollbar-track{background:transparent}
/* 省级趋势线下的「该省各市」表 —— 列与读法参照「城市趋势」页那张全量表(ACOLS),
   去掉「省」列(整张表同省)并压紧字号,好塞进 72% 宽的图形栏。
   封高 + 内滚:江苏 38 城,不封顶会把整张卡片顶高、六页一起变高。 */
/* ⚠ 这里**故意不给 max-height / overflow**:整张表交给外层 `.trwrap` 一个滚动条滚。
   原来封 266px 自成一层,现在外层也会滚,就变成**两层嵌套滚动条** ——
   滚到底仍然看不到最后几行,得再去滚里面那层(实测 26 行里最后一行始终不可见)。
   一份内容两个滚动条,是这次加滚动时最容易带出来的毛病。
   thead 的 sticky 不用改:它贴的是最近的滚动祖先,现在就是 .trwrap,效果反而更好
   (表头会在滚过表格上沿后停在顶边)。 */
.pvbox{margin-top:4px;border:1px solid var(--ln-1);border-radius:var(--r-ctl)}
.pvbox table{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
.pvbox th,.pvbox td{padding:3px 7px;border-bottom:1px solid var(--ln-2);white-space:nowrap}
.pvbox thead th{position:sticky;top:0;z-index:1;background:var(--sf);font-weight:700;color:var(--muted);
  border-bottom:1px solid var(--ln-1)}
.pvbox th.r,.pvbox td.r{text-align:right}
.pvbox th.l,.pvbox td.l{text-align:left}
.pvbox tbody tr:hover{background:var(--soft)}
/* 表头可点排序 —— 与「城市趋势」页全量表同一套指示符(.ar),但那边样式挂在 #t0 上,这里要另写 */
.pvbox thead th{cursor:pointer;user-select:none}
.pvbox thead th .ar{color:var(--gray);font-size:var(--fs-xs);margin-left:3px}
.pvbox thead th.on .ar{color:var(--ink)}
.pvbox thead th:hover{background:var(--soft)}
/* 已进入的城加左竖条 —— 一眼看出这个省我们布了哪几城(与全量表同一套视觉语言) */
.pvbox tr.ent td:first-child{box-shadow:inset 3px 0 0 var(--c-in)}
/* ★ 2026-10-08:各市表(#tp2)也加同一条红竖条 —— 省级表早有(.pvbox tr.ent),
   而各市表一直没标。用户口径:「第三 tab 的气泡要一眼看出已进入」;气泡标了、紧挨着的表不标,
   同一屏上两种说法。这一条让「图上的红底」与「表里的红条」互为注脚。 */
.pctbl tr.ent td:first-child{box-shadow:inset 3px 0 0 var(--c-in)}
/* 有 deck 的城整行可点(落点与「本市排名」那格的链接相同,见下方 #cp 的 click 处理)。
   整行可点是为了不用瞄准 80px 宽的数字列。
   ⚠ 必须显式把没 deck 的行打回 default:总表那边有一条全局的 `tbody tr{cursor:pointer}`
   (给 #t0 的展开行用),它会一路继承到这里 —— 不覆盖的话 29/38 行是死的却照样出手型,
   变成「点了没反应」的假承诺;而 hand 光标是这个表里唯一能区分死活的第一眼线索。 */
.pvbox tbody tr[data-deck]{cursor:pointer}
.pvbox tbody tr:not([data-deck]){cursor:default}
.pvbox tbody tr[data-deck]:hover{background:var(--hover)}
#cp circle[data-pv]{cursor:pointer}
.trleg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--i2);margin:0 0 8px}
.trleg i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.trnote{font-size:12.5px;color:var(--mut);line-height:1.7}
.deck{color:var(--navy);text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;font-weight:600;cursor:pointer}
.deck:hover{color:var(--c-in);text-decoration-style:solid}
#t0 .prov{color:inherit;font-size:inherit}   /* 总表里省与城市平级,不再压暗 */
.tag{display:inline-block;padding:1px 6px;border-radius:var(--r-chip);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.tag.g{background:var(--bg-in);color:var(--c-in)} .tag.r{background:var(--bg-out);color:var(--c-out)}
.tag.z{background:var(--ln-soft);color:var(--mut)}
.pill{display:inline-block;padding:1px 6px;border-radius:var(--r-chip);font-size:var(--fs-xs);background:var(--ln-soft);color:var(--i2)}
.neg{color:var(--muted)} .pos{color:var(--green)}

/* ── 下钻 ── */
.det{background:var(--soft)!important;cursor:default}
.det td{padding:0;border-bottom:1px solid var(--gr);text-align:left;white-space:normal;overflow:visible;word-break:break-word}
.det .inner{padding:15px 16px 17px;display:grid;grid-template-columns:1fr;gap:15px;text-align:left}
.blk{text-align:left}
.blk h4{font-size:var(--fs-xs);font-weight:700;color:var(--mut);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}
.blk h4.sub{margin-top:13px}
.ck{display:flex;gap:8px;margin-bottom:6px;font-size:var(--fs-sm);line-height:1.55}
.ck .m{flex:none;font-weight:700;width:13px}
.ck.y .m{color:var(--c-in)} .ck.n .m{color:var(--mut)}
.ck span b{font-weight:600}
.src{font-size:var(--fs-sm);color:var(--i2);line-height:1.8}
.src i{color:var(--mut);font-style:normal;display:inline-block;min-width:44px}
.rule{font-size:var(--fs-sm);color:var(--i2);line-height:1.72}
.rule ul{list-style:disc;padding-left:16px}
.rule li{margin-bottom:3px}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:var(--fs-sm)}

/* ── 搜索高亮:只在图上加类,不重画 ──
   命中圈加粗描边,其余压到 12% 不透明度 —— 用 opacity 而不是换色,因为一个点是
   「圆 + 圆内排名 + 名字」三层,换色要各层分别算,还容易漏掉虚线圆那层边界。 */
.chart g.pt.hl circle{stroke-width:3.4;stroke-opacity:1;stroke:#8e0b20;fill:rgba(200,16,46,.10)}
/* 淡下去的分两档:圆只压描边(它的填充本来就只有 7% 透明,连填充一起压等于把圆抹掉)、
   标签压到 30% —— 目标是「退到背景里但仍看得见轮廓」,不是「消失」。
   一刀切给整组挂 opacity 会两样一起没(实测:整张图只剩高亮那一个点)。 */
.chart g.pt.dim circle{opacity:.45}
.chart g.pt.dim text{opacity:.12}
.chart text[data-lbl].dim{opacity:.22}
.chart text[data-lbl].hl{fill:#8e0b20;font-weight:700;opacity:1}
/* 命中城原本没排上名字时补的兜底标签(清搜索时删掉) */
.chart text.hlf{fill:#8e0b20;font-weight:700;stroke:#fff;stroke-width:3;
  paint-order:stroke;stroke-linejoin:round;font-size:13px}
/* 幽灵点:命中但被本页门槛挡在外面的城。红虚线圈画在 SVG 里,这里只管它的名字 */
.chart text.ghf{fill:#8e0b20;font-weight:700;opacity:.95}
.chart text.ghf,.chart text.hlf{paint-order:stroke}
.chart text.ghf{stroke:#fff;stroke-width:2.6;stroke-linejoin:round}
tbody tr.qhit{background:var(--lt-blue2);box-shadow:inset 3px 0 0 #8e0b20}
.allbar .qbox{width:150px}
/* 挪到最右的那个搜索框(l1/l2/l3):工具条本来就会折成两行,它落在第二行 ——
   不给 auto 外边距的话会贴在**左边**,"移到最右边"就白挪了(实测第一版就是这样)。
   auto 外边距在折行后的那一行里同样生效,所以它会稳定靠右。 */
.allbar .qright{margin-left:auto}
/* 搜索反馈:只说「在不在、为什么不在」,不参与筛选 */
.allbar .smsg{font-size:var(--fs-xs);color:var(--i2);max-width:100%;line-height:1.5}
.allbar .smsg b{font-family:var(--ff-num);color:var(--ink)}
.allbar .smsg .no{color:#8e0b20;font-weight:600}
.allbar .smsg .yes{color:#c8102e;font-weight:600}

/* ── 语料统计条:让「做了多少调研」可见。数字大、标签小,是数据目录的常见排法 ── */
.corpus{display:flex;flex-wrap:wrap;gap:0 34px;padding:11px 18px;background:var(--soft);
  border-bottom:1px solid var(--gr)}
.corpus dl{display:flex;flex-direction:column;gap:1px}
.corpus dt{font-size:var(--fs-xs);color:var(--mut);order:2;letter-spacing:.2px}
  .corpus dd{font-family:var(--ff-num);font-size:var(--fs-md);font-weight:700;color:var(--ink);order:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.15}
.corpus dd small{font-size:var(--fs-xs);font-weight:400;color:var(--mut);margin-left:1px}

/* ── 全量表 ── */
.allbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--gr);background:var(--soft)}
.allbar input,.allbar select,.phead .qbox{font:inherit;font-size:var(--fs-sm);color:var(--ink);background:var(--sf);
  border:1px solid var(--gr);border-radius:var(--r-ctl);padding:5px 9px;outline:none}
.allbar input{width:190px}
.phead .qbox{width:150px;padding:3px 9px}   /* 比 .allbar 的输入框薄一档:这一行要腾给图 */
/* 省级页的「省份下拉」(2026-09-27):输入框右边一个箭头,点开列出 31 省。
   不换成 <select> 是因为还要留住「打字即时过滤」—— 31 个省打一个字就够;
   下拉是给「想不起有哪些省 / 懒得打字」的场景兜底,两种用法并存。
   输入框宽度不变(150px),箭头是绝对定位叠在框内,不挤占 .phead 那一行的横向空间 ——
   那一行的高度和宽度都被图表用着,能不动布局就不动。 */
.qpick{position:relative;margin-left:auto;display:flex;align-items:center}
/* 清单页工具条里的省份筛选器:与各市页那个共用 .qpick/.qmenu,两处不同 ——
   ① 不靠 margin-left:auto 往右推(工具条左侧要连排);
   ② 窄一档(96px):它显示的是 2–3 个字的省名,150px 会把工具条挤折行。 */
.qpick.inbar{margin-left:0}
.qpick.inbar .qbox{width:96px}
.qpick .qbox{padding-right:22px}
.qcaret{position:absolute;right:2px;width:18px;height:100%;border:0;background:none;padding:0;
  cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.qcaret::before{content:'';width:7px;height:7px;margin-top:-3px;
  border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
  transform:rotate(45deg);transition:transform .16s}
.qcaret:hover{color:var(--brand)}
.qcaret[aria-expanded="true"]::before{transform:rotate(225deg);margin-top:2px}
.qmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:100%;max-height:264px;
  overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:7px;
  box-shadow:0 10px 28px rgba(31,35,41,.16);padding:3px}
.qmenu[hidden]{display:none}
.qmenu button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  font:inherit;font-size:var(--fs-sm);color:var(--ink);padding:5px 10px;border-radius:4px;white-space:nowrap}
.qmenu button.hover{background:var(--brand-bg)}
.qmenu button.on{color:var(--brand);background:var(--brand-bg)}
.qmenu .qnone{color:var(--muted);font-size:var(--fs-sm);padding:6px 10px}
.allbar input:focus,.allbar select:focus,.phead .qbox:focus{border-color:#dc5a6d}
.allbar .exp{font:inherit;font-size:var(--fs-xs);color:var(--i2);background:var(--sf);
  border:1px solid var(--gr);border-radius:var(--r-ctl);padding:5px 10px;cursor:pointer;white-space:nowrap}
.allbar .exp:hover{background:var(--ln-soft);border-color:#dc5a6d;color:var(--ink)}
.allbar .fb{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--i2);white-space:nowrap}
.allbar .fb b{font-family:var(--ff-num);font-size:var(--fs-sm);color:var(--ink);min-width:38px}
/* 「生源增幅」门槛:加减号步进器(用户口径 2026-09-27,替掉 <input type=range>)。
   换掉滑块的理由:滑块**读不出当前值** —— 一根杆加两端刻度,调到 −1% 还是 +1% 全靠手稳;
   而这一页的门槛是要反复微调的。加减各一格 + 数字常显,才看得清"现在卡在几"。
   外观沿用量级控件那套(.lvsw:细边 + 分段 + 圆角),三张清单页并排时看着是一家的。 */
.stp{display:inline-flex;align-items:stretch;border:1px solid var(--ln);border-radius:var(--r-ctl);overflow:hidden}
.stp button{font:inherit;font-size:var(--fs-sm);line-height:1;width:22px;padding:3px 0;border:0;
  background:none;cursor:pointer;color:var(--i2)}
.stp button:hover:not(:disabled){background:var(--ln-soft);color:var(--ink)}
.stp button:disabled{color:var(--gray);cursor:default}
.stp b{min-width:46px;text-align:center;font-family:var(--ff-num);font-size:var(--fs-sm);color:var(--ink);
  border-left:1px solid var(--ln);border-right:1px solid var(--ln);padding:3px 4px;
  cursor:text}   /* 数字可点进去直接输入(用户口径 2026-09-28)—— 光标提示它是个输入位,不是纯标签 */
/* 点数字就地变成输入框。尺寸由 JS 按原来那个 <b> 的实测宽度设,免得一编辑整条控件跳一下。 */
.stp .stpin{font-family:var(--ff-num);font-size:var(--fs-sm);color:var(--ink);
  min-width:46px;text-align:center;padding:3px 4px;border:0;
  border-left:1px solid var(--ln);border-right:1px solid var(--ln);
  background:var(--sf);outline:2px solid var(--brand-mid);outline-offset:-2px}
.allbar input[type=number]{width:64px;padding:4px 6px}
/* .allbar .fchip 那两条随「经济档」筹码一起去掉了(2026-09-27 换成数值步进器,无使用者) */
.allbar .cnt{margin-left:auto}

/* ── 记录视图(展开行里的「完整字段」)── */
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:8px 22px}
.fgrp{break-inside:avoid}
.fgrp h5{font-size:var(--fs-xs);font-weight:700;color:var(--mut);letter-spacing:.5px;
  margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--gr)}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm);
  line-height:1.75;border-bottom:1px dotted var(--ln-1)}
.frow:last-child{border-bottom:0}
.frow .k{color:var(--mut)}
.frow .v{font-variant-numeric:tabular-nums;text-align:right}
.frow .v i{font-style:normal;color:var(--mut);font-size:var(--fs-xs);margin-left:2px}
.fsrc{margin-top:14px;font-size:var(--fs-sm);color:var(--i2);line-height:1.7;word-break:break-all}
.fsrc a{color:var(--c-in)}
.allbar .cnt{margin-left:auto;font-size:var(--fs-sm);color:var(--mut);font-variant-numeric:tabular-nums}
.phead .cnt{font-size:var(--fs-sm);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 表格区高度由 JS 里的 fitAll() 对齐到卡片高度 ——
   卡片高度由最高的那一页(①的气泡图)决定。纯 CSS 做不到:
   flex:1 填的是「父容器已定的空间」,而这里父容器高度恰恰由内容自己决定,
   431 行会把卡片顶到 14000px(实测踩过)。写死 72vh 又会反过来留 374px 空白。 */
.paneAll{overflow:auto}
.paneAll table{font-size:var(--fs-sm)}
/* 数值列走等宽栈。文字列(城市/省/级别/结论)保持比例字体,中文才不会被拉散 */
#t0 tbody td:not(.l),#t0 thead th.r{font-family:var(--ff-num)}
/* 总表表头与正文同字号:默认表头是 --fs-xs(11.5) 比正文小一档,这里拉平。
   只在总表这么做 —— 三张窄表的列宽只有 30~70px,表头涨到 12.5 会溢出。 */
/* 行高压紧 —— 密度本身就是「数据量大」的视觉信号,一屏多出约 15% 行 */
#t0 tbody td{padding-top:5px;padding-bottom:5px}
#t0 thead th,#t0 tbody td{padding-left:9px;padding-right:9px;text-align:center;font-size:var(--fs-sm)}
/* 列线:431 行 × 10 列,没有竖线读起来会串行 */
#t0 thead th+th,#t0 tbody td+td{border-left:1px solid var(--ln-3)}
#t0 tbody td{border-bottom:1px solid var(--ln-2)}
/* 展开行是整格(只有 1 个 td),不能吃表格单元格的内边距 —— 它有 .inner 自己的留白。
   ID 选择器权重高于 .det td,所以必须在这里显式清零,否则展开行上下会多出 5px。 */
#t0 tbody tr.det td{padding:0}
#t0 tbody tr:hover td{background:var(--hover)}
/* 总表内容一色到底:涨跌、缺失、行号都不靠颜色区分 —— 颜色留给「*」这种口径告警 */
#t0 .pos,#t0 .neg,#t0 .rk,#t0 .pill{color:inherit;background:none}
/* 表头与单元格统一居中(见上一条 #t0 规则里的 text-align:center)。
   10 列宽窄不一,左/右对齐会让标签压不到数据上,视觉上歪。 */
/* 两行表头的 sticky:第一行贴顶,第二行贴在第一行下方(30px = 上面写死的第一行高度) */
#t0 thead tr:first-child th{top:0;height:30px}
/* 表头下压一条 2px 结构线 —— 表头与数据的分界,也是整张表的视觉锚 */
#t0 thead tr:last-child th{border-bottom:2px solid var(--ln-1)}
#t0 thead th{border-bottom:1px solid var(--ln-1)}
#t0 thead tr:nth-child(2) th{top:30px}
#t0,#tp thead th[data-s],.pctbl thead th[data-s],
#t1 thead th[data-sk],#t2 thead th[data-sk],#t3 thead th[data-sk],
#tBig thead th[data-sk],#tThin thead th[data-sk]{cursor:pointer;user-select:none}
#t0{background:var(--sf)}
#tp thead th[data-s]:hover,.pctbl thead th[data-s]:hover,#t0 thead th[data-s]:hover,
#t1 thead th[data-sk]:hover,#t2 thead th[data-sk]:hover,#t3 thead th[data-sk]:hover,
#tBig thead th[data-sk]:hover,#tThin thead th[data-sk]:hover{background:var(--ln-2)}
#t0 thead th.grp{background:var(--ln-2);color:var(--i2);font-weight:700;letter-spacing:.6px}
#t0 thead th.grp:not(:first-child){border-left:1px solid var(--gr)}
#t0 thead th .ar,#t1 thead th .ar,#t2 thead th .ar,#t3 thead th .ar,
#tBig thead th .ar,#tThin thead th .ar{color:var(--gray);font-size:var(--fs-xs);margin-left:3px}
#t0 thead th.s1 .ar,#t0 thead th.s2 .ar,
#t1 thead th.s1 .ar,#t1 thead th.s2 .ar,#t2 thead th.s1 .ar,#t2 thead th.s2 .ar,
#t3 thead th.s1 .ar,#t3 thead th.s2 .ar,
#tBig thead th.s1 .ar,#tBig thead th.s2 .ar,
#tThin thead th.s1 .ar,#tThin thead th.s2 .ar{color:var(--ink)}
.tag.d{background:var(--bg-deep);color:var(--c-deep)}
.altw{color:var(--c-deep);font-weight:700;margin-left:1px;cursor:help}
.es{display:inline-block;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.es.in{color:var(--c-in)} .es.out{color:var(--i2)} .es.unk{color:var(--gray);font-weight:400}
</style>
</head>
<body>
<!-- 顶栏(品牌红条 + 「学成事业部战略规划共创会」)按用户口径 2026-09-28 整块删除:
     ① 那行字和会议材料/口播重复,不承担导航;
     ② 它占的 ~46px 正好补回 tab 副标题吃掉的 11px —— 拆掉之后卡片反而比加副标题之前更高。
     红条的品牌作用由卡片内的元素承担(标题条、基准线、tab 选中态),页面不再需要一条通栏色带。 -->
<div class="wrap">

  <div class="tabs" id="tabs">
    <!-- 八个 tab,一律做 .tabs 的直接子元素 ——
         ⚠ 别在中间再包一层容器:space-between 只作用于自己在的那一层,
         嵌套 flex 的话组内的 tab 会贴死(实测组内 0px、组间 178px)。 -->
    <!-- 分组已按用户口径去掉(2026-09-27):不再画组分隔线,八项一律平等。 -->
    <button class="tab nat" data-k="nat"><span class="tt">全国生源趋势</span><span class="ts">三条学段曲线:哪年见顶、窗口还剩几年</span></button>
    <!-- 这一页的取名走过**四轮**(用户口径 2026-09-27),四轮才落定,理由值得留着:
         ① 原「省级趋势」→ 承诺了首屏是曲线,而实际是散点(31 省:生源增幅 × 城镇收入),
            趋势线要点气泡才有;
         ② 一度改成「各省生源格局」,为的是与前后两页排成「趋势 / 格局 / 明细」的阶梯 ——
            但**那三页根本不是同一种东西**(曲线 / 散点 / 全量表),硬排平行等于承诺一种
            并不存在的同形。用户反馈"不太匹配这页的内容",症结在此。
         ③ 又改成「各省生源概览」:「概览 / 明细」是现成的粗看/细看一对,阶梯感留着;
            但用户仍觉得不匹配 —— 症结是**三个名字都是抽象形状词**(趋势/格局/概览),
            没有一个说出这一页靠什么下判断。
         ④ 现名「各省生源 × 收入」:把**两根轴**直接当名字(X 生源涨幅 / Y 城镇收入)。
            (「生源×经济」是原来的对照组页,已于 2026-09-28 移除;这一页仍用同一套两轴命名法)
            两个 × 摆在一起反而说明这两页是一类东西。 -->
    <button class="tab prov" data-k="prov"><span class="tt">各省生源×收入</span><span class="ts" id="tsProv">生源增幅 × 城镇居民人均可支配收入</span></button>
    <!-- ★ 序号 2026-09-28 **加了又拿掉**,两次都是用户口径:
         · 加(「整个数据的展示是一步步从左到右推的」)—— 只给前三个(全国/各省/各市),
           那是一串真下钻,序号恰好在说"这三步是往下钻";
         · 同日拿掉(「tab 上的 123 拿掉」)—— 一屏三个之后,序号的意义被稀释了:
           tab 条本身在横向滚动、选中项居中,读者已经在"一屏一屏地推",不再需要数字提示顺序;
           而且数字只挂在前三个上、后七个没有,一排看过去反而像"3 之后怎么就没编号了"。
         ⚠ 它当年还带来过一整套宽度妥协(为「3 各省生源×收入」122px 而按视口分档降字号)。
           那套已随「一屏三个」删干净 —— 别再照着老注释去找那些媒体查询。 -->
    <!-- ★ 2026-09-28 改名:「各城生源明细」→「数据池」(用户口径)。
         这一页是**底表**,不是一张分析 —— 前七个 tab 都在说"看什么分析",只有它是"原始数据在这"
         (452 城 × 61 字段,可搜、可导、可点行展开)。用「数据池」把身份说明白,
         也就不必跟前面那串"市场 / 格局 / 趋势"凑同一个句式。
         副标题仍是「全库逐城底表」—— 标题说**性质**(池),副标题说**形状**(逐城、底表),不重复。
         沿革:它 2026-09-27 从「城市趋势」改成「各城生源明细」(理由:首屏是表、不是曲线),
         次日再改成「数据池」—— 同一判断推到底:它压根不是分析页,是数据页。
         ⚠ 它**不在** 全国→各省→各市 那串下钻里 —— 那三级是"看一个地方",这一页是
         "把全国 452 城横向摊开"的底表,所以被挪到了末位。现在它是**八个** tab 的最后一个。 -->
    <!-- 「各市生源概览」= 「各省生源 × 收入」的"一个省"版本(用户口径 2026-09-27):
         结构完全复刻(气泡散点 + 两条基准线切四象限 + 右侧明细表 + 点气泡下钻),
         只是把"31 个省各一个点"换成"某省里的各市各一个点",顶部多一个**选省**下拉(默认广东)。
         与「数据池」的分工:那个是 452 城全量表(横向看全国),这个是**纵向看一个省**。 -->
    <button class="tab pc" data-k="pc"><span class="tt">广东各市概览</span><span class="ts">广东各市格局</span></button>
    <!-- ★ 2026-10-08 新增(用户口径「再做一个 tab 放这个 tab 之后,默认河北」)。
         与上一页**同构同代码**(共用 PCV/redrawPC/renderPC/监听器),差别只有默认省份:
         pc2 初值 PCSEL='河北'。所以两页长得一样、行为一样,只是打开时看的是不同的省。 -->
    <!-- ★ 2026-10-08 用户口径「河北后边放一个 tab 北京」。同构同代码(PCV.pc3),默认省=北京;
         北京是直辖市,右表只有一行 —— pcEmpty() 里已有这个情形的说明文案。 -->
    <button class="tab pc3" data-k="pc3"><span class="tt">北京概览</span><span class="ts">北京市内格局</span></button>
    <!-- ★ 2026-10-08 用户口径「北京后边上海 上海后面浙江天津江苏 福建」——
         同一份省视图再复制 6 份(PCV.pc4…pc8),顺序即用户报的顺序。 -->
    <button class="tab pc4" data-k="pc4"><span class="tt">上海概览</span><span class="ts">上海市内格局</span></button>
    <button class="tab pc5" data-k="pc5"><span class="tt">浙江各市概览</span><span class="ts">浙江各市格局</span></button>
    <button class="tab pc6" data-k="pc6"><span class="tt">天津概览</span><span class="ts">天津市内格局</span></button>
    <button class="tab pc7" data-k="pc7"><span class="tt">江苏各市概览</span><span class="ts">江苏各市格局</span></button>
    <button class="tab pc8" data-k="pc8"><span class="tt">福建各市概览</span><span class="ts">福建各市格局</span></button>
    <!-- ★ 2026-10-08 用户口径:「福建往后继续,按各省生源×收入那个 tab 里的顺序,从右上一直到左下」。
         顺序 = 高中生源增幅降序、同档按城镇居民收入降序(即气泡图里那条从右上到左下的斜线)。
         已在前面的 8 个省跳过,其余 23 个按此排队;1 个直辖市(重庆)也在其中。 -->
    <button class="tab pc9" data-k="pc9"><span class="tt">陕西各市概览</span><span class="ts">陕西各市格局</span></button>
    <button class="tab pc12" data-k="pc12"><span class="tt">青海各市概览</span><span class="ts">青海各市格局</span></button>
    <button class="tab pc13" data-k="pc13"><span class="tt">甘肃各市概览</span><span class="ts">甘肃各市格局</span></button>
    <button class="tab pc14" data-k="pc14"><span class="tt">广西各市概览</span><span class="ts">广西各市格局</span></button>
<button class="tab pc2" data-k="pc2"><span class="tt">河北各市概览</span><span class="ts">河北各市格局</span></button>
        <button class="tab pc16" data-k="pc16"><span class="tt">贵州各市概览</span><span class="ts">贵州各市格局</span></button>

function cells(k,r){

  // ⚠ 缺值时**不给 pos/neg 类**:`null>=0` 为真,原来会给缺增幅的格子套上 `pos`(绿)——
  //   一个绿色的「—」看着像正增长(2026-09-29 修,顺手改的是全页共用这一处)。
  const g='<span class="'+(_rd==null?'':(_rd>=0?'pos':'neg'))+'">'+pct(_rd)+'</span>'
    +(LV==='jun'&&r.g3s?'<span class="altw" title="该城初中生源增幅窗口取 '+r.g3s+'，非默认 26–28">*</span>':'');

  // 顺序必须与 COLS 一一对应(l1/l3 的「2025 在校生」在第四列,紧跟平均增幅)
  const hs = _pl==null?'—':_pl.toFixed(2)+ySup(r);

  //   也把那一列换掉 —— **纵轴的值在表里读不到就只能靠悬停**,而投屏时用不上悬停。
  //   经济分**没有丢**:它仍是筛选条件(工具条那个「经济分 ≥」步进器),气泡的悬停里也还写着。
  const inc = r.pci==null ? '—' : (r.pci/10000).toFixed(1);
  if(k==='l1') return [cty,pv,g, hs, inc];
  if(k==='l2') return [cty,pv,g, inc, r.campus, rankCell(r)];

  if(k==='free') return [cty,pv, hs, g, inc, rankCell(r)];   // 列与 big 同款(见 COLS.free)

  year:(v,r)=>v==null?null:(String(v)+(r&&r.win===false

  pc_gdp:(v,r)=>v==null||!r.pop?null:(v/r.pop).toFixed(2)+' 万元/人',
  pc_dep:(v,r)=>v==null||!r.pop?null:(v/r.pop).toFixed(2)+' 万元/人',

// ── 生源趋势线(展开行内嵌 SVG)──────────────────────────────
// 方法见 docs/review/方法_城市生源趋势线.md:初中在校(y) ∝ Σ招生(y−8,y−7,y−6)、高中 ∝ Σ招生(y−11,y−10,y−9)。
// 指数化(2025=100)后系数全约掉 → 线只由小学招生决定。数据 D.trend(来自 data/trend_lines.json,288 城)。
// ⚠ 两条线的指数不能直接比大小(基准不同),只比形状与峰值年 —— 图上标峰值就是为了这个。
// 全国参照线是官方在校序列(出生法),与城市线的队列法不是同一方法,只作参照。
// 曲线配色:初中/高中两个深红(品牌红系),全国对照线用对应的浅色。
// 小学 2026-09-28 加入时**没再取第三种红** —— 两个红已经占满这套色,再来一个会让人分不清
// 哪条是哪条;小学用墨色(--i2)+ 浅灰对照线,读起来是"第三条",不是"另一种红"。
// 线色。★ 2026-09-30(ncol 那一组):「全国参考」三条原来是**红的**
// (高中 #dc5a6d / 初中 #f6c9d0),而图例文字写的是「灰虚线」—— 文字与颜色不符,是真错。
// 用户口径:「全国参考线就别用红色了,调成灰色吧」。
// 现在 n* 三个统一成同一个中立灰:三条参考线同一个身份,跨学段不该换色;
// 且与两个学员段的 own 色(红 #c8102e / 暗红 #8e0b20 / 石板灰 #5f6670)都能分开。
// ⚠ 改这里要连图例文字一起想:P25 有一条断言钉「n* 必须是灰的(R≈G≈B)」,防止
//   谁把它调回彩色而图例照旧写着「灰虚线」。
const TC={j:'#8e0b20',g:'#c8102e',nj:'#b0b6bd',ng:'#b0b6bd',p:'#5f6670',np:'#b0b6bd'};
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const m=x/p;

function trendBlk(r){
  const T=D.trend;

  //   改成现数(Object.keys(T.c).length),和缺口页那句「能画线 332」同源,不会再飘。
  if(!t) return head+'<div class="ck n"><span class="m">—</span><span>画不出趋势线:<b>该城小学招生序列未采齐</b>。'

    +Object.keys(T.c).length+' 城够线。</span></div></div>';

  const _blk=(cap,which)=>{ const g=trendSVG(t,r.c,which);

      + (g || '<div class="ck n"><span class="m">—</span><span>该城这一档没有可画的序列(缺该档所需年份的小学招生,见下方招生序列覆盖)。</span></div>'); };

// 图上直标用的短名:广东省→广东、内蒙古自治区→内蒙古、上海市→上海
function shortName(n){ return String(n||'').replace(/(壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区|省|市)$/,''); }
function trendSVG(t,city,which,HH){

  // ⚠ 原先是 `isG`(二元),加小学时**不能**再写成 `isG?x:y` —— 那种写法每加一档都要把
  //   五个分支各改一遍,漏一个就是"小学那张图印着初中"。改查表。
  // ★ 2026-09-29 加两件事(用户口径「x和y轴没有显示出来」):
  //   ① 画**轴线** —— 原来只有刻度数字 + 极浅网格线(#e6e8eb,投屏上几乎看不见),
  //      数字是"浮"在空中的,看着就像没有轴;
  //   ② 补轴名(纵轴「指数」、横轴「年份」)—— 数字有单位却只有图内标题里那句才说得出,
  //      投屏时标题常常在视野外。
  //   ⚠ HH 可选:这一函数被四处调用(省级/各市趋势视图、表格展开行)。**默认 232 保持原样**,
  //     只有「合成一张图」的那两个视图传更大的值把图放高。
  const Y=D.trend.y, n=Y.length, W=880, H=HH||232, L=44, R=120, BT=30;
  const TSPEC={
    // ★ 2026-09-30 加 `alt`:那条**纯小学招生队列模型**的对照线(gq/jq,生成器覆盖前存下来的)。
    //   为什么两条都画:主力线(实测+推算)在 2026–28 吃**实测初中在校**、2029+ 吃**初中池(由小学招生推)**,
    //   中途换了一次信息源 —— 那是个接缝。队列线全程只吃小学招生,内部一致,但看不见初中段的净流入。
    //   **两线之差就是初中段的净流入**(河北 1.7%、上海 17%),那是个读数,不是矛盾 —— 所以两条都留。

    g:{own:'g',nat:'g',alt:'gq',col:TC.g,ncol:TC.ng,label:'高中',dash:'2 3',pk:'gp',pv:'gv'},

  // 得先知道它在不在。

  //   每条线在**图里**写清自己的数据来源,颜色与那条线一致(粗细/透明度也对齐),
  //   读者不用回头找图例、也不用猜。TP 从 18 抬到 32 给这一行让位。

    _LG.push([ncol,'灰虚线 = 官方全国'+TSPEC.label+'在校公报序列',0]);
    _LG.push(['#8a9099','※ 两条红线之差 = 初中段净流入',0]);   // ※ 标成注解,与「灰虚线」那条区分
  }else{
    _LG.push([col,'实线 = 纯小学招生队列模型(城市层没有在校实测历史)',0]);
    _LG.push([ncol,'灰虚线 = 官方全国'+TSPEC.label+'在校公报序列',0]);

  //   332 个城市一个都没有;省级那 31 个都有,所以 tab2 不中招)。

    s+='<text x="'+(L-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="'+(is100?'#1f2329':'#8a9099')+'"'+(is100?' font-weight="700"':'')+'>'+Math.round(v)+'</text>';

  // 颜色比网格深一档(#b9bfc7),投屏上看得见、又不至于和 #brand 抢视线。

    +'<text x="'+(L-8)+'" y="'+(TP-4)+'" text-anchor="end" font-size="10" fill="#8a9099">指数</text>'
    +'<text x="'+(W-R)+'" y="'+(H-BT-6)+'" text-anchor="end" font-size="10" fill="#8a9099">年份</text>';
  const path=(arr,color,dash,w,op)=>{ let d='',open=false;
    arr.forEach((v,i)=>{ if(v==null){open=false;return;} d+=(open?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; open=true; });

  // 队列模型对照线:同色、更细、虚线、压暗 —— 它是同一个量的另一种算法,不是另一条量。

// ── SVG 小工具 ──
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function txt(x,y,s,a){const t=el('text',Object.assign({x:x,y:y,'font-size':FS_AX,fill:'#5f6670'},a||{}));t.textContent=s;return t;}
// 序数词后缀:1st / 2nd / 3rd / 4th …。11–13 一律 th(11th,不是 11st)——
// 按个位数取后缀的写法会在这三个数上出错,而 rank 的取值范围正好覆盖到它们。
function ord(n){const m=n%100; if(m>=11&&m<=13) return n+'th'; const d=n%10;
  return n+(d===1?'st':d===2?'nd':d===3?'rd':'th');}

// ① 气泡散点：X=生源红利%(随口径为高中或初中)  Y=经济综合分  气泡=在校生规模(26–28均值,万人)
// 风格参考 dashboard_province_junior_rank.html:空心圆 + 虚线网格 + 轴名居中 + 基准线
function chart1(host,rows,opt){
  // 卡片高度由最高那页决定,所以四张图的纵向尺寸要一起压 —— 只压一张的话
  // 下一高的那张会接着顶住,白压。本轮统一 ×0.85。
  // W 可覆盖:三张清单页仍是 72% 宽的左栏(700),「竞争格局」页删掉右栏后独占整宽,
  // 传 1000 —— 画布变宽 = 同样的数据范围摊到更多单位上,标签自然松开,而 H 不变,
  // 卡片高度也就不会被这张图顶高。缩放比 1252/1000 ≈ 1.25,与 SVG_K=1.283 基本一致,
  // 字号不用另算(差 2%,肉眼不可见)。
  opt=opt||{};
  const W=opt.W||700, H=(opt.H||507)*CHS*CF(host.id);
  const P={l:58,r:22,t:12,b:46};   // 左内边距 58 = 刻度标签的位置(曾经还要给「缺数据」车道让 84px,那条车道已删)
  const s=el('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});
  // 取值函数可覆盖:RF = 半径依据(默认在校生,五页一致),YF = 纵轴(「红利大市场」页换成在校生规模)。
  // (原还有一个 XF 与一层"背景点"BG,是给已移除的「生源×经济」页用的,2026-09-28 一并删掉。)
  const RF=opt.RF||POOL_OF, YF=opt.YF||function(r){return r.econ;};
  const XF=RED_OF;
  // 幽灵层:搜索命中、但被本页门槛挡在门外的城。画成红色虚线空心圈 —— 让「搜得到但没进清单」
  // 有个落点,而不是只在文字里说一句。
  // (曾经还有一个「缺数据车道」层 —— 在本页清单里但算不出坐标的城,2026-09-28 按用户口径删掉了。
  //  与幽灵点的区分当年靠**颜色**:
  //   红虚线 = 不在本页清单里(被门槛挡掉);墨色虚线 = 在清单里、但算不出坐标。
  //   两者都画成虚线,只有颜色分得开 —— 改其中一层的样式时必须回头看另一层。
  // ⚠ 它**不进轴范围**。进了的话,搜一座离群的城(鸡西 −14%)会把轴从 [5,24] 拉成 [−14,24],
  // 本页那 42 个点全被挤成右边一小撮 —— 为了标一个陪衬把主角弄没了。
  // 出界的幽灵点改为**贴边**绘制并在标签上标出方向(◀▶▲▼),轴仍然是本页自己的轴。
  const GH=opt.GHOST||[];
  const ALL=rows;
  const X=ALL.map(XF), Y=ALL.map(YF).filter(function(v){return v!=null;});
  let x0=Math.min.apply(null,X), x1=Math.max.apply(null,X);
  let y0=Math.min.apply(null,Y), y1=Math.max.apply(null,Y);
  // ★ 一个可定位的点都没有时(本页全是缺轴的城,或被省份筛到只剩它们),
  //   空数组的 Math.min/max 会给出 ±Infinity → 轴范围 NaN → 网格线、刻度、标签全部
  //   渲染成 `attribute="NaN"`,控制台刷一串错、图上空白。
  //   给个 0..1 的占位区间:这时图里本来就没有点,轴只是**为了把「缺数据」车道画出来**而存在。
  //   (当年是车道那版引入的;车道删了,这条兜底留着 —— 任何"一个可定位的点都没有"的情形都要它。)
  if(!isFinite(x0)||!isFinite(x1)){ x0=0; x1=1; }
  if(!isFinite(y0)||!isFinite(y1)){ y0=0; y1=1; }
  // 占位区间下别再往轴上贴「全国基准」这类真实数值 —— 单位对不上,会误导
  const PLACEHOLDER=(ALL.length===0);
  const pad=(a,b,f)=>((b-a)*f)||1;
  // 横基准线:默认 = 经济分全国中位;opt.HLINES 可换成别的
  // (「红利大市场」页换成两条在校生门槛,因为那一页的纵轴已经不是经济分了)。
  // ⚠ 定义**必须提到轴计算之前** —— 下面要把轴扩到能把它们包进来(见「轴要装得下基准线」那段)。
  // ⚠ 占位模式下一个可定位的点都没有,轴是 0..1 的假区间 —— 这时**不能画基准线**:
  //   线会落在 45000 那种真实数值上,把轴从 0..1 一路拉到 0..45000,变成一张更离谱的空图。
  const HL=PLACEHOLDER ? [] : (opt.HLINES || (D.econ_base!=null ? [{v:D.econ_base, txt:'全国中位 '+D.econ_base.toFixed(0)}] : []));
  const hlLabels=[];
  // X 轴下界:若全国基准落在数据左侧,一并纳入,让对比可见
  // 轴两端留白收到 0.06(与省级页同一口径):数据铺得更满。
  let xa=x0-pad(x0,x1,.06), xb=x1+pad(x0,x1,.06);
  // 全国基准随口径走:高中 +5% / 初中 −1%(与省级页同源)
  const natB = (LV==='high') ? D.nat_base : (LV==='jun' ? D.nat_base_j : null);  // 小学没有全国基准线,不画
  // ── 轴要装得下基准线(2026-09-28 用户口径「两条基准线都显示出来」)──
  // 原来只做了「基准落在数据**左侧**时把 X 轴拉过去」这一半,于是:
  //   · 存量红利市场(经济分 56~99、中位 49)→ 横线在轴外,画不出来;
  //   · 红利消退市场(增幅 −5~4、基准 +5)→ 竖线在轴外,同样画不出来。
  // 现在四个方向都补上。**扩轴而不是贴边画**:贴边的线位置是假的,而读基准线读的就是位置。
  // 代价:那一页会多出一块空白(存量红利市场的下半屏),这是"让人看见基准"应付的价。
  if(!PLACEHOLDER && natB!=null && natB<xa) xa=Math.min(xa, natB-pad(x0,x1,.04));
  if(!PLACEHOLDER && natB!=null && natB>xb) xb=Math.max(xb, natB+pad(x0,x1,.04));
  // yb 的上限默认 100(经济综合分是 0–100 的百分位);opt.YMAX 用来放开它
  // ——「红利大市场」页的纵轴换成了在校生(万),最大 68.9,顶在 100 上会把图压扁一半。
  let ya=Math.max(0,y0-pad(y0,y1,.06)), yb=Math.min(opt.YMAX!=null?opt.YMAX:100, y1+pad(y0,y1,.06));
  // 纵轴也按横基准线扩:每条都要能落在轴内,否则画不出来
  HL.forEach(function(h){
    if(h.v==null) return;
    const d=pad(y0,y1,.04);
    if(h.v<ya) ya=Math.max(0, h.v-d);
    if(h.v>yb) yb=Math.min(opt.YMAX!=null?opt.YMAX:1e9, h.v+d);
  });
  const px=v=>P.l+(v-xa)/(xb-xa)*(W-P.l-P.r);
  const py=v=>H-P.b-(v-ya)/(yb-ya)*(H-P.t-P.b);
  // ⚠ 占位区间(一个可定位的点都没有)下**不画网格与刻度**:那几档写出来是 0.0/0.0/0.0
  //   和 −0.1%~+1.1%,全是假数字 —— 一张没有点的图,轴上的数只能骗人。
  if(!PLACEHOLDER) for(let i=0;i<=4;i++){
    const v=ya+(yb-ya)*i/4, y=py(v);
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,stroke:'#e6e8eb','stroke-width':1,'stroke-dasharray':'3 3'}));
    s.appendChild(txt(P.l-8*FS_B,y+3.5*FS_B,opt.YTICK?opt.YTICK(v):v.toFixed(0),{'text-anchor':'end'}));
  }
  // 标签占位表(先放基准线标签,城市标签再避让)
  const boxes=[];
  // 估算文本宽高一律乘 FS_B:这里是给标签避让用的**占位框**,不是画出来的东西。
  // 字号改了而占位框没改,避让就会失效 —— 名字开始互相压,而且只在密集处出现,很难看出原因。
  const tw=(n,u)=>n.replace(/[^\x00-\xff]/g,'xx').length*(u||4.9)*FS_B;
  // 基准线:全国基准(竖线) —— 用全国地级市整体,而非本清单中位
  // (本清单是按「红利≥全国基准」筛出来的,清单内中位必然高,做参照系没有区分力)
  const med=natB;
  if(med!=null && med>xa && med<xb){
    s.appendChild(el('line',{x1:px(med),x2:px(med),y1:P.t,y2:H-P.b,stroke:BASEC,'stroke-width':1.5,'stroke-opacity':.8,'stroke-dasharray':'6 4'}));
    // ⚠ 这行属于 chart1(五张清单图),那张图**只有**全国基准一种,所以写死「全国」;
    //    下面 chartProv 里有一行长得几乎一样的,那行才认 opt.BASE_NAME(各市页要写「全省」)。
    //    两个函数里同名的基线代码是这次差点踩的坑:改了一处、另一处跟着报 bn is not defined。
    var medTxt='全国基准 '+(med>0?'+':'')+med+'%', medX=px(med)+5, medY=P.t+11*FS_B;
    boxes.push({x0:medX-1,x1:medX+tw(medTxt),y0:medY-12*FS_B,y1:medY+2*FS_B});
  }
  // 基准线(横):HL 已在轴计算之前定义好(见那里),这里只画线并记下标签位置。
  // 每项 {v, txt}:v 仍要落在轴内才画 —— 扩轴逻辑保证了正常情况下它一定在。
  HL.forEach(function(h){
    if(h.v==null || !(h.v>ya && h.v<yb)) return;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:py(h.v),y2:py(h.v),stroke:BASEC,'stroke-width':1.5,'stroke-opacity':.8,'stroke-dasharray':'6 4'}));
    // 只记位置,**字压在上层再画**(见下面「基准线标签压在上层」那段):
    // 在这里画的话会被后画的气泡盖住。这是原来 ebTxt 那套两段式的做法,照搬。
    const _x=W-P.r-4, _y=py(h.v)-5*FS_B;
    hlLabels.push({x:_x,y:_y,txt:h.txt});
    boxes.push({x0:_x-tw(h.txt),x1:_x,y0:_y-11*FS_B,y1:_y+1*FS_B});

  // y 轴名(居中,旋转)
  // (x 曾经要按「缺数据」车道的宽度右移 —— 车道 2026-09-28 删掉后回到写死 13。)
  const yMid=(P.t+H-P.b)/2, yx=13;
  if(!PLACEHOLDER) s.appendChild(txt(yx,yMid,opt.YLAB||'经济综合分(0-100)',{transform:'rotate(-90 '+yx+' '+yMid+')','text-anchor':'middle',fill:'#5f6670','font-size':FS_AX}));
  // x 轴刻度 + 轴名(居中)
  if(!PLACEHOLDER) for(let i=0;i<=4;i++){
    const v=xa+(xb-xa)*i/4;
    s.appendChild(el('line',{x1:px(v),x2:px(v),y1:P.t,y2:H-P.b,stroke:'#e6e8eb','stroke-width':1}));
    // 窄区间(红利消退市场那批红利只在 −5%~−2%)取整会把刻度压成「−4% −4%」重复值,
    // 区间不足 10 个百分点时留一位小数。
    s.appendChild(txt(px(v),H-P.b+16,axPct(v,(xb-xa)<10?1:0),{'text-anchor':'middle'}));
  }
  // 轴标题贴在**图的最下沿**(用户口径「它不应当在底部吗」):原来锚在 H−9·FS_B,离下沿还差一截。
  // 锚到 H−3·FS_B 后它就在 SVG 底边上,再靠 .paneR 的下内边距收到 4px 贴住卡片底。
  s.appendChild(txt((P.l+W-P.r)/2,H-3*FS_B,
    PLACEHOLDER ? '本筛选下没有可定位的城'
                : (opt.XLAB||'生源增幅(2026–28 vs 2025,%) →'),
    {'text-anchor':'middle',fill:'#5f6670','font-size':FS_AX}));
  // 气泡:空心圆,大小 = 在校生(随口径为高中或初中)
  // 排序只用来看绘制次序(大的先画,小的压在上面不被盖),与筛选无关。
  // 背景层先画:已进入的城,浅灰实心、无标签、不可点,只当参照系
  // RAD = 固定半径(px)。「红利大市场」页用它:那一页的纵轴本身就是盘子大小,
  // 面积再编码一次只会重复。
  const RAD=('RAD' in opt)?opt.RAD:null;
  GH.forEach(function(r){
    if(XF(r)==null||YF(r)==null) return;
    const vx=XF(r), vy=YF(r);
    // 贴边:出界就压到画布内侧 9px,并记下方向。方向会进标签和 tooltip ——
    // 光画一个贴在边上的圈会让人以为它真的在那儿。
    const IN=9;
    let cx=px(vx), cy=py(vy), dir='';
    if(vx<xa){ cx=P.l+IN; dir+='◀'; } else if(vx>xb){ cx=W-P.r-IN; dir+='▶'; }
    if(vy<ya){ cy=H-P.b-IN; dir+='▼'; } else if(vy>yb){ cy=P.t+IN; dir+='▲'; }
    const c=el('circle',{cx:cx,cy:cy,r:RAD!=null?RAD:5.5*Math.sqrt(RF(r)||0),
      fill:'#fff',stroke:'#8e0b20','stroke-width':1.8,'stroke-dasharray':'4 3','stroke-opacity':.9});
    // 幽灵点也要能被 hlChart 找到名字 —— 否则搜到一座被门槛筛掉的城,图上有个圈却不知道是谁
    c.setAttribute('data-ghost',r.c);
    if(dir) c.setAttribute('data-dir',dir);
    const gt=el('title');
    gt.textContent=r.c+' · 有本页两轴的值,但不满足本页筛选条件'
      +(dir?' · 该点在画布外,箭头指的方向才是它的位置(画布只按本页入选城市定轴)':'')
      +' —— 详见筛选栏提示';
    s.appendChild(c); s.appendChild(gt);
  });
  const pts=rows.slice().sort((a,b)=>(RF(b)||0)-(RF(a)||0)).map(r=>({
    r:r, cx:px(XF(r)), cy:py(YF(r)),
    // 半径 ∝ √在校生 → 面积 ∝ 在校生,人眼按面积判大小,这才是等比例。
    // 不加常数项:高中口径下最小也是 1.4 万(县城门槛),初中口径 2.8 万,都够画出可见的圆。
    rad:RAD!=null?RAD:5.5*Math.sqrt(RF(r)||0) }));
  pts.forEach(p=>{
    // data-c 是搜索高亮的抓手:高亮走纯 DOM(只加 class),不重画整张图 ——
    // 重画会把贪心排出来的标签位置整套重排,人正盯着一座城,它的名字会跳到别处去。
    const g=el('g',{class:'pt','data-c':p.r.c});
    // 县级市**不再用虚线圆**(用户口径 2026-09-27「不要虚线圆,都是实线」):原来虚线是为了标
    // 「它的经济分是县城池内百分位,与地级点不是一把尺」,现在这条改由**表格的「级别」列**承担。
    // ⚠ 幽灵点(搜索命中、没过门槛的那些)**仍是红虚线圈** —— 那是另一回事:它只在搜索时出现,
    // 而且虚线是它"不在本清单"的唯一标记,去掉就与真入选的城分不出来了(见 GH 那段)。
    // 气泡只描边、不填充(用户口径 2026-09-27 两轮:先去掉红,再去掉填充)。
    // 红留给标题条、
    // 全国生源趋势那三条线、以及搜索命中态。数据本体退成黑白灰。
    // ⚠ 先铺一块**透明命中盘**再画可见的那个空心圆(踩过,2026-09-27):
    //   去填充之后圆是 `fill:'none'` —— 而 fill:none 的元素**内部不参与命中测试**,
    //   只有那一圈描边能点。于是"点气泡中心"什么都不发生。
    //   这一页尤其明显:圆内没有排名数字(L1 的 rank 全为空),点名又画在 <g> **外面**,
    //   中心那一击谁也接不住。L2/L3/竞争格局没暴露,是因为它们圆内有排名数字(在 g 里)。
    //   透明(fill:'transparent',不是 none)有填充、能命中,但画出来什么也看不见。
    g.appendChild(el('circle',{cx:p.cx,cy:p.cy,r:p.rad,fill:'transparent'}));
    const cAttr={cx:p.cx,cy:p.cy,r:p.rad,fill:'none',
      stroke:'#1f2329','stroke-width':1.6,'stroke-opacity':.82};
    g.appendChild(el('circle',cAttr));
    // 圆内数字 = 本市排名(学大在该市教培市场的校区数名次) —— 判断「值不存量红利市场」的那个量。
    // 只有已进入的城市有 rank;「红利大市场」页那批未进入城市 rank 全为 null,这条分支
    // 自然不画,所以同一张图两页通用,不用分叉。
    // 字号跟着半径缩、最小 7px:最小气泡(慈溪 r=8,直径 16)放「13th」四字符仍不溢出。
    // 上下限与随半径的那一项都乘 FS_B —— 只放大上限的话,小气泡里数字还是原尺寸,
    // 大中小三档的对比会失真(字号本身在表达盘子大小)。
    if(p.r.rank!=null){
      const rfs=Math.max(7*FS_B,Math.min(12*FS_B,p.rad*0.8*FS_B));
      // 圆内排名加白色描边(halo):气泡重叠时数字会压在一起,没有底衬就完全读不出,
      // 而这页(竞争格局)恰恰是重叠最重的一张 —— 右上角一群高经济城挤成一团。
      g.appendChild(txt(p.cx,p.cy+rfs*0.36,ord(p.r.rank),
        // 圆内排名用墨色,和城市名同色(用户口径 2026-09-27):原先深红,一张图上出现
        // 黑名字 + 红数字两种文字色,看着像两套东西。白色描边(halo)保留 —— 气泡一叠,
        // 没有底衬的数字会糊在一起。
        {'text-anchor':'middle',fill:'#1f2329','font-weight':600,'font-size':rfs,
         stroke:'#fff','stroke-width':2.6,'paint-order':'stroke','stroke-linejoin':'round'}));
    }
    const t=el('title');
    // tooltip 也随口径:初中用 jf 逐年的 26–28 均值(窗口非默认的城由 g3s 的 * 角标另行提示)
    const _pm = LV==='high' ? p.r.h2628 : LV==='jun' ? JMEAN(p.r) : null, _rd = RED_OF(p.r);
    // ⚠ 这一整句是**一条**表达式,只能用 `+` 串。加「人均收入」那一段时手滑把它收成了
    //   `;` —— 后面「本市排名」「初中窗口」「缺值说明」三段全成了独立的 `+expr` 语句,
    //   求值完就丢。危害在于**不报错、不崩**:`+x` 是合法的单目加号,语法检查照样过,
    //   只是那几行字永远不出现(实测:本市排名从工具提示里消失了整整一轮才发现)。
    //   往这类长拼接里插内容,插完要看一眼**末尾是 `+` 还是 `;`**。
    t.textContent = p.r.c+' · '+LVNM()+'在校生 '+(_pm!=null?_pm.toFixed(2):'—')+'万 · 经济综合 '
      +(p.r.econ==null?'—':p.r.econ)+' 分 · 生源增幅 '+(_rd==null?'—':(_rd>0?'+':'')+_rd+'%')
      +(p.r.pci!=null?' · 城镇居民人均可支配收入 '+(p.r.pci/10000).toFixed(1)+' 万':'')
      +(p.r.rank!=null?' · 本市排名 '+ord(p.r.rank):'')
      +(p.r.g3s&&LV==='jun'?' · 初中窗口 '+p.r.g3s:'')
      +(p.miss?(' · ⚠ 缺'+(p.miss.indexOf('x')>=0?'生源增幅(横轴)':'')
               +(p.miss.length>1?'与':'')
               +(p.miss.indexOf('y')>=0?'城镇居民人均可支配收入(纵轴)':'')
               +':虚线圈是标记,已贴到该轴起点摆放 —— **那个方向的位置不是它的真值**'):'');
    g.appendChild(t);
    g.style.cursor='pointer';
    // 带上是哪张清单的图(host 的 data-k),否则点「存量红利市场」的气泡会去高亮「红利大市场」的表
    g.onclick=()=>{ host.dispatchEvent(new CustomEvent('pick',{bubbles:true,detail:{c:p.r.c,k:host.dataset.k||'l1'}})); };
    s.appendChild(g);
  });
  // ★ 2026-09-28 用户口径:「气泡图左侧缺数据哪些点先拿掉吧」—— 左侧那条「缺数据」车道整块删除。
  //   它只服务过「战略空白市场」一页(那一页有 1/3 的城缺生源增幅、算不出横坐标)。
  //   一并删掉的还有 chart1 的 NOAXIS 支持、P.l 的车道让位、y 轴名的右移 ——
  //   留着就是一段没人调用的死分支,而下一个人会以为它是通用能力。
  //   ⚠ 后果明说:**右表 110 城,图上只画得出 77 个**(缺增幅的 33 个),而页面上
  //     从此没有任何地方交代这个差额(计数行那句"画不上"更早就按用户口径删了)。
  // 基准线标签压在上层
  if(medTxt) s.appendChild(txt(medX,medY,medTxt,
    {'text-anchor':'start',fill:BASEC,'font-weight':600,'font-size':FS_AX,
     stroke:'#fff','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round',
     stroke:'#fff','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round'}));
  // 横基准线的标签:一条或多条(「红利大市场」页是两条门槛线),统一在这里画
  hlLabels.forEach(function(h){
    s.appendChild(txt(h.x,h.y,h.txt,
      {'text-anchor':'end',fill:BASEC,'font-weight':600,'font-size':FS_AX,
       stroke:'#fff','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round'}));
  });
  // 标签贪心避让:三档距离 × 八方向,避开已有标签框 + 所有气泡
  const hitBox=(b,cx,cy,rad)=>{
    const nx=Math.max(b.x0,Math.min(cx,b.x1)), ny=Math.max(b.y0,Math.min(cy,b.y1));
    return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny) < rad*rad;
  };
  // 标签两轮:第一轮严格(不压任何气泡、不压任何标签);第二轮只放宽「不压气泡」这一条。
  // 起因:「竞争格局」页 66 个点里 24 个标不出名字,且全是右上角那团高经济城
  // (深圳/上海/苏州/杭州/南京/武汉/天津…)—— 恰恰是我们做得最好的一批,不能没有名字。
  // 放宽后名字可能压住垫在下面的小气泡,但比「图上没有这座城」好。第一轮的结论不变,
  // 所以另外三页原有的标签一个都不会动。
  const rankBoxes=[];   // 圆内排名数字的占位框,第二轮标签必须躲开(见下面的填写处)
  const place=(p,relaxed)=>{
    const name=p.r.c.replace(/[市州盟]$/,''), w=tw(name,6.3), h=14*FS_B;
    // ── 先试**圆内**(opt.INSIDE,「红利大市场」页用;用户口径 2026-09-27)──
    // 名字写在圆里,整张图就不用再靠引线把标签拉到四周 —— 而这一页的圆已经统一尺寸、
    // 不再编码任何量,放得下就该放里面。放不下(名字太长/与已放好的圆内名字重叠)
    // 自然落到下面的老路子(圆外 + 贪心避让)。
    // 宽度用**准确**的估值(CJK 1em),不用 tw() —— tw 把每个 CJK 按两个字符算,
    // 比实际宽约 30%,拿它判"装不装得下"会把 3 字市名全判出去(实测 张家港/鄂尔多斯)。
    // ⚠ 圆内**已经有排名数字**时不许再往圆里写名字(2026-09-28 踩过):
    //   排名数字画在 (cx, cy+rfs*0.36),圆内名字画在 (cx, cy+FS_NM*0.36) —— **同一点**,
    //   两串字直接叠在一起,谁都读不出。原来的 clash 只对 boxes(已放好的标签)判,
    //   根本不认识那个数字,所以守卫必须显式写在这里。
    //   「红利大市场」页没暴露,是因为那页的城**全是未进入**、rank 恒为 null,圆里本来就空着 ——
    //   INSIDE 当初就是为它加的。一旦某页的清单里混进已进入的城(大盘子/覆盖薄弱),
    //   同一个 INSIDE 就会撞。这类"某个模式只在它出生的那页成立"的默认值,换页用之前要重想一遍。
    if(opt.INSIDE && !relaxed && p.r.rank==null){
      const wi=name.replace(/[^\x00-\xff]/g,'xx').length*FS_NM*0.5, hi=FS_NM*1.3;
      const ibox={x0:p.cx-wi/2,x1:p.cx+wi/2,y0:p.cy-hi/2,y1:p.cy+hi/2};
      const clash=boxes.some(b=>!(ibox.x1<b.x0||ibox.x0>b.x1||ibox.y1<b.y0||ibox.y0>b.y1));
      if(wi<=2*p.rad-6 && hi<=2*p.rad-6 && !clash){
        boxes.push(ibox);
        // pointer-events:none —— 标签画在 <g> 外面(在气泡之上),不关掉的话
        // 点圆内的名字会被它接住,永远传不到气泡的 click 上(踩过)
        s.appendChild(txt(p.cx,p.cy+FS_NM*0.36,name,
          {'text-anchor':'middle',fill:'#1f2329','font-size':FS_NM,'data-lbl':p.r.c,
           'pointer-events':'none',
           stroke:'#fff','stroke-width':2,'paint-order':'stroke','stroke-linejoin':'round'}));
        return true;
      }
    }
    const cands=[];
    [1.0,1.7,2.5].forEach(function(k){
      const r2=p.rad*k, dg=r2*0.72;
      cands.push(
        [p.cx,p.cy-r2-6,'middle'],      [p.cx,p.cy+r2+13,'middle'],
        [p.cx+r2+5,p.cy+4.5,'start'],   [p.cx-r2-5,p.cy+4.5,'end'],
        [p.cx+dg+4,p.cy-dg+4,'start'],  [p.cx-dg-4,p.cy-dg+4,'end'],
        [p.cx+dg+4,p.cy+dg+8,'start'],  [p.cx-dg-4,p.cy+dg+8,'end']);
    });
    // avoidRank = 还要躲开圆内的排名数字。分两趟调用的原因:放宽轮如果**硬性**要求
    // 躲开数字,右上角那团挤在一起的高经济城会有城彻底标不出名字(实测 7 城:大连/南通/
    // 厦门/芜湖/鄂尔多斯/珠海/威海)—— 那正是当初加放宽轮要解决的「图上看不见这座城」。
    // 所以放宽轮先尽量躲数字,躲不开再退回原来的放宽规则:**名字丢不了,只是偶尔还压字**。
    const tryPlace=(avoidRank)=>{
      for(let i=0;i<cands.length;i++){
        const lx=cands[i][0], ly=cands[i][1], an=cands[i][2];
        const x0=an==='middle'?lx-w/2:(an==='start'?lx:lx-w), x1=x0+w;
        const y0=ly-h+2, y1=ly+2;
        if(x0<P.l-2||x1>W-P.r+2||y0<P.t-6||y1>H-P.b+6) continue;
        const box={x0:x0,x1:x1,y0:y0,y1:y1};
        if(boxes.some(b=>!(x1<b.x0||x0>b.x1||y1<b.y0||y0>b.y1))) continue;
        if(!relaxed && pts.some(q=>q!==p && hitBox(box,q.cx,q.cy,q.rad+1))) continue;

        s.appendChild(txt(lx,ly,name,{'text-anchor':an,fill:'#1f2329',
          'font-size':opt.INSIDE?FS_NM:FS_PM,
          'pointer-events':'none',
          'data-lbl':p.r.c,
          stroke:'#fff','stroke-width':2.5,'paint-order':'stroke','stroke-linejoin':'round'}));

      }
      return false;
    };

    // 第二轮(放宽)先躲数字,躲不开才退回原规则。

  // 右上角那团高经济城标出来放宽了「不压气泡」,于是名字直接印在别人的排名数字上,

  // 放宽「躲气泡」可以(气泡是空的),但不能放宽「躲数字」—— 那是字压字,没有折中。
  host.appendChild(s);

    const t=g.querySelector('text'); if(!t) return;

  // (慈溪 r=8)时会顶满直径。这里量一次实际宽度,超宽的用 textLength 压回 74% 直径内 ——
  // 只压字距与字形宽度、不改字号,各气泡之间「字号反映盘子大小」的关系保持不变。
  // 必须在 s 挂进 host 之后量,脱离文档的元素 getBBox 拿不到尺寸。
  s.querySelectorAll('g.pt').forEach(function(g){
    const c=g.querySelector('circle'), t=g.querySelector('text');
    if(!c || !t) return;
    const max=2*(+c.getAttribute('r'))*0.74;
    if(t.getBBox().width>max){

}

// 纯 DOM 高亮,不重画 —— chart1 的标签是两轮贪心摆出来的,重画会把整套标签位置重排,

  const gbox=[];

// 宁可啰嗦 —— 这页最容易骗人的就是「搜不到 = 这城不行」。
function qPrepare(k,inPage,whyFn){
  const box=$('smsg'+SMID[k]);
  const out={match:[],ghost:[]};
  QDIRTY[k]=0;   // 这一页的图和提示刚被重算过,不再是脏的
  if(!box) return out;

    box.innerHTML='<span class="no">库里没有「'+esc(q)+'」</span> —— 本库 '+D.all.length
      +' 城,按城市名或省份匹配';

  }
  const inset=new Set(inPage.map(function(r){ return r.c; }));
  const inq=hits.filter(function(r){ return inset.has(r.c); });
  const outs=hits.filter(function(r){ return !inset.has(r.c); });
  out.match=hits;
  out.ghost=outs.filter(function(r){ return whyFn(r)==='gate'; });

  const parts=['命中 <b>'+hits.length+'</b> 城 · 本页高亮 <b class="yes">'+inq.length+'</b> 城'];
  if(out.ghost.length)

      +out.ghost.map(nm).slice(0,6).join('、')+(out.ghost.length>6?'…':'')+')');
  const rest=outs.filter(function(r){ return whyFn(r)!=='gate'; });
  const by={};
  rest.forEach(function(r){ const w=whyFn(r); (by[w]=by[w]||[]).push(nm(r)); });

      +by[w].slice(0,6).join('、')+(by[w].length>6?'…':'')+')');

// 把表格行滚进视野 —— **只滚表格自己的滚动容器**。
// ⚠ 不能用 row.scrollIntoView():它会连锁滚动**所有**可滚动祖先,而 .vp 是 overflow:hidden 的
// 滑动容器 —— hidden 的元素照样能被程序滚。于是一行滚进来,整个页面横向跳掉一页
// (vp.scrollLeft 变成一页宽),而 cur 和 tab 高亮还停在原来那页:
// 屏幕显示的和页面声称的成了两页。实测点一次气泡就会跳一次(2026-09-18 发现)。
// alignTop:把那行的**顶边**贴到容器顶,而不是"只要在视野里就不动"。
// 展开行时必须用 —— 详情是插在这一行**下面**的,只把这一行滚进视野的话,展开的内容
// 正好落在可视区外(实测:点气泡展开遵义市,表滚到位了、趋势图在下面看不见)。
function scrollRow(tr,alignTop){
  let p=tr.parentNode;
  while(p && p!==document.body){
    const o=getComputedStyle(p).overflowY;
    if((o==='auto'||o==='scroll') && p.scrollHeight>p.clientHeight+1){
      const rb=tr.getBoundingClientRect(), pb=p.getBoundingClientRect();
      if(alignTop) p.scrollTop+=(rb.top-pb.top)-8;
      else if(rb.top<pb.top) p.scrollTop-=(pb.top-rb.top)+8;
      else if(rb.bottom>pb.bottom) p.scrollTop+=(rb.bottom-pb.bottom)+8;
      return;
    }
    p=p.parentNode;
  }
}

  //     「有值但没过本页门槛」,对这类城是真的;

  //     说成「有值」—— 假话,而且正是 P10 要防的那类误导(把「不知道」读成「不合格」),
  //     只不过这里发生在搜索提示栏而不是行集里。
  //   所以缺值走各自的码,由 WHY 表给出准确说法,且不会被画成虚线圈。
  free:function(r){
    if(PROVP.free && r.p!==PROVP.free) return 'prov';
    if(FD.ent==='in' && r.es!=='in') return 'ent';
    if(FD.ent==='notin' && r.es==='in') return 'ent';
    if(FD.pci>0 && r.pci==null) return 'nopci';
    if(FD.red>FREE_RED_LO && RED_OF(r)==null) return 'nored';
    if(FD.sz>0 && POOL_OF(r)==null) return 'nosz';
    return 'gate';   // 有值但没过门槛 —— 这一类才是虚线圈
  },
};
const QREAPPLY={ l1:function(){applyL1();}, l2:function(){applyL2();}, l3:function(){applyL3();},
                 mkt:function(){applyMkt();},
                 big:function(){applyPool('big');},
                 free:function(){applyPool('free');} };

// ══ 右侧表格的排序(2026-09-28 用户口径「右侧的表格增加一下排序功能」)══
// 与「城市趋势」页全量表(#t0)是**两套**东西:那边走 ACOLS/acells/aHead,这边走 COLS/cells/head。
// 但**读法必须一致** —— 指示符同一套(.ar 的 ⇅/▲/▼ + s1/s2),空值一律沉底。
// 各页各记各的排序(与 PROVP 同一思路):切页、切省份、拖门槛都不该把别页排好的序冲掉。
const SORT={};
// 列键 → 取值函数。必须是**字段**,不能抓单元格文本(格子里是 HTML:「第 18 名」和「15+」
// 按文本排会得到「第10名 < 第2名」这种毫无意义的顺序)。
const CSK={
  l1:{c:r=>r.c,p:r=>r.p,t:r=>RED_OF(r),hs25:r=>r.hs25,pci:r=>r.pci},
  l2:{c:r=>r.c,p:r=>r.p,t:r=>RED_OF(r),pci:r=>r.pci,campus:r=>r.campus,rank:r=>r.rank},
  l3:{c:r=>r.c,p:r=>r.p,t:r=>RED_OF(r),hs25:r=>r.hs25,pci:r=>r.pci,campus:r=>r.campus},
  // pci = 城镇居民人均可支配收入(元)—— 两页现在的纵轴
  big:{c:r=>r.c,p:r=>r.p,hs25:r=>r.hs25,t:r=>RED_OF(r),pci:r=>r.pci,rank:r=>r.rank},
  // 自由筛选:列与 big 逐列同款(同一套轴、同一张表),所以取值函数也照抄一份 ——
  // ⚠ 必须是**同一组字段**:列键(col)要与 COLS.free 的第 5 位一一对上,否则点表头排不了序
  free:{c:r=>r.c,p:r=>r.p,hs25:r=>r.hs25,t:r=>RED_OF(r),pci:r=>r.pci,rank:r=>r.rank},
};
// 首次点某列时的方向:数值列「大的在前」,文本列按拼音升序(与全量表的 ADEF 同一习惯)。
// rank 特意取升序:第 11 名在第 30 名前面,读起来是「差得最少的排最前」。
const CDEF={t:-1,econ:-1,hs25:-1,campus:-1,dens:-1};
function sortList(k, rs){
  const st=SORT[k];
  if(!st || !st.col) return rs;               // 没点过表头 → 保持各行集自己的默认序
  const f=CSK[k][st.col];
  return rs.slice().sort(function(a,b){
    const av=f(a), bv=f(b);
    const an=(av==null||av===''), bn=(bv==null||bv==='');
    if(an&&bn) return a.c.localeCompare(b.c,'zh');   // 两边都空 → 按城名,避免顺序抖动
    if(an) return 1; if(bn) return -1;               // 空值永远沉底,与升降无关
    const r=(typeof av==='number'&&typeof bv==='number') ? av-bv
            : String(av).localeCompare(String(bv),'zh');
    return st.dir<0 ? -r : r;
  });
}
// 表 id → 页键(点表头时用它找回是哪一页)
const T2K={t1:'l1',t2:'l2',t3:'l3',tBig:'big',tFree:'free'};
document.addEventListener('click',function(e){
  const th=e.target.closest('th[data-sk]'); if(!th) return;
  const tb=th.closest('table'), k=tb&&T2K[tb.id]; if(!k) return;
  const key=th.getAttribute('data-sk');
  if(!CSK[k][key]) return;                    // 列键与 CSK 对不上就不响应(而不是排出一团乱)
  const st=SORT[k]||(SORT[k]={col:null,dir:0});
  if(st.col===key) st.dir=-st.dir;             // 同一列再点 → 反向
  else { st.col=key; st.dir=(CDEF[key]||1); }
  // 重画这一页。行集与排序无关,本可以只重渲染表格 —— 但复用现成的分派(QREAPPLY)
  // 少一条要维护的路径;这五个 apply 都是纯前端重算,开销可以忽略。
  QREAPPLY[k]();
});

// ── 渲染 ──
function render(k,tid,rowsArg){
  const rows=rowsArg || D[k];
  $(tid).innerHTML = head(k) + '<tbody>' + rows.map((r,i)=>
    // data-c = 城名,搜索高亮要按它找行(data-i 是当前子集里的行号,搜索不改行集但重排后会变)
    '<tr data-i="'+i+'" data-k="'+k+'" data-c="'+r.c+'"><td class="l rk">'+(i+1)+'</td>'
    + cells(k,r).map((v,j)=>'<td class="'+(j===0?'l':'')+'">'+v+'</td>').join('')
    +'</tr>').join('') + '</tbody>';
}
// ④ 全国各学段趋势:实测实线 + 出生人口推算虚线
// 相位差是这张图的全部意义 —— 四条线在不同年份见顶,错开 3~9 年。
function chartNat(host,cs,xs,H){
  // cs = 要画的线;xs = 定横轴范围的线(默认同 cs)。两者分开是因为学段开关只该改「画哪几条」,
  // 不该改横轴 —— 横轴是年份,是个固定画框:只看小学时把它缩到 2031,标题「2015–2040」
  // 与图例「各线终点不同」两句话就都不成立了。
  xs=xs||cs;
  if(!cs.length) return;   // 空集时下面 Math.max.apply(null,[]) = −Infinity,整根轴会变成 NaN。
                           // UI 上到不了(最后一条点不动),但函数不该靠调用方保证。
  // 整幅宽度下的宽幅比例。viewBox 宽 1000 而容器 1286 → 缩放 1.244,
  // 与 FS_AX/FS_NM 的折算基准(1.283)接近,字号不用重算。
  // 设计高度 584 × 全局 CHS × 本页填满系数
  const W=1000; H=584*CHS*CF(host.id);
  const P={l:56,r:24,t:26,b:44};
  const s=el('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});
  // x 轴范围取 xs 的并集 —— 取第一条的话(学前只到 2028),初中/高中(到 2037/2040)会被推到画布外,
  // 且 x 轴只标到 2025。xs 默认 = cs,只有学段开关会传一个更大的 xs(见函数头注释)。
  let y0=Infinity, y1=-Infinity;
  xs.forEach(c=>{ y0=Math.min(y0,c.y[0]); y1=Math.max(y1,c.y[c.y.length-1]); });
  // Y 轴上界**只看要画的那几条**(用户口径:轴跟着显示的线走)。所以默认「只看高中」时
  // 轴到 4k、高中铺满画面,而不是挤在 12k 画框的下四分之一。
  const vals=[]; cs.forEach(c=>c.a.concat(c.f).forEach(v=>{if(v!=null)vals.push(v);}));
  // 上界取 4 的整数倍,让 4 段刻度正好落在整千上。原来取 1000 的整数倍,峰值 10836 会得到
  // 11000,四段刻度是 0/2750/5500/8250/11000 —— 标签只能写成 2.8k/5.5k/8.3k,读不出规律。
  // 现在 10836 → 12000,刻度 0/3k/6k/9k/12k。
  const _mx=Math.max.apply(null,vals);
  const yb=Math.ceil(_mx/4000)*4000, ya=0;
  const px=y=>P.l+(y-y0)/(y1-y0)*(W-P.l-P.r);
  const py=v=>H-P.b-(v-ya)/(yb-ya)*(H-P.t-P.b);
  for(let i=0;i<=4;i++){
    const v=ya+(yb-ya)*i/4;
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:py(v),y2:py(v),stroke:'#e6e8eb','stroke-width':1}));
    s.appendChild(txt(P.l-7*FS_B,py(v)+3.5*FS_B,(v===0?'0':(v%1000?(v/1000).toFixed(1):(v/1000))+'k'),{'text-anchor':'end','font-size':FS_AX}));
  }
  for(let y=y0;y<=y1;y++){ if(y%5) continue;
    s.appendChild(txt(px(y),H-P.b+15*FS_B,y,{'text-anchor':'middle','font-size':FS_AX})); }
  cs.forEach(c=>{
    const seg=(arr,dash)=>{
      let d='',pen=false;
      arr.forEach((v,i)=>{ if(v==null){pen=false;return;}
        d+=(pen?' L':' M')+px(c.y[i]).toFixed(1)+' '+py(v).toFixed(1); pen=true; });
      if(d) s.appendChild(el('path',{d:d.trim(),fill:'none',stroke:c.col,'stroke-width':2.2,
        'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':dash}));
    };
    seg(c.a,null); seg(c.f,'6 4');
    s.appendChild(el('circle',{cx:px(c.pk),cy:py(c.pkv),r:3.4,fill:'#fff',stroke:c.col,'stroke-width':2}));
    // 词序与两页趋势图的「峰 2031 · 134.3」对齐(2026-09-30)。原来是「高中 3331 · 2029 峰」——
    // 值在前、年在后,同一套页面两种读法。
    const _pl=txt(px(c.pk),py(c.pkv)-9*FS_B,c.s+' 峰 '+c.pk+' · '+c.pkv+(c.pknote?'('+c.pknote+')':''),
      {'text-anchor':'middle',fill:c.col,'font-weight':600,'font-size':FS_AX});
    // 峰值的**限定条件**挂在标签本身上(hover 该标签才出现)。只有存在这个偏差的曲线才配
    // `pktip`(目前只有高中:普高招生率被冻结),所以这不是通用装饰 —— 没配的就是个普通标签。
    // 用 SVG 的 <title> 而不是页面某处的一段说明:标记「(下界)」自己说不清是下界于什么,
    // 而这一页 2026-09-27 起只剩标题+勾选+图,不再放常驻文字(用户口径)。
    if(c.pktip){ const _t=el('title'); _t.textContent=c.pktip; _pl.appendChild(_t); }
    s.appendChild(_pl);
  });
  host.appendChild(s);
}

// ── 各省生源 × 收入(气泡 × 初/高) ──
// 初/高切换:两个口径的量纲差一个系统性偏移(高中红利吃初中扩招尾巴,普遍高约 +6pp),
// 所以各自的色阶阈值不同 —— 用同一套阈值会让初中的颜色全挤在一档里。
let LV='high';
// ★ PV = **「各省生源 × 收入」页自己的口径**(high / jun / pri)。2026-09-28 加。
// 为什么不并进 LV:LV 是**全局**的,八个 .swlv 开关共用它(省级 + 各市 + 五张清单页)。
// 小学只在省级页做得出(城市层面只有小学生在校实测、没有 26–28 序列),若把 pri 塞进 LV,
// 那五张清单页和各市页会多出一个**永远点不出东西**的档位,还得给它们各写一套降级。
// 所以:省级页那个开关多一档「小学」,它驱动 PV;其余七个开关仍驱动 LV。
// 高中/初中两档 PV 与 LV 保持一致(见 setPV)—— 只有小学是省级页专属的偏离。
let PV='high';   // 口径(初/高)。曾经还有一个「气泡/地图」视图开关(VT),2026-09-27 按用户口径撤掉
// ── 高中/初中 口径:三张清单页也接进同一个 LV ──
// 原来只有「各省生源 × 收入」「数据池」共用 LV,现在清单页一起用 —— 一个按钮切了到处都切,
// 避免同一屏上并排出现两套口径(那种情况下人会拿初中红利去比高中在校生规模)。
// 切的只有两样:红利(t ↔ g3)和盘子(hs25 ↔ mid25)。经济分、进入状态与学段无关,不切。
// ★ 2026-09-28 用户口径:凡是有「高中/初中」的地方都补一个「小学」档 ——
//   「虽然有些没有数据,但是先把小学按钮加上,数据可以先空着」。
//
//   城市层面**还没有 26–28 的小学序列**(省级有、城市没有),所以这一档下五张清单页与各市页
//   会**空着**。实现上**不逐页硬编占位数据**,而是让取数函数在 pri 下自然退化:
//     RED_OF  → null(城市级小学增幅没有这个字段)→ 所有清单的行集为空、图上走空态;
//     POOL_OF → r.prim(**小学在校生实测是有的**,能读就让它读)。
//   于是"空"是数据的结果,不是写死的占位 —— 数据一补上,这些页自己就亮。
//   ⚠ 唯一要显式挡住的是 poolRows(「战略空白市场」):它的门槛只看 POOL_OF 和排名、
//     不看 RED_OF,不挡的话 pri 档下它会照样算出一张清单来。
const LVNM_ = () => LV==='high' ? '高中' : LV==='jun' ? '初中' : '小学';
const RED_OF  = r => (LV==='high' ? r.t    : LV==='jun' ? r.g3   : r.pri);
// ★ 2026-10-08:小学档从 `null` 改成 `r.pri` —— 城市级小学红利已可算(出生驱动,见 make_primary_mix.py)。
//   没采到出生/锚年的城它仍是 null,页面照旧留空并走 priWhy 说明 —— 这与「算得住」不冲突:
//   闸门是**数据**,不是代码。
const POOL_OF = r => (LV==='high' ? r.hs25 : LV==='jun' ? r.mid25 : r.prim);
// ★ 2026-09-28:「覆盖薄弱」页删掉之后,它那套「覆盖指数」(校区÷生源,中位归一 = 100)
//   连同 densIdx / densCell / THIND / thinIdx 一起删干净 —— 另一半在生成器
//   (_dens_base / DENSB_* / DENS_THR / min_didx)。
//   留着不是「以备不时之需」:下次有人做新页时会先看到这一组,以为它是通用度量,
//   而它其实只服务过那一页。
// 初中池 26–28 均值:jf 是逐年的字典(键为年份字符串)。窗口非 26–28 的城(有 g3s 标记)这里
// 仍按 26–28 取,和表格列名保持一致 —— 角标 * 已经提示了窗口不同,不要在 tooltip 里另算一套。
const JMEAN = r => { const f=r.jf||{}, v=['2026','2027','2028'].map(y=>f[y]).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const LVNM = LVNM_;   // 三档统一走一个函数,别在两个地方各写一遍二元判断
// 「2025 在校生」列的值不是 2025 年口径时必须标出年份 —— 列头写死了 2025,不标就是年份顶替。
// 高中口径的年份来自上游池页的 g0y(实测基年);初中口径值只可能来自主库 year==2025 的城,
// 其余为 null(显示「—」),所以恒为 2025。
function ySup(r){
  // ★ 2026-09-30 改了两处,都是因为「在校生」那一列从「26–28 均值」改成了「2025 实测」——
  //   原来那一列不带年份主张,所以年份纪律不适用;现在它主张 2025 了,不标就是**年份顶替**。
  //
  // ① 原来越过非高中档(`if(LV!=='high') return ''`),现在三个口径都要标。
  // ② 年份取哪个字段**按口径分** —— 这两个字段在 26 个城上不一致,不能只用一个:
  //      · 高中/初中(hs25 / mid25)走 **g0y**:两者同出「高中池」那条链(g0 与 m 同城同年配对
  //        见 make_pool_rank.py 的 _y0 / MID_Y),其中 26 城被官方覆盖层刷新到了 2025,
  //        而主库 year 还停在 2024;
  //      · 小学(prim)走 **yb**(= 主库 year):primary_students 就挂在主库这个年份上,
  //        在那 26 城里它**确实**是 2024 的值。
  //    用错字段 = 在「2025 实测」的列头下印 2024 的数(那 26 城里小学档就会中招)。

  const y=(LV==='pri')?r.yb:r.g0y;

  return '<sup class="altw" title="该城的实测在校生为 '+y+' 年口径（其余城市为 2025），'

// 高中在校「基准年覆盖层」的**推算值**标记 —— 与 ySup 是一对:ySup 标「不是 2025」,
// 这个标「是 2025、但这个 2025 是推出来的」。
// ★ 2026-10-06 加。起因:data/hs_2025_overlay.jsonl 里那 26 城(苏州/无锡/菏泽/上饶/湛江…)
//   的 2025 高中在校是**双法交叉推算**的,该文件每一行自己都写着「推算值,非官方发布」——
//   但那个事实只落在生成器内部的 `_year_overlay`,**不下发页面**,于是这些城顶着列头的
//   「2025 实测」显示,连 ySup 都不触发(g0y 写的正是 2025)。实测:苏州推算 178741 人,
//   而苏州市教育局 2026-09-14 已发布官方值 185126 人(低 3.4%)。
// 判据:est 里含 2025(mid_est_overlay 的 est 是「哪几年来自推算层」,这里沿用同一套字段与同一句文案
//   的语义)。生成器按 src 前缀判断是否入 est,**换官方值后角标自动消失**,不需第二份名单。
function estSup(r){
  if(LV!=='high') return '';                       // 覆盖层只动高中在校;初中/小学那两列不是它
  if(!Array.isArray(r.est) || r.est.indexOf(2025)<0) return '';
  return '<sup class="altw" title="该城 2025 年高中在校生是【推算值】,非官方发布 ——'
    +'为了让基准年与其他城同在 2025,用趋势外推 / 升学比法交叉推算(见 data/hs_2025_overlay.jsonl)。'
    +'官方卷发布后应替换本层">*</sup>';

// 文本语境下的同一条提示(「完整记录」「判断逻辑」里不方便塞 <sup>)
function yTag(r){
  return (r.g0y!=null && r.g0y!==2025) ? '（'+r.g0y+' 年口径，其余城市为 2025）' : '';
}
// ⚠ 把 #swLv(省级页那个三档开关)排除在全局同步之外:它跟的是 PV,而 PV 可能是 'pri'
//   —— 全局同步按 LV 上高亮,会把「小学」那一档永远点不亮(它 data-lv="pri" 而 LV 只有 high/jun)。
const swLvSync = () => document.querySelectorAll('.swlv:not(#swLv) button')
  .forEach(b=>b.classList.toggle('on', b.dataset.lv===LV));
const pvSync = () => document.querySelectorAll('#swLv button')
  .forEach(b=>b.classList.toggle('on', b.dataset.lv===PV));
// (原来的色阶 TIERS 与取色 pcol 是给「地图」视图填色用的 —— 视图撤掉后一起删,

// 口径 → 三个投影量。**用 PV 不用 LV**(见 PV 的定义处)。三个分支写成函数,免得
// 「高中/初中」那种二元写法在加第三档时到处漏改 —— 上一版就是 `LV==='high'?x:y` 满天飞。
const pvRed =p=>(PV==='high'?p.t : PV==='jun'?p.g3 : p.pri);
// ★ 2026-09-30:「盘子」列统一到**2025 实测**(= 增幅公式的分母)。
//   原来是混的:高中 av / 初中 m3(都是 26–28 均值,分子),小学 priS(2025 实测,分母)。
//   列头两页都写着「26–28 均值」,于是 tab2 小学那格的数与列头不符。
//   为什么统一到**分母**而不是分子(两条都是真数,选分母有三个硬理由):
//     ① 覆盖:城市层(「各市生源概览」那张表)有 h2628 的只有 296/452 城、有 jf 的 345/452,

//   ⚠ pri3(PROV_NAT.pri3 与各省的)现在仍然只由「盘子 ×(1+增幅)」间接表达,
//     模板里不直接读 —— 留着是为了别的下游,别当死码删了。
const pvPool=p=>(PV==='high'?p.g0: PV==='jun'?p.J25: p.priS);
// 峰值年与「走平」标记。★ 2026-09-30 换掉了原来的 pvYrs(只存「距峰值年数」,且生成侧
// 把负值 clamp 成 0):现在存**峰值年本身**,年数在渲染时算 —— 因为走平的序列不写年数。
//   为什么不能只存年数:峰值只高出 2025 不到 1% 时(初中 13 省,广东 +0.49% / 河南 +0.15%),
//   「还有 N 年」是**噪声不是结论**。那一档改成只写「峰 YYYY」,于是渲染层需要知道年份。
//   为什么不能 clamp:黑龙江初中实测 73.8→71.3→66.8→61.3 一路跌,clamp 后印「0 年」
//   (=2026 即见顶),与事实相反。负数在渲染层本来就有说法(「已过顶 N 年」,小学档一直在用)。
const pvPk  =p=>(PV==='high'?p.pkH: PV==='jun'?p.pkJ : p.pkP);
const pvFlat=p=>(PV==='high'?p.flatH:PV==='jun'?p.flatJ: p.flatP);
