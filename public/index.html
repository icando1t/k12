// 省级气泡:X=红利%  Y=城镇居民人均可支配收入(元)  气泡面积=高中在校生
// 与城市页 ① 同一套视觉语言(X 红利 / Y 经济 / 气泡在校生),读者不用重新学。
// **「各市生源概览」直接复用这张图**(把城市行投影成同样形状,见 pcRows)——所以这里开了
// 三个口子(opt.Q / opt.XB / opt.YB),默认值就是省级页原来的行为,不传参时一字不差。
// ⚠ 为什么不干脆读全局:那一页的「省」是**下拉选出来的**、且不共用 PROVQ,
// 基线也该用城市口径的全国基准而不是 31 省聚合 —— 靠全局变量会让两页互相串。
function chartProv(host,rows,opt){
  opt=opt||{};
  // 基准线的**名字**:省级页是「全国」,各市页传「全省」(那页的基准是所选省自己,见 redrawPC)。
  // 两条线的文案共用这一个前缀,免得只改了竖线、横线还写着"全国"。
  const bn=opt.BASE_NAME||'全国';
  // 口径名。本函数两页共用,但**取口径的变量不同**:「各省生源 × 收入」用 PV(PV 切档时
  // 全局 LV 不动,见 PV 的定义处),「各市生源概览」用 LV。所以由调用方传 opt.NM,不传退回 LVNM()。
  // ⚠ 原来这一行直接写 `LV==='high'?'高中':'初中'` —— 二元写法,加小学档时漏改:
  //   tab3 的 LV='pri' 落进 else 印成「初中」,tab2 更糟(PV='pri' 而 LV 恒为 'jun')。
  const nm=opt.NM||LVNM();
  // ★ 2026-10-08(用户口径:「tab3 气泡内显示一个数字 = 学大在这个城市的市场份额」)——
  //   opt.SHR 打开时,圆内写**份额数字**,城市名不再进圆(那页的城市名本来就绝大多数落在圆外,
  //   走引线标签;让位给数字不会丢信息)。数字比名字短,装得下的圆反而更多。
  //   ⚠ 只在「各市生源概览」传 true:省级页同一张图,圆内写的是省名,不能换。
  //   ⚠ 声明必须放在函数**最上面**:第一个 pts.forEach 里就要用它拼悬停文案,
  //     放在下面(wIn 那块)会在 forEach 执行时报 `Cannot access 'SHR' before initialization`
  //     —— const 的暂时性死区,页面整张图直接不画(实测踩过)。
  const SHR=!!opt.SHR;
  const FS_SHR=9.5*FS_B;
  // 份额文本的宽度(em × 字号)。**逐字符算,不用平均值** —— 这三个字符宽差一倍:
  //   数字 0.556em / 小数点 0.28em / 百分号 0.9em。
  // 原来按「0.62em × 字数」估,加百分号后误差放大(「2.8%」真实 2.85em,估成 2.48em),
  // 会把装得下的圆误判成装不下 —— 这一格本来就是靠边缘尺寸在反复卡。
  const SHR_W=(()=>{const m={'%':0.9,'.':0.28};return t=>{let w=0;
    for(const ch of t) w+=(m[ch]!=null?m[ch]:0.556); return w;};})();
  const wShr=t=>SHR_W(t)*FS_SHR;
  // 查询:命中省正常画,其余淡出 —— 31 省里找 1 个,淡出比抹掉好(保留全国格局做参照)
  const q=(typeof (opt.Q!=null?opt.Q:PROVQ)==='string'?(opt.Q!=null?opt.Q:PROVQ):'').trim().toLowerCase();
  const isHit=r=>!q||(r.n||'').toLowerCase().indexOf(q)>=0||(r.fm||'').toLowerCase().indexOf(q)>=0;
  const W=700,H=507*CHS*CF(host.id),P={l:60,r:24,t:10,b:46};
  const s=el('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});
  const R=rows.filter(r=>r.red!=null&&r.inc!=null&&r.pool!=null);
  const X=R.map(r=>r.red), Y=R.map(r=>r.inc/1e4);
  const pad=(a,b,f)=>((b-a)*f)||1;
  // 轴两端的留白:0.06 而不是 0.12 —— 数据铺得更满(用户口径「内容要在栏里充满」)。
  // ⚠ 别收到 0:气泡有半径,贴边会被画到坐标轴外面去。
  let xa=Math.min.apply(null,X)-pad(Math.min.apply(null,X),Math.max.apply(null,X),.06);
  let xb=Math.max.apply(null,X)+pad(Math.min.apply(null,X),Math.max.apply(null,X),.06);
  // ★ 2026-10-07 修:把**基准线**也算进轴范围。
  //   原来轴只按数据点算,基准落在分布之外时,下面画线那句 `_nb>xa && _nb<xb` 会**静默丢弃**竖线 ——
  //   页面上就是「这一页只有一条基准线」。实测(初中档,各市生源概览):**宁夏** 全省基准 g3=+2
  //   高于所辖全部市、**海南** g3=−2 低于所辖全部市,两省画出来都只有横线没有竖线。
  //   chart1 对全国基准(natB)一直是这么扩的(见那边两行 if),chartProv 漏了这一步。
  //   ⚠ 用 `let` 而不是 const:这两行之后还会被撑开。
  const _XBv=(opt.XB!=null)?opt.XB:(D.prov_nat?(PV==='high'?D.prov_nat.t:PV==='jun'?D.prov_nat.g3:D.prov_nat.pri):null);
  if(_XBv!=null && isFinite(xa)){
    const _sp=pad(Math.min.apply(null,X),Math.max.apply(null,X),.04);
    if(_XBv<xa) xa=_XBv-_sp;
    if(_XBv>xb) xb=_XBv+_sp;
  }
  // Y 轴刻度:固定 **3 个**(下 / 中 / 上)—— 见下面 ya/yb 取整那两行。
  let ya=Math.min.apply(null,Y)-pad(Math.min.apply(null,Y),Math.max.apply(null,Y),.05);
  let yb=Math.max.apply(null,Y)+pad(Math.min.apply(null,Y),Math.max.apply(null,Y),.05);
  // 横基准线同理:收入的基准也可能落在各市收入分布之外(同一族问题,一起兜住)。
  // ⚠ 必须放在下面「吸附到下界 3 的倍数」**之前** —— 吸附之后再加就会把刻度弄歪。
  const _YBv=(opt.YB!=null)?opt.YB:((D.prov_nat&&D.prov_nat.inc)?D.prov_nat.inc/1e4:null);
  if(_YBv!=null && isFinite(ya)){
    const _sp2=pad(Math.min.apply(null,Y),Math.max.apply(null,Y),.04);
    if(_YBv<ya) ya=_YBv-_sp2;
    if(_YBv>yb) yb=_YBv+_sp2;
  }
  // ★ 2026-10-08 用户口径:「y 轴刻度有些是缺失的,要 3 个刻度值 —— 最上面、中间、最下面」。
  //   毛病出在原来只吸附**下界**到 3 的倍数、上界不吸附:刻度从 ya 起每 3 万一格,
  //   而多数省的 yb 离 ya 不到 6 万,于是刻度掉到 1~2 个。实测 31 个省视图里 **28 个不足 3 个刻度**(当时还是 31 页),
  //   其中 11 个省整张图只有「3」一个数字(河北 yb=5.68、四川 5.78、河南 5.13…),
  //   读者看不出这张图的收入轴到底到哪 —— 上限是坐标轴自己决定的,不标就等于没给。
  //   现在改成:下界向下取整、上界向上取整、中间取两者中点 —— **恒为 3 个**。
  //   幅度小的省(河北 ~2.7 万)自然落到 3 / 4.5 / 6,而不是硬塞 3 万一格只出一个数。
  //   代价(明说):不再保证「每 3 万一格」的整数格距,中点可能是 4.5 这种半整数
  //   —— 收入轴本来就是给人定位用的,三个值比三的倍数重要(用户口径已经这么定了)。
  //   ⚠ 上界向上取整会多出一点顶部留白,但幅度 < 1 万,且原来 5% 的 pad 还在,气泡不会被顶到框外。
  ya=Math.floor(ya); yb=Math.ceil(yb);
  const px=v=>P.l+(v-xa)/(xb-xa)*(W-P.l-P.r);
  const py=v=>H-P.b-(v-ya)/(yb-ya)*(H-P.t-P.b);
  // Y 轴刻度恒为三个:下界 / 中点 / 上界(数字与位置都由 py() 现算,中点取半不影响对位)。
  // 半整数(4.5)照印一位小数 —— 不四舍五入到整数:那样刻度会**离开**中点位置,读起来更别扭。
  const _yt=[ya,(ya+yb)/2,yb];
  const _yfmt=v=>(Number.isInteger(v)?String(v):v.toFixed(1));
  // 网格线**去掉**(用户口径 2026-09-27),只留刻度数字。
  // 这一页的参考结构已经有三层了:两条深红虚线(全国基准/全国收入)+ 四块象限底纹 + 刻度数字。
  // 再叠一层灰网格,作用是"帮读数" —— 但这张图要看的是**方位**(在哪个象限),不是读数:
  // 具体数值走悬停提示与右侧表格。网格线只会把画面切成格子,而它要表达的恰恰是"两块区域"。
  _yt.forEach(v=>{
    s.appendChild(txt(P.l-7*FS_B,py(v)+3.5*FS_B,_yfmt(v),{'text-anchor':'end','font-size':FS_AX}));
  });
  // X 轴刻度:整数百分数、每 5 一格(与 Y 同口径)。红利范围 −4~+17% → −5/0/5/10/15。
  const _xt=[];
  for(let v=Math.ceil(xa/5)*5; v<=xb; v+=5) _xt.push(v);
  if(!_xt.length) _xt.push(xa,xb);
  _xt.forEach(v=>{
    s.appendChild(txt(px(v),H-P.b+15*FS_B,axPct(v,0),{'text-anchor':'middle','font-size':FS_AX}));
  });
  // 轴标题与右侧表格的表头**同一串词**(用户口径「x 轴的名字跟右侧表格的一致」):
  // 表头三行是「生源增幅 / 2026–28 / vs 2025」,轴上写同一串,只是轴上有横向空间,
  // 把窗口收进括号并补上单位(表头 66px 宽放不下括号,逐字到标点就没必要了)。
  // 2026-09-27 改的名:原「26–28 平均增幅 vs25」——「26–28」是缩写、「平均增幅」没说
  // 涨的是什么、「vs25」更缩,读者要停顿两下。现在的说法把**对象(生源)**提到最前。
  // 原来的计算式挪到图例与悬停里,信息不丢。
  s.appendChild(txt((P.l+W-P.r)/2,H-3*FS_B,'生源增幅(2026–28 vs 2025,%)',
    {'text-anchor':'middle',fill:'#5f6670','font-size':FS_TT}));
  s.appendChild(txt(15,(P.t+H-P.b)/2,'城镇居民人均可支配收入(万元)',{transform:'rotate(-90 15 '+((P.t+H-P.b)/2)+')','text-anchor':'middle',fill:'#5f6670','font-size':FS_TT}));
  // 半径 ∝ √在校生 → 面积 ∝ 在校生(与城市页同一口径)。
  // 系数 2.5:省级在校生最大 294.5 万(河南),√=17.2 → rad 43,约占绘图区高度 19%。
  // 城市页用 5.5 是因为城市在校生最大只有 68.9 万;直接套会把气泡撑爆。
  const tw=(n,u)=>n.replace(/[^\x00-\xff]/g,'xx').length*(u||4.9)*FS_B;
  const hitB=(b,x,y,rr)=>!(x+rr<b.x0||x-rr>b.x1||y+rr<b.y0||y-rr>b.y1);
  // 两条基准线标签的碰撞盒先攒着,等 boxes 建好再一起塞进去(见 const boxes 那行)。
  // 不塞的话省名/市名会压在它们上面 —— 实测浙江:横线标签「全省 7.83万」被「慈溪」压掉半行。
  // 宽度按**字符类别**估(CJK 1em / ASCII 0.55em),不用 tw():那个按 2em/字估 CJK,是双倍。
  const bw=(str,fs)=>str.split('').reduce((a,ch)=>a+(ch.charCodeAt(0)>255?1:0.55),0)*fs;
  const baseBoxes=[];

  // 全国基线(横,红虚线):Y 轴是**城镇**居民人均可支配收入(不是全体居民口径,两者差约 1.3 万),
  // 基线 = 2024 全国城镇居民人均可支配收入 54188 元(与表格全国行同源)
  // opt.YB:横线(=全国城镇居民人均可支配收入)。默认取省级页那份;各市页传城市口径的同名值。
  const _ni=(opt.YB!=null)?opt.YB:((D.prov_nat && D.prov_nat.inc) ? D.prov_nat.inc/1e4 : null);
  if(_ni!=null && _ni>ya && _ni<yb){
    s.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:py(_ni),y2:py(_ni),stroke:BASEC,'stroke-width':1.5,
      'stroke-opacity':.8,'stroke-dasharray':'6 4'}));
    {
      const _tt=bn+' '+_ni.toFixed(2)+'万', _tx=W-P.r-4, _ty=py(_ni)-5, _w=bw(_tt,FS_AX);
      s.appendChild(txt(_tx,_ty,_tt,
        {'text-anchor':'end',fill:BASEC,'font-size':FS_AX,'font-weight':600,
         stroke:'#fff','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round'}));
      baseBoxes.push({x0:_tx-_w-2,x1:_tx+2,y0:_ty-FS_AX*1.25,y1:_ty+FS_AX*0.25});
    }
  }
  // 全国基线(竖,红虚线):X 轴是红利%,基线 = 31 省聚合的生源增幅(与表格首行同源)
  // opt.XB:竖线(=全国生源增幅基准)。默认 31 省聚合;各市页传**城市口径**的基准
  // (与「红利大市场」页那条竖红线同源 = D.nat_base),两页各说各的口径,不互相借。
  // ⚠ 这条默认路径**只有省级页**会走到(各市页显式传 XB/YB),所以这里跟 PV 而不是 LV ——
  //   省级页切到小学时,基准线要是还画高中那条,线就落在别的量纲上了。
  const _nb=(opt.XB!=null)?opt.XB:(D.prov_nat ? (PV==='high'?D.prov_nat.t:PV==='jun'?D.prov_nat.g3:D.prov_nat.pri) : null);
  if(_nb!=null && _nb>xa && _nb<xb){
    s.appendChild(el('line',{x1:px(_nb),x2:px(_nb),y1:P.t,y2:H-P.b,stroke:BASEC,'stroke-width':1.5,
      'stroke-opacity':.8,'stroke-dasharray':'6 4'}));
    const _tx=px(_nb)+5, _ty=P.t+11*FS_B, _tt=bn+'基准 '+(_nb>0?'+':'')+_nb+'%';
    s.appendChild(txt(_tx,_ty,_tt,
      {'text-anchor':'start',fill:BASEC,'font-size':FS_AX,'font-weight':600,
       stroke:'#fff','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round'}));
    baseBoxes.push({x0:_tx-2,x1:_tx+bw(_tt,FS_AX)+2,y0:_ty-FS_AX*1.25,y1:_ty+FS_AX*0.25});
  }
  // 气泡大小 = 在校生规模,但**压缩**:半径 ∝ ∛在校生(不是 √ 的严格成比例)。
  // 严格成比例时河南 294.5 万的半径是西藏 8.8 万的 5.8 倍,大圆会吞掉邻居、把图挤成一团
  // (用户口径:「体现出大小即可」)。开三次方后最大/最小降到 3.2 倍,量级仍一眼可辨;
  // 精确值走悬停提示(那里写着具体万数),不靠圆面积读。
  const SZ=p=>4.0*Math.cbrt(p||0);
  // ── 象限着色:两条全国基线把图切成四块 ──
  // 边界就是那两条红色虚线(竖=31 省聚合的生源增幅,横=全国城镇居民人均可支配收入),
  // 不另设阈值 —— 否则图上会出现两套"基准",读者不知道该信哪条。
  // **只标对角的两个**(右上 / 左下),另两个(左上=收入高但生源跌、右下=生源涨但收入低)
  // 留白:它们是"混合信号",没有一句话说得清,硬标会让人以为它们也被判过了。留白本身是信息。
  // 画在基线之后、气泡之前:泡泡永远压在高亮上,不会被糊掉。
  // 气泡的位置**先算出来、后画** —— 象限名要按它避让(见 QLABEL 的 avoid)。
  // 计算不产生 DOM,所以这里提前不影响画出来的层序(底纹 → 象限名 → 气泡 → 省名)。
  const pts=R.map(r=>({r:r,cx:px(r.red),cy:py(r.inc/1e4),rad:SZ(r.pool),hit:isHit(r)}))
              .sort((a,b)=>(b.r.pool||0)-(a.r.pool||0));
  const qbs=[];   // 象限名的碰撞盒(声明在这里因为 boxes 在下面才建;见那行 qbs.forEach)
  // 画一个象限名:居中 + 比轴标题大一档 + 占碰撞盒。两个象限共用,免得两处各写一遍走形。
  // 字号 FS_Q = 20·FS_B/SVG_K,渲染约 25px(轴标题 17.4px)—— 这是全图唯一需要隔着会议室
  // 看清的短语,居中也撑得住。宽度按**字符类别**算:CJK ≈ 1em/字,ASCII(空格、间隔号)≈ 0.55em。
  // ⚠ 不能用本文件通用的 `tw(n,u)`:它把每个非 ASCII 字符换成两个 'x' 再乘 u,等于按
  // **2em/字** 估 CJK,比实际宽整整一倍 —— 拿它算会误判成"装不下"而白白缩字号(踩过),
  // 碰撞盒也会虚胖一倍,凭空顶开周围的省名标签。
  const QLABEL=(x0,y0,x1,y1,text,color,op,avoid)=>{
    const qw=x1-x0, qh=y1-y0;
    if(qw<=0||qh<=0) return;
    const qwidth=fs=>text.split('').reduce((a,ch)=>a+(ch.charCodeAt(0)>255?1:0.55),0)*fs;
    let FS_Q=+(20*FS_B/SVG_K).toFixed(1);
    let qtw=qwidth(FS_Q);
    // 兜底:象限窄到放不下时按比例缩字号,不裁字也不出框(初中口径的基线位置与高中不同,
    // 象限宽度会变;实测两个口径、两个象限都够宽,但别让它哪天悄悄溢出)
    if(qtw>qw-20){ FS_Q=+(FS_Q*(qw-20)/qtw).toFixed(1); qtw=qwidth(FS_Q); }
    let tx=(x0+x1)/2, ty=(y0+y1)/2+FS_Q*0.36;   // 居中;+0.36em 是把基线压到视觉中心
    // ── avoid:在象限里挑一个**不压气泡**的落点 ──
    // 只有"混合"那两个象限需要(调用处传 true)。原因是数据分布:**结论角(双高/双低)是分布的
    // 极端,点本来就少;混合象限装的是分布的中段,点最密** —— 右下那块的正中就横着
    // 贵州/广西/河北 那一串,"收入低"三个字正好写在它们的圈上(实测)。居中硬放能读,
    // 但看着像没排版。省名标签有避让,象限名反而没有,说不过去。
    // 候选从正中往上下各试三档,先横后纵;都不行就退回正中(宁可压也不能没有)。
    if(avoid){
      const bub=b=>pts.some(p=>p.cx+p.rad+2>b.x0 && p.cx-p.rad-2<b.x1 &&
                               p.cy+p.rad+2>b.y0 && p.cy-p.rad-2<b.y1);
      const cands=[0,0.30,-0.30,0.42,-0.42].map(f=>(y0+y1)/2+qh*f+FS_Q*0.36);
      for(let i=0;i<cands.length;i++){
        const tyy=cands[i], box={x0:tx-qtw/2-2,x1:tx+qtw/2+2,
                                 y0:tyy-FS_Q*1.25,y1:tyy+FS_Q*0.25};
        if(box.x0<x0+2||box.x1>x1-2||box.y0<y0+2||box.y1>y1-2) continue;   // 不许出象限
        if(bub(box)) continue;
        ty=tyy; break;
      }
    }
    s.appendChild(txt(tx,ty,text,{'text-anchor':'middle',fill:color,'fill-opacity':op,
      'font-size':FS_Q}));
    // 占掉碰撞盒:省名标签不许压在上面(字压字会糊成一片)。
    // 气泡本身不管 —— 空心圈压过来照样读得出下面的字(去填充的附带好处)。
    // 纵向留够:CJK 字形的实际高度是**基线以上 ≈1.21em、以下 ≈0.18em**(实测微软雅黑),
    // 不是 0.86em —— 第一版按 0.86 留,碰撞盒顶部比真字低了 0.35em,于是"贵州"那个圆内标签
    // 的下沿擦着象限名的上沿过(实测重叠 16×3.3),检查放行、屏幕上是压着的。
    // 这里取 1.25/0.25,略宽于实测值,和文件里省名标签那套(ly-1.48em ~ ly+0.17em)同量级。
    qbs.push({x0:tx-qtw/2-2,x1:tx+qtw/2+2,y0:ty-FS_Q*1.25,y1:ty+FS_Q*0.25});
  };
  if(_nb!=null && _ni!=null){
    const qx0=Math.max(P.l,px(_nb)), qy0=P.t, qx1=W-P.r, qy1=Math.min(H-P.b,py(_ni));
    if(qx1>qx0 && qy1>qy0){
      s.appendChild(el('rect',{x:qx0.toFixed(1),y:qy0.toFixed(1),width:(qx1-qx0).toFixed(1),height:(qy1-qy0).toFixed(1),
        // 右上象限(高红利 × 高收入)的底纹**保留淡红**(用户口径 2026-09-27):
        // 它是「这一块是我们想要的」的语义着色,不是数据本体 —— 气泡本体退成黑灰时它不用跟着退,
        // 反而正好是全图唯一一处暖色,把「右上角是目标区」点出来。
        fill:'rgba(200,16,46,.055)',stroke:'none'}));
      // 用词**直接复述两根轴**:X = 生源增幅,Y = 城镇人均可支配收入。读者不用把词再翻译回坐标,
      // 这是它相对于「双高区」「优先进入区」那类说法的唯一优势 —— 不解释也不会有歧义。
      // 颜色**淡品牌红**:底纹就是同色的 .055,同族只深一档,整块区域读成"同一个东西",字是它的名字。
      // 不透明度 .45 而不是最初设想的 .20:实测 .20 时红底上这行字混出来是 rgb(241,191,200),
      // 对比度太低 —— 屏幕上像一块没擦干净的灰,投屏更看不见。.45 混出 rgb(228,140,154),
      // 是**能读出字的中粉**,同时又明显是"透过来的",不会像轴标题(#5f6670 实色)那样抢戏。
      QLABEL(qx0,qy0,qx1,qy1,'生源增幅高 · 收入高','#c8102e',.45);
    }
    // ── 左下象限:双低(生源增幅低于全国 且 收入低于全国)──
    // **灰,不是红**(用户口径 2026-09-27):红在这页同时是品牌色、基准线色、"我们想要的"色,
    // 再把"不想要的"也刷红,红就只剩"图上的一块颜色"这三个字的意思了。灰是这套色板里
    // **现成的「不加码」语义色** —— deck 那张阶梯的第 5 档「收缩」就是 #D5D8DD。
    // 底纹比右上更淡(.035 vs .055):右上那块小、是目标区,值得高亮;左下占半张图,
    // 刷重了是给背景上色、不是做标记。
    const lx0=P.l, ly0=Math.max(P.t,py(_ni)), lx1=Math.min(W-P.r,px(_nb)), ly1=H-P.b;
    if(lx1>lx0 && ly1>ly0){
      s.appendChild(el('rect',{x:lx0.toFixed(1),y:ly0.toFixed(1),width:(lx1-lx0).toFixed(1),height:(ly1-ly0).toFixed(1),
        fill:'rgba(31,35,41,.035)',stroke:'none'}));
      // 用词与右上同构,距离也对应 —— 两句合起来读就是"这根轴的两端",读者一眼定位。
      QLABEL(lx0,ly0,lx1,ly1,'生源增幅低 · 收入低','#5f6670',.45);
    }
    // ── 另两个象限:左上(收入高但生源跌)、右下(生源涨但收入低)──
    // **有名字、不填底纹**(用户口径 2026-09-27)。这两块是**混合信号** —— 一只脚站住、
    // 另一只没站住,没有一句话能说清该不该去,所以它们不该长得像结论。
    // 画面因此读作两级而不是四格:**底纹 = 结论(红=去 / 灰=不去),空白 = 没结论**。
    // 四个象限名仍然齐全,不会出现"这块没名字"的观感。
    // 字色与左下同(#5f6670/.45),与"没有底纹"一起表达"同一档,但没被判过"。
    // ⚠ 别给它们上淡红(左上也红、右下也红那种):左下被刷灰靠的是"两个低"叠加,
    // 而这两块各只有一个低 —— 上红会把"混合"读成"另一只脚也站住了",是语义错误。
    const ulx0=P.l, uly0=P.t,      ulx1=Math.min(W-P.r,px(_nb)), uly1=Math.min(H-P.b,py(_ni));
    QLABEL(ulx0,uly0,ulx1,uly1,'生源增幅低 · 收入高','#5f6670',.45,true);
    const lrx0=Math.max(P.l,px(_nb)), lry0=Math.max(P.t,py(_ni)), lrx1=W-P.r, lry1=H-P.b;
    QLABEL(lrx0,lry0,lrx1,lry1,'生源增幅高 · 收入低','#5f6670',.45,true);
  }
  // ── 画布边框(用户口径 2026-09-27:去掉网格线之后画布就没有边界了)──
  // 画**四边**而不是只画左+下的 L 形轴:两块象限底纹是贴着上沿和右沿的,只画两条边的话
  // 右上那块红的顶边与右边会悬在半空,像没画完。围起来之后,四块象限读作"被两条红基线
  // 切开的一个方框",而不是"四块浮在纸上的色块"。
  // 颜色用 --ln-1(#d5d8dd)、细 1px:它是**边界**不是网格,不该比数据先跳出来 ——
  // 这一页的深色只留给三样东西:气泡(墨圈)、两条全国基线(深红虚线)、象限名。
  // 画在底纹之后、气泡之前:底纹不会把它冲淡,气泡又能压在上面(空心圆跨过边框仍然读得出)。
  s.appendChild(el('rect',{x:P.l,y:P.t,width:(W-P.r-P.l).toFixed(1),height:(H-P.b-P.t).toFixed(1),
    fill:'none',stroke:'#d5d8dd','stroke-width':1}));
  pts.forEach(p=>{
    const g=el('g',{class:'pt'});
    // 县级市**不再用虚线圆**(用户口径 2026-09-27「不要虚线圆,都是实线」):原来虚线是为了标
    // 「它的经济分是县城池内百分位,与地级点不是一把尺」,现在这条改由**表格的「级别」列**承担。
    // ⚠ 幽灵点(搜索命中、没过门槛的那些)**仍是红虚线圈** —— 那是另一回事:它只在搜索时出现,
    // 而且虚线是它"不在本清单"的唯一标记,去掉就与真入选的城分不出来了(见 GH 那段)。
    // ★ 2026-10-08(用户口径:「只要这个城市有校区,气泡做一个标记,一眼看出已进入」):
    //   **已进入 = 品牌红淡填充 + 红描边**(`--c-in`),未进入保持空心灰。
    //   为什么是**红**:这一页里「已进入」本来就是红 —— 右边那张表的行首竖条
    //   (`.pvbox tr.ent td:first-child` 用 `var(--c-in)` = #c8102e)。同一页里同一含义
    //   只能有一种颜色,这条标记与那张表是一对,必须同色。
    //   ⚠ 2026-10-08 修正:第一版用了绿 #27ae60 —— 那个值是从**另一个页面**(趋势线缺口页)
    //     的调色板读来的。本页第 30 行写着 `--green:var(--brand)`,**这页的 green 变量本身就是
    //     品牌红**,整套是红体系、压根没有绿。用户当场看出来「表格用红、气泡用绿,冲突了吧」。
    //     教训:取语义色要看**本页**的调色板,不要凭「项目里应该是绿的」的印象 ——
    //     同一个仓库里不同页面可以有各自的色板,而这一页是全红体系。
    //   为什么用**填充**而不是别的:半径被「在校生规模」占了,颜色被红占了(标题条/两条基线/
    //   搜索命中);剩下最不打架、又在小气泡(最小 r≈8)上仍看得清的就是填充。
    //   已进入是少数(广东 7/28、江苏 8/38、四川 2/28),铺开不会压垮画面。
    //   ⚠ 不改成不透明实心:圆内还写着本市排名,实底会把字吞掉。
    //   ⚠ 填充比象限底纹浓一档(底纹是 rgba(200,16,46,.055))—— 太淡会被右上那块粉底吃掉。
    const cAttr={'data-pv':p.r.fm,cx:p.cx,cy:p.cy,r:p.rad,
      fill:p.r.ent?'rgba(200,16,46,.15)':'none',
      stroke:p.r.ent?'#c8102e':'#1f2329',
      'stroke-width':p.r.ent?2:1.6,'stroke-opacity':p.r.ent?.95:.82};
    if(q && !p.hit){ cAttr.fill='transparent'; cAttr['stroke-opacity']=.16; }
    else if(q && p.hit){ cAttr['stroke-width']=2.6; cAttr['stroke-opacity']=1; }
    g.appendChild(el('circle',cAttr));
    const t=el('title');
    t.textContent=p.r.n+' · '+nm+'在校生 '+p.r.pool+' 万 · 生源增幅 '+(p.r.red>0?'+':'')+p.r.red+'% · 城镇居民人均可支配收入 '+p.r.inc+' 元'
      // ★ 2026-10-06:普高率**只在高中档出现**。它是「高中在校 ÷ 初中在校(整 3 年错位)」——
      //   在小学档里与那一档毫不相干(实测悬停印出「小学在校生 868.5 万 … 普高率 58.0%」),
      //   初中档也只是背景(那一档要看的是小升初,不是初升高)。原来三档都印。
      //   ⚠ 判据用口径名(与 LVNM_() 里的 '高中' 同一串字),改档名时要一起改。
      +(nm==='高中'
          ? ' · 普高率 '+(p.r.r*100).toFixed(1)+'%'+(p.r.rnote?'(已按五四学制折算)':'')
          : '')
      // 与两张表的距峰值列**共用 yTxt** —— 原来这里自己拼了一句 `p.r.yrs+' 年'`,
      // 于是气泡悬停印出「距峰值 -3 年」(负号裸奔),而表里印的是「已过顶 3 年」。同一屏两种写法。
      +' · 距峰值 '+yTxt(p.r.pk,p.r.flat)
      // ★ 2026-10-08:份额只在「各市生源概览」页有意义(那页才有 opt.SHR,圆内也印它)。
      //   悬停里给全式:份额 + 分子分母 + 参培率取值 —— 否则圆内那个两位小数没人知道是怎么来的,
      //   而这一格恰恰是**唯一**能说明它来历的地方(圆内只放得下数字)。
      +(SHR&&p.r.shr!=null
          ? ' · 学大市场份额 '+p.r.shr.toFixed(2)+'%(在读学员 ÷ 参培池 '
            +p.r.cpv+' 万 = 该市 K12 在校生 '+p.r.stu3+' 万 × 参培率 '
            +Math.round((p.r.cplv||0)*100)+'%)'
          : '')
      // 高中在校是推算值时,悬停里也说一句(表上有 * 角标,但气泡是另一个落点)
      +(LV==='high'&&Array.isArray(p.r.est)&&p.r.est.indexOf(2025)>=0 ? ' · ⚠ 高中在校 2025 为推算值(非官方发布)' : '');
    g.appendChild(t); s.appendChild(g);
  });
  // 标签避让:预生成候选位再单层扫描 —— 写成 for...for 嵌套的话 break 只跳出内层,
  // 一个点会被画上好几个重复标签(本轮踩过)。
  const boxes=[];
  // 象限名与两条基准线标签先占位,省名/市名标签才会绕开它们
  qbs.forEach(b=>boxes.push(b));
  baseBoxes.forEach(b=>boxes.push(b));
  // ★ 2026-10-08(起因:用户问「西安为什么不显示市占率」)——
  //   圆内份额数字**不把象限名当障碍**,所以另存一份「前景盒」:基准线标签 + 已放的标签 +
  //   已放的份额数字,象限名不进这份。
  //   为什么必须分开:象限名是**背景装饰**(画在气泡之下、fill-opacity 低),它的碰撞盒却跟省名
  //   一样大(实测陕西「生源增幅高 · 收入高」= 210×29)。西安是全省最大的圆(rad 10.99)、
  //   份额全国最高(4.95%),圆心正好落在那个盒子里 → clashS 判真 → **最大的一个反而没有数字**。
  //   而同一套盒子的省名照旧要避让象限名(字压字确实会糊),所以不能把 qbs 从 boxes 里删掉。
  const fgBoxes=[];
  baseBoxes.forEach(b=>fgBoxes.push(b));
  // 放一个标签:成功返回 true。leader=true 时从气泡边缘拉一条引线到标签(第二遍兜底用)
  const put=(p,can,leader)=>{
    // p._nm:装不进圆的份额已经挂在名字后面(「太仓 2.0%」),这里照着印
    const name=p._nm||p.r.n, w=tw(name,7.0), h=16*FS_B;   // 与 FS_PM 匹配(CJK 每字≈字号);tw 里已经乘过 FS_B
    for(let i=0;i<can.length;i++){
      const lx=can[i][0], ly=can[i][1], an=can[i][2];
      const x0=an==='middle'?lx-w/2:(an==='start'?lx:lx-w), x1=x0+w;
      const y0=ly-h+2, y1=ly+2;
      if(x0<P.l-2||x1>W-P.r+2||y0<P.t-6||y1>H-P.b+6) continue;
      const box={x0:x0,x1:x1,y0:y0,y1:y1};
      if(boxes.some(b=>!(x1<b.x0||x0>b.x1||y1<b.y0||y0>b.y1))) continue;
      if(pts.some(q=>q!==p && hitB(box,q.cx,q.cy,q.rad+1))) continue;
      boxes.push(box); fgBoxes.push(box);
      if(leader){                       // 引线:气泡边缘 → 标签锚点(先画,标签压在上面)
        const dx=lx-p.cx, dy=ly-p.cy, L=Math.hypot(dx,dy)||1;
        s.appendChild(el('line',{x1:p.cx+dx/L*(p.rad+1),y1:p.cy+dy/L*(p.rad+1),x2:lx,y2:ly,
          stroke:'#d5d8dd','stroke-width':1}));
      }
      s.appendChild(txt(lx,ly,name,{'text-anchor':an,fill:'#1f2329','font-size':FS_PM,
        stroke:'#fff','stroke-width':2.5,'paint-order':'stroke','stroke-linejoin':'round'}));
      return true;
    }
    return false;
  };
  // ── 名字优先写进圆里 ──
  // 省名 2–4 字(≈字号 × 字数),半径 ≥ 14px 就装得下;更小的圆(青海/海南/西藏/宁夏几个)
  // 继续走下面的外置标签 + 引线。写进圆里的先占掉碰撞盒,免得外置标签压上来。
  const FS_IN=10.5*FS_B;
  const wIn=name=>name.replace(/[^\x00-\xff]/g,'xx').length*(FS_IN*0.5);   // CJK ≈ 1em/字
  const left=[];
  pts.forEach(p=>{
    if(q && !p.hit) return;          // 搜索态下只命中省带名字
    // ⚠ nm / wi / ibox / clash **等份额那段跑完再算**:圆里装不下份额时,份额会挂到名字上
    //   (印成「太仓 2.0%」),长度跟着变 —— 先算就等于按短名字判过一次碰撞,后面全歪。
    let shrOut=null;

    //   装不下就不写:份额跨两个数量级(0.05% 到 5%),字号缩到 6px 以下就没人读得出,

      // ★ 2026-10-08 用户口径:份额**小于 0.1% 的统一写成「<0.1%」**(起因:「珠海的市场份额
      //   是非常小所以不显示吗?这种都统一调整成 0.1%」)。实查珠海 shr=0.06%,原来按两位小数
      //   印「0.06%」= 3.40em,而它那个圆 rad=6.77 → 反算字号 4.86 < 下限 5.0,整颗气泡没数字。
      //   改成统一下限写法后两个好处:① 所有「极小」看起来一致,不再出现 0.06% / 0.08% 这种
      //   差一位就没意义的区别;② 文本 3.40em → 2.85em,珠海这类小圆现在装得下。
      //   也就是说这是**显示下限**、不是四舍五入:珠海真值 0.06% 印成 0.1%。真值在圆点悬停里

      // ⚠ 判据是 **0.1 不是 1**:原来写 ≥1 一位、其余两位,于是 0.76 印成「0.76」四个字符,
      //   在大圆里都装不下,东莞这种中等份额的城干脆没数字 —— 而它恰恰是「已进入、份额不小」的那类。
      //   ⚠ **真零不能并进来**:厦门/温岭在营收表里就是 0 人(不是「很小」),印成 0.1% 等于报了一个
      //     源里没有的值。所以三档:0 → 「0%」(真零,本身就是个要看的信号:有校区、0 在读)、
      //     0<x<0.1 → 「0.1%」(下限)、≥0.1 → 一位小数。
      const sTxt=(p.r.shr>=0.1 ? p.r.shr.toFixed(1)+'%' : (p.r.shr>0 ? '0.1%' : '0%'));
      // ★ 字号**按圆反算**,不是固定值(固定字号实测全军覆没:一个都画不出来)。
      //   加上百分号后文本变长(如「2.8%」= 2.29em),预算 = **2r+3**(允许轻微出圆,
      //   白描边 + 空心圆所以出一点不影响读)。字号下限 5.0×FS_B ≈ 渲染 8px ——
      //   再小就没人读得出了,那种圆宁可留空。
      //   实测三档能显示的比例(静态模拟):高中 64/73、初中 69/73、小学 73/73;
      //   显示不出的全是最小的那批气泡(半径 <7),基本都是县级市。
      const wEm=SHR_W(sTxt);
      const fMax=10*FS_B, fMin=5.0*FS_B;
      const f=Math.min(fMax,(2*p.rad+3)/wEm);
      const wpx=wEm*f, hiS=f+2;
      const ibS={x0:p.cx-wpx/2,x1:p.cx+wpx/2,y0:p.cy-hiS/2,y1:p.cy+hiS/2};
      // ⚠ 用 fgBoxes(前景盒)而不是 boxes:象限名不进这份 —— 见上面那段。
      const clashS=fgBoxes.some(b=>!(ibS.x1<b.x0||ibS.x0>b.x1||ibS.y1<b.y0||ibS.y0>b.y1));
      // ★ 2026-10-08 二改(起因:用户连问「珠海」「西安」为什么不显示)——
      //   圆里**装不下**的,不再空着,而是把份额挂到城市名上(外面那个标签印成「太仓 2.0%」)。
      //   为什么必须挂:装不下的恰恰是**盘小但份额高**的那批(太仓 2.0%、海安 2.9%、永康 2.4%,
      //   半径只有 4.0–4.6 → 反算字号 4.8 < 下限 6.2),而这一页要看的正是「我们在哪些城份额高」
      //   —— 把份额最高的一批藏起来比字号小难接受得多。字号下限不动(再小没人读得出)。
      if(f>=fMin && hiS<=2*p.rad-2 && !clashS){
        boxes.push(ibS); fgBoxes.push(ibS);
        s.appendChild(txt(p.cx,p.cy+f*0.36,sTxt,{'text-anchor':'middle',fill:'#1f2329',
          'font-size':f,'font-weight':600,stroke:'#fff','stroke-width':2.2,
          'paint-order':'stroke','stroke-linejoin':'round'}));
        // ⚠ **不能 return** —— 2026-10-08 修:原来这里 return,等于「圆里写了数字的城,
        //   名字既不进圆(下面那条被 SHR 挡了)也不出圆(这段 return 掉了)」,
        //   于是已进入的城市**全体无名**。用户实测看到:「广东有些城市名字没显示」。
        //   现在的分工:数字占圆内、名字走圆外引线标签 —— 两条路都留着。
        //   (名字若还想进圆,下面那条 clash 检查会因为数字的碰撞盒已经占位而判不过,
        //    自动落到圆外,不会与数字重叠 —— 所以不需要再判 SHR。)
      }
      else shrOut=sTxt;      // 圆里放不下 → 交给名字标签(见下一行拼接)
    }
    // 装得下就没这一步:数字占圆内、名字照旧。装不下才拼成「太仓 2.0%」。
    if(shrOut) p._nm=p.r.n+' '+shrOut;
    const nm=p._nm||p.r.n, wi=wIn(nm), hi=FS_IN+3;
    const ibox={x0:p.cx-wi/2,x1:p.cx+wi/2,y0:p.cy-hi/2,y1:p.cy+hi/2};
    // 装得下**且**不与已放好的名字重叠才写进圆里。密集区的圆本身互相压着,
    // 不判碰撞的话两个圆里的字会叠在一起(实测:山东/安徽/河南那一团糊成一片)。
    // 判不过的落到下面走外置标签 + 引线。
    const clash=boxes.some(b=>!(ibox.x1<b.x0||ibox.x0>b.x1||ibox.y1<b.y0||ibox.y0>b.y1));
    if(wi<=2*p.rad-2 && hi<=2*p.rad-2 && !clash){
      boxes.push(ibox);
      // 同上:圆内省名也用墨色。它与外面那些浮动省名是同一类东西(都是省名),
      // 一个红一个黑,读者会以为是两种含义。
      // 字重与圆外那些浮动省名**拉平**(用户口径 2026-09-27):同一张图里两种字重的省名,
      // 看着像两种含义(一个"重点省"一个"普通省"),而这里的分野只是"装得进圆/装不进圆",
      // 是排版的偶然,不是数据。整张图的省名统一常规字重,靠墨色 + 白描边区分于背景。
      s.appendChild(txt(p.cx,p.cy+FS_IN*0.36,nm,{'text-anchor':'middle',fill:'#1f2329',
        'font-size':FS_IN,'stroke':'#fff','stroke-width':2,
        'paint-order':'stroke','stroke-linejoin':'round'}));
      return;
    }
    const cands=[];
    [1.0,1.7,2.5].forEach(function(k){
      const r2=p.rad*k, dg=r2*0.72;
      cands.push(
        [p.cx,p.cy-r2-6,'middle'],      [p.cx,p.cy+r2+13,'middle'],
        [p.cx+r2+5,p.cy+4.5,'start'],   [p.cx-r2-5,p.cy+4.5,'end'],
        [p.cx+dg+4,p.cy-dg+4,'start'],  [p.cx-dg-4,p.cy-dg+4,'end'],
        [p.cx+dg+4,p.cy+dg+8,'start'],  [p.cx-dg-4,p.cy+dg+8,'end']);
    });
    if(!put(p,cands,false)) left.push(p);
  });
  // 第二遍:密集区里第一遍放不下的,拉到更远处 + 引线(否则这些省没名字)
  left.forEach(p=>{
    if(q && !p.hit) return;
    const cands=[];
    [3.2,4.3,5.6,7.0,8.8,11].forEach(function(k){
      const r2=p.rad*k;
      [[0,-1],[0,1],[1,0],[-1,0],[0.7,-0.7],[-0.7,-0.7],[0.7,0.7],[-0.7,0.7]].forEach(function(a){
        const lx=p.cx+a[0]*r2, ly=p.cy+a[1]*r2+(a[1]>0?6:(a[1]<0?-6:4));
        cands.push([lx,ly,a[0]>0.2?'start':(a[0]<-0.2?'end':'middle')]);
      });
    });
    put(p,cands,true);
  });
  host.appendChild(s);
}

function aRows(){
  const q=($('q').value||'').trim().toLowerCase();

    !q || r.c.toLowerCase().indexOf(q)>=0 || r.p.toLowerCase().indexOf(q)>=0);

  return rs.slice().sort((a,b)=>{
    const av=f(a), bv=f(b);

    if(an) return 1; if(bn) return -1;               // 空值永远沉底,与升降无关
    const r=(typeof av==='number'&&typeof bv==='number') ? av-bv : String(av).localeCompare(String(bv),'zh');
    return aDir<0 ? -r : r;

function aHead(){
  // 无分组的列跨两行(rowspan=2),有分组的列合并成一格(colspan)+ 第二行放子表头。
  // 两条分支都必须输出 data-s —— 早先只有子表头那条带,导致城市/省/级别/经济/校区/排名

  const th=(c,span)=>{

      +'<span class="ar">'+(on?(aDir<0?'▼':'▲'):'⇅')+'</span></th>';
  };
  let top='', bot='', i=0;
  while(i<ACOLS.length){
    const c=ACOLS[i];
    if(!c[4]){ top+=th(c,2); i++; continue; }
    let j=i; while(j<ACOLS.length && ACOLS[j][4]===c[4]) j++;   // 同组连续列
    top+='<th colspan="'+(j-i)+'" class="grp">'+c[4]+'</th>';
    for(let m=i;m<j;m++) bot+=th(ACOLS[m]);
    i=j;

  return '<colgroup><col style="width:34px">'
    + ACOLS.map(c=>'<col style="width:'+c[2]+'px">').join('') + '</colgroup>'
    + '<thead><tr><th rowspan="2" class="l">#</th>'+top+'</tr><tr>'+bot+'</tr></thead>';
}

// 把总表区高度对齐到卡片高度:先把高度压成 0 让总表不参与撑高,
// 量出「最高的那一页」(①的气泡图)决定的卡片高度,再回填给表格区。
// 窄屏(≤1080px)下 .split 变单列,①那一页会比总表还高得多,回填会算出巨大的表高 —— 此时交回 CSS 的 72vh。
function fitAll(){
  const pane=document.querySelector('.paneAll'), vp=$('vp');
  if(!pane) return;
  if(window.innerWidth<=1080){ pane.style.height=''; return; }
  // 卡片里除表格区之外还有两块:统计条 .corpus 与筛选栏 .allbar。
  // 早期只减了 .allbar(那时还没有统计条),结果「城市趋势」页总比卡片高出一个统计条,
  // 每跑一次 fitAll 就把卡片顶高约 58px —— 这个坑让六页都白空了 58px。
  const chrome=['.corpus','.allbar'].reduce((a,sel)=>{
    const e=document.querySelector(sel); return a+(e?e.getBoundingClientRect().height:0); },0);
  pane.style.height='0px';
  const h=vp.getBoundingClientRect().height - chrome;
  pane.style.height=Math.max(260, Math.round(h))+'px';
}

let _rt; window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{fitCharts();moveInd(true);},140);});

// 它 overflow:auto,压低只是多个内滚,不改任何数据口径,所以可以拿它继续换高度。
const PLH_MAX=680, PLH_MIN=300;

let PLH_L=PLH_MAX;      // 其余页右栏(只压,见 CSS 注释)

function fitCharts(){
  // ⚠ 这套以前是「迭代到刚好放下」:卡片高由各页撑出来,各页又往卡片里填 ——
  //   两边互相反馈,收敛点会飘(同一档窗口两次量到的卡片高能差十几像素,
  //   全国趋势因此总比别人矮一截、下面空一块)。
  //   现在改成**确定式**:卡片高直接由窗口算,各页去填它,没有反馈环。
  CHS=1; PLH=PLH_MAX; PLH_L=PLH_MAX;

  applyPLH();
  const wrapEl=document.querySelector('.wrap');
  // ① 卡片高 = 窗口高 − 卡片外固定开销 − 余量。
  //    「卡片外固定开销」= 卡片顶到页面顶(顶栏 + tab + 各自外边距)+ wrap 下内边距;
  //    卡片顶的位置与卡片自身多高无关,所以这个式子是稳定的。
  const dock=$('vp').getBoundingClientRect().top+parseFloat(getComputedStyle(wrapEl).paddingBottom||0);
  const CARD=Math.max(240, Math.round(window.innerHeight-dock-SAFE));
  $('vp').style.height=CARD+'px';
  // 右栏表格的高度上限也得跟卡片走:卡片只有 579 高时,表格还封在 680 就会把整页顶穿
  // (旧的全局收放顺带管了这件事,它删掉之后必须自己设)。
  // −95 而不是 −60:让出的是「表格所在页,图栏以外的部分」——清单页里「红利大市场」
  // 的筛选栏最高(89px,控件最多),再加内边距。按 60 让的话那两页会顶出 29px 被裁掉。
  PLH=Math.min(PLH_MAX, Math.max(PLH_MIN, CARD-95));
  PLH_L=PLH;
  applyPLH();
  // ② 各页把图填满自己的栏(卡片高已定,所以一次到位;pageFill 内部迭代两次兜住取整)
  CHART_REDRAW.forEach(f=>f()); fitAll();

  const sp=document.querySelector('.slide.prov .split');
  if(sp){
    const S=Math.round(sp.getBoundingClientRect().height);
    if(S>0 && Math.abs(S-PLH)>1){ PLH=S; applyPLH(); fitAll(); }
  }
  // ④ 硬兜底:窗口特别矮、或环境里有我们量不到的溢出时,整页缩一点。
  //    **「不滚动」比「字号一定够大」更硬**。

  //    实际上现在**跑不到**:上面 CHART_REDRAW 里的 redrawProv() 会先把 PROVTREND 清掉、
  //    回到气泡图 —— 也就是说 resize 会退出趋势视图(既有行为,不是这次引入的)。
  //    留着是因为它只依赖两条:trCap 是幂等的、PROVTREND 非空。哪天重画顺序变了它自动生效,
  //    比那时候再回来补一行靠谱。

function hardFit(){
  const wrap=document.querySelector('.wrap'); if(!wrap) return;
  wrap.style.zoom='';
  for(let i=0;i<4;i++){
    const need=document.body.scrollHeight-window.innerHeight+SAFE;
    if(need<=0) return;
    const h=wrap.getBoundingClientRect().height;
    if(!(h>0)) return;
    const z=parseFloat(wrap.style.zoom||'1');
    const nz=Math.max(.5, +(z*(h-need)/h).toFixed(4));
    if(Math.abs(nz-z)<0.002) return;
    wrap.style.zoom=nz;
  }
}

const PAGE_CHART=[['nat','cn'],['prov','cp'],['pc','cp2'],['pc3','cp4'],['pc4','cp5'],['pc5','cp6'],['pc6','cp7'],['pc7','cp8'],['pc8','cp9'],['pc9','cp10'],['pc12','cp13'],['pc13','cp14'],['pc14','cp15'],['pc2','cp3'],['pc16','cp17'],['pc17','cp18'],['pc18','cp19'],['pc19','cp20'],['pc20','cp21'],['pc21','cp22'],['pc22','cp23'],['pc23','cp24'],['pc24','cp25'],['pc25','cp26'],['pc26','cp27'],['pc27','cp28'],['pc28','cp29'],['pc29','cp30'],['pc30','cp31'],['pc31','cp32'],['big','cBig'],['free','cFree'],['in','c1'],
                  ['deep','c2'],['out','c3'],['mkt','c4']];
function paneOf(svg){ return svg.closest('.paneR') || svg.closest('.natwrap'); }
// ⚠ 必须把**外边距**也算进去。只算子元素高度会漏掉 `.nathead` 的 `margin-bottom` 之类,
//   于是目标算出来偏大 —— 内容高出卡片十几像素,被 `.viewport{overflow:hidden}` 裁掉,
//   表现正是「全国趋势看不到年份轴」(实测 natwrap 970 > 卡片 959,裁掉 11px)。
function othersIn(svg){
  const par=paneOf(svg); if(!par) return null;
  const cs=getComputedStyle(par);
  const m=e=>{const g=getComputedStyle(e);
    return (parseFloat(g.marginTop)||0)+(parseFloat(g.marginBottom)||0)
         +(parseFloat(g.paddingTop)||0)+(parseFloat(g.paddingBottom)||0);};
  let o=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
  [...par.children].forEach(c=>{
    if(c.contains(svg)){ o+=m(c); return; }                 // 含图的那一支:只算它的内外边距
    o+=c.getBoundingClientRect().height+m(c);
  });
  return o;
}
// 页内「图栏以外」的部分:说明段(省级页的 .why)、筛选栏(清单页的 .allbar)……
// ⚠ 别按类名找(.why / .allbar)——各页用的类名不一样,按类名找必然漏,
//   漏了就把目标算大、内容高出卡片被裁掉。这里改成结构判据:凡是不含这张图的直接子元素都算。
function pageExtra(slide,svg){
  let o=0;
  [...slide.children].forEach(function(c){
    if(c.contains(svg)) return;
    const g=getComputedStyle(c);
    o+=c.getBoundingClientRect().height+(parseFloat(g.marginTop)||0)+(parseFloat(g.marginBottom)||0);
  });
  const cs=getComputedStyle(slide);
  return o+(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
}
function pageFill(){

  // 各页逐个长高的过程中卡片在变,排在前面的页(全国趋势)会拿旧的卡片高算出一个偏小的目标。
  // 两轮不够(实测全国趋势停在 90%,别页 94%),四轮才收敛。
  for(let i=0;i<4;i++){
    const card=$('vp').getBoundingClientRect().height;
    const nat=slideNaturals();
    let changed=false;
    PAGE_CHART.forEach(function(pc){
      const s=nat.filter(x=>x.el.classList.contains(pc[0]))[0]; if(!s||!s.svg) return;
      const cur=s.svg.getBoundingClientRect().height;
      // 目标 = 「本页正好等于卡片高」时图表该有多高:卡片高 − .why − 栏内边距与图例 − 1。
      // ⚠ 原来的写法是「卡片高 − (本页高 − 图高)」,只扣了「除图以外」,漏掉 .why 与栏内边距;
      //   更要紧的是本页高被旁边那张表撑着时,这个式子会以为「页高没变 = 还没填满」,
      //   每轮只挪几像素(实测 1280×800:344→360→366,而栏是 680,只填了 54%)。
      //   改成闭式之后一步到位,不用迭代。
      let want=0;
      const oth=othersIn(s.svg);
      if(oth!=null) want=card-pageExtra(s.el,s.svg)-oth-8;   // −8:留出取整与 1px 边框的余量,别让本页反超卡片
      if(!(want>0)) want=card-(s.h-cur)-1;    // 找不到栏(理论上不会有):退回老式子
      if(!(want>0)||!(cur>0)) return;
      const f=want/cur;
      if(Math.abs(f-1)<0.004) return;         // 已经贴合
      // ⚠ 这里**不要**再加「f<1 就交给全局收缩」那种护栏 —— 那是旧的 CHS 体系留下的:
      //   现在没有全局收缩了,留着它 = 没有任何东西负责把图缩小,
      //   页面矮的时候图就会比卡片高、被 .viewport{overflow:hidden} 裁掉(实测 1440×900 下图高 725 而目标 688)。
      CH_FILL[pc[1]]=Math.max(0.3, Math.min(2.4, (CH_FILL[pc[1]]||1)*f));
      changed=true;
    });
    if(!changed) return;
    CHART_REDRAW.forEach(f=>f()); fitAll();
  }
}

// 默认值 = 生成器口径(生源增幅<0% / 经济档 高·中·低 / 已进入),首屏与生成器出的 l3 清单一致。
// **经济档三档全开是有意的,不是漏配**(2026-09-15 与业务确认):「红利消退市场」判的是
// 「生源已经转负」,这是 L1 的镜像 —— 那边找增幅够高、这边找增幅已转负。再用经济档筛一遍,
// 等于把「经济好但生源在跌」的城(济宁62/重庆74/宜宾58/晋中55,都高于中位49)提前摘出去,
// 而那恰恰是最该被看见的一类。**别把三档全开改成高·中。**
// 门槛是 ① ② 的镜像:那边找「跑赢大盘」,这边找「跑输大盘」,所以控件是上限而非下限。
// ⚠ 2026-09-15 语义变更(用户确认):阈值由 0 改成全国基准,「收缩」从「绝对萎缩」
//   变成「跑输大盘」—— 仍在增长但慢于全国的城(+1%~+4%)也会进来(7 城 → 21 城)。
// 严格小于,不是 ≤:原来判据取 _red∈{收缩,严重收缩},而 0~10 那一档叫「平稳」不算收缩,
// 所以 t=0 的城本来就不在清单里,用 ≤ 会多放进来一批。
// L3(红利消退市场)的默认是**不筛经济**:那一页问的是「生源在跌」,与经不经济无关 ——
// 所以默认 0(不限)而不是中位数。生成器那边 L3 也仍然不看经济分,两边一致。
const L3D=Object.assign(redPair(D.l3_red),{pci:0});   // 0 = 不筛(这一页问的是「生源在跌」,与富不富无关)
const l3red = () => LV==='jun' ? L3D.J : LV==='pri' ? L3D.P : L3D.H;
function l3rows(){
  return D.all.filter(function(x){
    // 省份筛选放**最前**:它是外层作用域,先于门槛。放后面的话「广东某城没过门槛」会
    // 报成门槛原因,而用户刚选了广东 —— 该说的是"它不在这页的口径里",不是"它不够格"。
    if(PROVP.l3 && x.p!==PROVP.l3) return false;
    const t=RED_OF(x);
    if(x.es!=='in') return false;                      // 已进入 = 清单定义
    if(t==null) return false;                          // 无红利 → 不进清单(收入那关下面单独判)
    if(!(t < l3red())) return false;                    // 红利上限(严格小于,按当前口径)
    if(x.pci==null || x.pci/1e4 < l3pci()) return false;  // 收入门槛(默认 0 = 不筛)
    return true;
  }).sort(function(a,b){ return RED_OF(a)-RED_OF(b); });   // 跌得最狠的排最前
}
function applyL3(){
  const rs=sortList('l3', l3rows());
  const qs=qPrepare('l3',rs,QWHY.l3);
  const host=$('c3');
  host.innerHTML='';
  if(rs.length || qs.ghost.length) chart1(host,rs,{
    GHOST:qs.ghost,
    // ★ 2026-09-28 用户口径「经济综合分的都改成人均收入吧」:这三页的纵轴从**经济综合分**
    //   (城镇收入/人均存款/人均GDP/人均财政 四项的池内百分位均值,0–100)换成**人均收入**
    //   (其中一项的原始值,元)。两者不可直接比:一个读不出"几万",一个读不出"排第几"。
    //   换的理由:原始量投屏上直接读得出(「4.5 万」),百分位得先解释一遍。
    //   ⚠ 经济分**仍然是筛选条件**(工具条那个「经济分 ≥」步进器),只是不再当纵轴 ——
    //     所以表格里那一列也换成人均收入(纵轴的值在表里读不到就只能靠悬停,而投屏时用不上)。
    //   ⚠ YMAX 必须给大值:chart1 的纵轴默认上限是 100(那是经济分的量纲),
    //     人均收入是几万,不放开会被夹成一条平线。
    //   ⚠ 横基准线也随之换:默认那条是"经济分全国中位 49",单位对不上了。
    YF:function(r){ return r.pci; },
    YLAB:'城镇居民人均可支配收入(万元)',
    YMAX:1e9,
    YTICK:v=>(v/10000).toFixed(1),
    HLINES: D.pci_base!=null ? [{v:D.pci_base, txt:'全国中位 '+(D.pci_base/10000).toFixed(1)+' 万'}] : [],
  });
  else host.innerHTML='<div class="empty">'+(LV==='pri' ? priWhy()
    : provEmptyTxt('l3')+'（放宽 生源增幅上限或人均收入门槛试试）')+'</div>';
  hlChart(host,qs.match);
  CUR.l3=rs; render('l3','t3',rs);
  qRow('t3',qs.match);
  // ⚠ 计数行**必须用 innerHTML**:provCntTxt 的返回值里有 <b>。
  // 这里**不追加**「其中已进入 N 城」—— L2/L3 的行集定义就是 es==='in',那个数恒等于
  // rs.length,写成「当前 15 城 · 其中已进入 15 城」是废话(上面那段注释也是这么说的)。
  // ⚠ 2026-09-28 清掉半句残留:原来这半句被写在上一行结尾的 `//` 后面 —— **整段都在注释里,
  //   从来没执行过**,但 `nIn` 还照算不误,看着像是在用。读代码时「看着像在用、其实没跑」
  //   比明显的死代码更费时间。顺带把那条 innerHTML 警告从注释里挪出来(它当时也被吞了)。
  $('l3cnt').innerHTML=provCntTxt(rs.length,PROVP.l3);
}
function resetL3(){
  { const _p=redPair(D.l3_red); L3D.H=_p.H; L3D.J=_p.J; L3D.P=_p.P; }   // 两口径都回各自的全国基准
  L3D.pci=0;   // 红利消退市场不筛收入(见 L3D 定义处的注释)
  STEPS.l3.paint(); STEPS.ec3.paint();
  applyL3();
}
$('l3reset').addEventListener('click',resetL3);

// ══ 大盘子 / 覆盖薄弱(2026-09-28 新增)══════════════════════════════════════════════
// 换了一根轴:前面三张清单全在**增速**轴上(红利大市场 / 存量红利 / 红利消退),没有一页回答
// 「绝对盘子有多大」。这两页就是那一问 —— 判据都是「盘子大 × 我们没占住」,只在「怎么算没占住」
// 上分岔:大盘子看本市排名,覆盖薄弱看每校区背多少生源。
//
// ★ 两页**共用一套函数**,只靠 POOLP 这张规格表分岔。不是图省事:用户口径是
//   「两条判据都做出来,看完再选一个」,选完要删掉另一个。复制两遍的话,删的时候要在
//   ORDER / CHART_REDRAW / PAGE_CHART / QWHY / QREAPPLY / PROVP / CUR / STEPS / setProv /
//   makeProvPick / COLS / cells 十来处各回退一次;共用之后删一边 = 删规格表一行 + 它的 DOM
//   + 各注册表里那一行。那十来处**仍然每页各占一行**(注册表按页键索引,泛化不了),
//   但每行都短、删起来是整行删。
//
// ★ 盘子门槛用的是**池内 90 分位**(生成器下发),不是前几页那套中位数 —— 理由写在
//   make_ceo_actions.py 的 BIG_PCT 那段:这几页盘子就是主角,取中位会放进全国一半的城。
const POOLP={
  big:{ cnt:'bigcnt', host:'cBig', tid:'tBig', menu:'bigMenu', pick:'bigW', in:'bigIn',
        reset:'bigreset', why:'big', st:{pc:'bigPc',gt:'bigGt'} },
  // 自由筛选:同一套渲染路径(见 applyPool),只是它的 st 是**三个可选门槛**(不是 big 的
  // 两个常开门槛)—— 名字按用途: pci=收入 / red=增幅 / sz=规模。进入状态不是步进器,
  // 它是个三档开关(不限/已进入/未进入),自己一套 paint(见 freeEntPaint),不进 STEPS。
  free:{ cnt:'freecnt', host:'cFree', tid:'tFree', menu:'freeMenu', pick:'freeW', in:'freeIn',
         reset:'freereset', why:'free', st:{pci:'freePci',red:'freeRed',sz:'freeSz'} },
};
// 门槛状态 —— 与 L1D/L2D/L3D 同一套路:两口径各存一份,切口径不冲掉用户调好的值;
// 默认值全部从 D 取(生成器下发),模板里不另写一份数字(否则改一处忘一处,首屏就与清单对不上)。
// 这两页**没有红利门槛**:它们不过滤增幅(见生成器 _cal_lists —— 缺增幅的城照收,只是画不上)。
// ⚠ 盘子门槛存的是**百分比**(前 N%),不是绝对值 —— 用户口径 2026-09-28。
//   绝对值由 poolQ() 按同一算法现算(且随口径走),所以这里没有 di/co 那两对。
const BIGD ={top:D.big_top, rank:D.big_rank};
// ── 「自由筛选」的门槛状态(2026-09-29)──
// 与 BIGD 的区别:big 的两个门槛**永远开着**(有默认值,重置也是回到默认),这一页的三个
// 门槛**默认全关**(不设 = 不限),所以「不限」必须有个明确取值,不能靠 0 冒充 ——
// 收入/规模用 0(库里最小 2.9 万 / 0.1 万,0 比它们都小,天然等价于不限);
// 增幅不能用 0(0% 是个真门槛,库里还真有增幅为负的城),所以单独给一个下限常量
// FREE_RED_LO = 该步进器的下限 = 「不限」。库里实测:高中 t ∈ [−14, 25]、初中 g3 ∈ [−16, 15],
// 下限取 −20 已经比最小值更低,「退到下限」= 一个都筛不掉,语义上就是不限。
const FREE_RED_LO=-20;
const FD ={pci:0, red:FREE_RED_LO, sz:0, ent:''};   // ent: '' 不限 / 'in' 已进入 / 'notin' 没进去的
// 「画不出」带子是否展开(点击切换)。用 let 存**跨重画**的状态 —— 带子每次 applyPool 都重写
// innerHTML,状态放 DOM 上的话一切条件就被打回收起。
let FREE_NO_OPEN=false;
// 覆盖指数的门槛**两个口径共用**(指数已按各自的中位归一,100 在两个口径里
// 都是「我们自己的中位水平」)—— 所以这里不像 top 那样分高低两份。
// ★ 2026-09-28:「覆盖薄弱」页删掉之后,THIND / thinIdx / densIdx / densCell 一整组都没人用了,
//   连同生成器那边的 _dens_base / DENSB_* / DENS_THR / min_didx 一起删干净。
//   留着不是"以备不时之需":下次有人做新页时会先看到这一组,以为它是通用度量。
// 该池在「前 N%」处的在校生门槛 —— 与生成器 make_ceo_actions.py 的 `_pool_q` **同一算法**:
// 该池在校生排序后取第 int(n × (1 − N/100)) 位的**原值**。
// ★ 两边都**不四舍五入**。这一条踩过:生成器原来 round(v,1),18.92 → 18.9 把门槛压低、
//   而县城的 3.57 → 3.6 又把门槛抬高(四舍五入是双向的),结果「前 10%」实际收进 7 座县城
//   (该池 87 座,前 10% 应是 9 座)。**百分比口径下,"四舍五入到一位小数"不是无害的美化,
//   是当场改变清单**。要 round 就两边一起 round,而且要挑同一种舍入规则(Python 的 round
//   是四舍六入五成双、JS 的 Math.round 是四舍五入,18.95 会分家)。显示时才 toFixed。
function poolQ(k, county){
  const key = LV==='high' ? 'hs25' : LV==='jun' ? 'mid25' : 'prim';
  const v = D.all.filter(function(x){ return !!x.is_county===county && x[key]!=null; })
                 .map(function(x){ return x[key]; }).sort(function(a,b){ return a-b; });
  if(!v.length) return 0;
  const top=(k==='big'?BIGD:L1D).top;
  return v[Math.min(Math.floor(v.length*(1-top/100)), v.length-1)];
}

// ⚠ 行集函数体里**不许出现搜索词变量**(协议 P10,与 l1rows/l2rows/l3rows 同一条,
//   检查是按 `\bQ\b` 扫函数体前 900 字符,连注释一起扫)。
//   这里只有个参数 k —— 但改这个函数时**注释里也别写出那个单字母变量名**,
//   否则 P10 会误报(本行原稿就踩了:说明「不许出现 Q」的那句话本身带了裸 Q)。
function poolRows(k){
  // ★ 2026-10-08:**原来这里是一行 `if(LV==='pri') return [];`**(小学档先空着),现已按它
  //   自己那句注释「数据补上后把这一行删掉即可」删掉 —— 城市级小学红利接上了
  //   (出生驱动,见 scripts/make_primary_mix.py)。
  //   ⚠ 删它的**前提**是:这一页的门槛只看 POOL_OF(小学在校 2025,442 城有)与排名,**不看 RED_OF**,
  //     所以它会比 l1/l2/l3 先亮、且亮得多 —— 与生成器 `_cal_lists` 的 big 分支同规矩
  //     (「画不上的照收」)。协议自检已加 小学/big 的逐城比对,两边不会再分家。
  // ── 自由筛选(2026-09-29):底表是**全库 452 城**,条件全部来自工具条(见 FD)──
  //   与下面那页最大的区别:这里**没有任何写死的门槛**,一项不设就等于不限。
  //   ⚠ 缺值的城在**门槛开着时被排除**(设了「增幅 ≥ 5%」就不该把「增幅未知」的城算成合格),
  //     但它们不会无声消失 —— applyPool 的计数行会点名「另有 N 城缺 X,无法判断本页门槛」。
  //     这是本页与 big 的口径差异:big 不过滤增幅,所以那页缺增幅的城照收(只是画不上)。
  if(k==='free'){
    return D.all.filter(function(x){
      if(PROVP[k] && x.p!==PROVP[k]) return false;                    // ① 省份(范围,不是判据)
      // ② 进入状态。★ 2026-09-29 用户口径改:「未进入」= **凡没进去的**(明确未进 + 还没调研),
      //    不是只算"调研过、确认没进"那 17 城 —— 后者窄得没法用(广东只剩湛江 1 城)。
      //    ⚠ 合并的是**筛选口径**,数据里 es 仍是三态,合并出来的两种在计数行里分开写着
      //      (「本档 21 城 = 调研过未进 1 + 还没调研 20」),不让"没调研"被读成"调研了没进"。
      if(FD.ent==='in' && x.es!=='in') return false;
      if(FD.ent==='notin' && x.es==='in') return false;
      // ③④⑤ 三个数值门槛:开着才判,只有**值已知且低于门槛**才排除。
      //   ⚠ 缺该字段的城**照收**(2026-09-29 用户口径改):「不知道」不是「不合格」——
      //     第一版把缺值的城一起排除,结果是"未进入但缺增幅"的城从表里整个消失,
      //     而那恰恰是要找的对象。现在它们留在表里(值是「—」),在计数行与图下那条
      //     「画不出」带子里单独点名,并注明未参与门槛判定。
      if(FD.pci>0 && x.pci!=null && x.pci/10000<FD.pci) return false;
      const rd=RED_OF(x);
      if(FD.red>FREE_RED_LO && rd!=null && rd<FD.red) return false;
      const sz=POOL_OF(x);
      if(FD.sz>0 && sz!=null && sz<FD.sz) return false;
      return true;
    }).sort(function(a,b){ return (POOL_OF(b)||0)-(POOL_OF(a)||0); });  // 盘子大的排前面
  }
  return D.all.filter(function(x){
    // 省份筛选放**最前**:它是外层作用域,先于门槛(与前三页同一条理由,见 l1rows 的注释)
    if(PROVP[k] && x.p!==PROVP[k]) return false;
    const h=POOL_OF(x)||0;
    if(h < poolQ(k, !!x.is_county)) return false;                 // ① 盘子够不够大(该池前 N%)
    if(x.es!=='in') return true;                                  // ② 未进入 = 零覆盖,两页都收
    // ③ 已进入的:按本页判据看「占住没有」。rank/campus 为空时**照收** ——
    //    「没调研到排名」不等于「占住了」,与 L2 的 rank=null 处理一致。
    return !(x.rank!=null && x.rank<=BIGD.rank);   // 已是本市龙头 = 占住了
  }).sort(function(a,b){ return (POOL_OF(b)||0)-(POOL_OF(a)||0); });  // 盘子大的排前面
}
function applyPool(k){
  const sp=POOLP[k], rs=sortList(k, poolRows(k));
  // 图只画「横轴有值」的城 —— 与竞争格局页同一套路(见 applyMkt 的注释):缺增幅的城 x 为 null,
  // 交给 chart1 会画出坐标 NaN 的空节点(getElementsByTagName 数得到、屏幕上没有),
  // 还会把 Math.min/max 的轴范围带偏(null 被当成 0)。
  // ★ 但清单**不剔**它们:这两页不过滤增幅,一座大城不该因为「红利待补」就被踢出机会清单。
  //   画不上的在计数里点名 —— 不点名的话看着像把城丢了。
  // 图上画得出来的条件:**两个轴都有值**。X 是生源增幅、Y 是人均收入,缺哪个都画不出。
  // 缺的城**照进右表**(见 poolRows 的说明),只在计数行里点名。
  const plot=rs.filter(function(x){ return RED_OF(x)!=null && x.pci!=null; });
  // 缺轴的城(在清单里、但某个轴没值)—— 单独交给 chart1 用虚线圈贴在轴起点画。
  // ⚠ 必须与 plot **分开传**:这些城的坐标是"不知道",一旦混进 plot,Math.min/max 会把
  //   null 当 0,把整条轴拉歪(幽灵点那段注释里踩过同一条)。
  // ⚠ inPage 仍传 **rs**(整个清单)而不是 plot:两轴没值的城**也在本页清单里**,
  //   传 plot 的话 qPrepare 会把它们当成"不在本页",搜索时给出一句错误的理由。
  //   (这一点与"画不画得出来"无关 —— 2026-09-28 车道删掉之后它照样成立。)
  const qs=qPrepare(k,rs,QWHY[k]);
  const host=$(sp.host);
  host.innerHTML='';
  if(plot.length || qs.ghost.length) chart1(host,plot,{
    GHOST:qs.ghost,
    // ── 这张图的轴换过(用户口径 2026-09-28)──
    // 原来: Y = 在校生规模、气泡**定径**(RAD:22)。
    //   问题:在校生同时占着纵轴和气泡面积两处表达,而这两处本来就都可以编码别的量 ——
    //   一屏只读得出「盘子多大」一件事。
    // 现在: Y = **人均收入**(元),气泡**半径 ∝ √生源** —— 一屏三件事:
    //   盘子多大(气泡面积)、在涨还是在跌(横轴)、值不值得去(纵轴)。
    //   ★ 半径 ∝ √生源 是**面积** ∝ 生源:人眼按面积判大小,半径不取根号会把大小看错一倍。
    //   RAD 不再传 —— chart1 走默认的 `5.5×√(RF(r))`,RF 默认就是 POOL_OF(随口径走)。
    YF:function(r){ return r.pci; },
    YLAB:'城镇居民人均可支配收入(万元)',
    YMAX:1e9,                                   // 放开 100 的上限(那是经济分的量纲)
    YTICK:v=>(v/10000).toFixed(1),              // 元 → 万元,与轴名同一单位
    // 横基线 = **全国人均收入中位**(地级池,与「经济分全国中位」同一个人群)。
    // 原来那两条「在校生门槛」横线不能留 —— 纵轴已经换成收入,把「生源够不够」标在一根
    // 收入轴上,位置是假的。但**也不能就此一条线都不画**:这就是它被漏掉的原因 ——
    // 当时用 `HLINES:[]` 关掉那两条,顺手把 chart1 的默认基准线(经济分中位)也一起
    // 关掉了,而那条线的单位同样对不上(百分位 vs 元),结果是纵轴**一条参照线都没有**,
    // 读者看不出「4.7 万算高还是低」。换轴要连基准线一起换,不是一起删。
    HLINES: D.pci_base!=null ? [{v:D.pci_base, txt:'全国中位 '+(D.pci_base/10000).toFixed(1)+' 万'}] : [],
  });
  else host.innerHTML='<div class="empty">'+(LV==='pri' ? priWhy()
    : provEmptyTxt(k)+(k==='free'
        ? '（把任一个门槛放宽、或把「进入」切回不限试试）'
        : '（放宽 在校生门槛'+(k==='big'?'或排名门槛':'或每校区生源门槛')+'试试）'))+'</div>';
  hlChart(host,qs.match);
  // ★ 2026-09-28 用户口径:步进器后面那串折算值「(地级 ≥18.9 万 · 县城 ≥3.6 万)」拿掉。
  //   于是页面**不再出现绝对门槛** —— 这两页的盘子门槛从今往后只有一个说法:「前 N%」。
  //   （原先图上的两条门槛横线也随纵轴换成人均收入一并去掉了,所以那 18.9/3.6 现在
  //    在全页任何位置都看不到;这是有意的,口径就按百分比讲。）
  if(k==='free') freeNoPaint(rs);   // 图下那条「画不出」带子(2026-09-29)
  CUR[k]=rs; render(k,sp.tid,rs);
  qRow(sp.tid,qs.match);   // 必须在 render 之后 —— render 会重建整个 tbody,行高亮会被冲掉
  // ★ 2026-09-28 用户口径:计数行末尾那串「其中 N 城缺数据,图上以虚线圈标出(位置贴在…):…」
  //   整段拿掉,只留「当前 N 城 · 其中已进入 M 城」。
  //   拿掉是对的,而且它当时**已经说错了**:那句描述的还是第一版被否掉的「贴到轴起点」方案 ——
  //   页面上挂着一句描述已不存在的做法的话,比没有更糟。
  //   ⚠ **现在页面上没有任何地方交代"哪几座城画不出"** —— 左侧那条「缺数据」车道 2026-09-28
  //     也按用户口径删掉了。所以右表城数会大于图上点数(战略空白市场:110 vs 77),
  //     这个差额目前**只能靠读者自己发现**。要补一句就说一声。
  // 副标题跟着**当前**门槛走(不是默认值):这一句里带着可调的那个百分比,
  // 只在初始化时填一次的话,用户拖完步进器它就成谎话了。放在这里 = 每次重画都同步。
  if(k==='big'){ const t=$('tsBig'); if(t) t.textContent='生源前 '+BIGD.top+'%,我们未进或名次靠后'; }
  // 自由筛选的副标题跟着**当前生效的条件数**走(与 big 同步门槛同一个理由:只在初始化时写一次,
  // 用户调完控件那句就成了谎话)。0 个条件时回到静态那句。
  if(k==='free'){
    const t=$('tsFree');
    if(t){
      const n=(PROVP.free?1:0)+(FD.ent?1:0)+(FD.pci>0?1:0)+(FD.red>FREE_RED_LO?1:0)+(FD.sz>0?1:0);
      t.textContent = n ? (n+' 个条件生效') : '自己定条件';
    }
  }
  $(sp.cnt).innerHTML=(k==='free')                                    // ⚠ 必须 innerHTML:返回值里有 <b>
    ? provCntTxt(rs.length,PROVP[k])+freeCntTxt(rs)
    : provCntTxt(rs.length,PROVP[k])
    ;   // 用户口径 2026-09-28:拿掉「· 其中已进入 N 城」。计数的「当前 N 城」由 provCntTxt 给,
        // 筛省时那里还会带上「该省共 N 城」—— 协议 P10 要求的那一条留在 provCntTxt 里,不受影响。
}
// 「重置」与首屏必须是同一段代码(协议 P6)—— 只跑 applyPool() 的话控件会停在标记里写死的
// 数字上,而筛选用的是当前口径那套门槛;生成器一改门槛,首屏就成了「控件指着 A、清单按 B 筛」。
function resetPool(k){
  const st=POOLP[k].st;
  // 自由筛选:重置 = 把所有条件清回**不限**(不是回到某个默认门槛 —— 这一页本来就没有默认门槛)。
  // 四个状态各归各的:三个数值门槛退回各自的下限(下限即「不限」),进入状态退回第一档。
  if(k==='free'){
    FD.pci=0; FD.red=FREE_RED_LO; FD.sz=0; FD.ent='';
    freeEntPaint();                                  // 进入状态那三档不是 STEPS,得自己刷
    STEPS[st.pci].paint(); STEPS[st.red].paint(); STEPS[st.sz].paint();
    applyPool(k);
    return;
  }
  const d=BIGD;
  d.top=D.big_top;
  d.rank=D.big_rank;
  STEPS[st.pc].paint(); STEPS[st.gt].paint();
  applyPool(k);
}
$(POOLP.big.reset).addEventListener('click',function(){ resetPool('big'); });
$(POOLP.free.reset).addEventListener('click',function(){ resetPool('free'); });

// ── 口径切换:一个按钮切了,依赖口径的地方全部重画 ──
// 在校生门槛那两个输入框显示的是「当前口径」的值,所以切完要把框里的数字也换掉 ——
// 否则切到初中还显示 5/1.4,看着像没生效,而实际判据已经变成 9/2.8 了。
function syncMinInputs(){
  // 数值与显示都归步进器管(与「生源增幅」同一套)——
  // 原来这里是往两个 number 输入里回写,换了控件就只剩这一条路
  // (原来这里 paint 的是「红利大市场」那两个在校生门槛控件 —— 2026-09-28 那个门槛换成
  //  「前 N%」之后,控件的重画归 syncRedSliders 那一路,这里不再需要。)
}
// 切换高中/初中时,三个「生源增幅」滑块换成新口径自己那一套值。
// 不这么做的话:高中调到 +5%,切到初中仍是 +5% —— 而初中基准是 −1%,筛出来的清单就不是那一页该有的样子。
function syncRedSliders(){
  STEPS.l1.paint(); STEPS.l2.paint(); STEPS.l3.paint();
  // 经济门槛也随口径切(两口径各存一份,见 L1D 定义处)
  if(STEPS.ec) STEPS.ec.paint();
  if(STEPS.ec2) STEPS.ec2.paint();
  if(STEPS.ec3) STEPS.ec3.paint();
}
// ── 通用「选省下拉」工厂 ──
// 四个实例:各市生源概览(换省=换整页内容)+ 三张清单页(换省=筛清单)。
// 都是**只选不筛字**:一个只读框 + 箭头,点开在 31 个里挑 —— 不边打字边变,
// 因为这里的每一次选择都是"换一整页要看的东西",打字过程中来回跳会很晃。
// cfg: {root,input,btn,menu, cur:()=>短名(可空), pick:(v)=>{}, all:是否带「全部省份」, empty:'全部省份'}
function makeProvPick(cfg){
  const rw=$(cfg.root), inp=$(cfg.input), bt=$(cfg.btn), mn=$(cfg.menu);
  if(!rw||!inp||!bt||!mn) return null;
  let open=false, kb=-1, typing=false;
  const all=()=>lvRows().filter(r=>!r.isNat).map(r=>[r.n,r.fm])
                      .sort((a,b)=>a[0].localeCompare(b[0],'zh'));
  const cur=()=>cfg.cur()||'';
  const disp=()=>cur()||cfg.empty||'全部省份';
  // 输入框里的字**只用来过滤候选**,不会边打边换页 —— 选中仍要 Enter 或点击。
  // 这一条是有意的:这里每一次选择都是"换一整页要看的东西",打字过程中来回跳会很晃。
  const q=()=>typing ? inp.value.trim().toLowerCase() : '';
  const items=()=>{ const t=q(); return t
    ? all().filter(it=>it[0].toLowerCase().indexOf(t)>=0||it[1].toLowerCase().indexOf(t)>=0)
    : all(); };
  function paint(){
    const c=cur(), list=items();
    mn.innerHTML=(cfg.all?'<button type="button" data-v=""'+(c?'':' class="on"')+'>'
        +(cfg.empty||'全部省份')+'</button>':'')
      + list.map(it=>'<button type="button" data-v="'+it[0]+'" title="'+it[1]+'"'
        +(it[0]===c?' class="on"':'')+'>'+it[0]+'</button>').join('')
      + (list.length?'':'<div class="qnone">没有匹配的省份</div>');
    if(kb>=mn.querySelectorAll('button').length) kb=-1;
    [...mn.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('hover',i===kb));
  }
  function sync(){ typing=false; inp.value=disp(); }
  function show(v){
    if(v===open) return;
    open=v; bt.setAttribute('aria-expanded',v?'true':'false');
    if(v){ kb=-1; paint(); mn.hidden=false; mn.scrollTop=0; } else mn.hidden=true;
  }
  function pick(v){ cfg.pick(v); sync(); show(false); }
  function caret(d){                       // 上下键移动高亮;菜单没开就先开
    const n=mn.querySelectorAll('button').length;
    if(!open){ show(true); return; }
    if(!n) return;
    kb=((kb+1+d+(n+1))%(n+1))-1;
    [...mn.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('hover',i===kb));
  }
  // Enter:选中高亮的那个;没有高亮就选**第一个真正的省**(跳过「全部省份」那项)。
  // 不跳过的话,打完字按 Enter 会选到排在第一的「全部省份」= 把筛选清空 —— 与意图相反(踩过)。
  // 想选「全部省份」用方向键移上去再 Enter,或者直接点它。
  function pickKb(){
    const bs=[...mn.querySelectorAll('button')];
    const b=(kb>=0&&bs[kb]) ? bs[kb] : bs.find(x=>x.dataset.v);
    if(b) pick(b.dataset.v);
  }
  bt.addEventListener('click',()=>show(!open));
  mn.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) pick(b.dataset.v); });
  // ── 输入框:既能下拉选、也能打字找(用户口径 2026-09-27)──
  // ⚠ 框里放的是**当前值**(不是 placeholder)—— "当前在看哪个省"必须一直看得见(P10 那条)。
  //   于是打字时得先**全选**:不然字会插进「全部省份」中间,变成「全部省广份」,一个也匹配不上
  //   (第一版实测就是这样)。focus 里 select() 之后,浏览器的 mouseup 会把选区收掉,
  //   所以那一次 mouseup 要 preventDefault —— 这是标准做法,不是绕路。
  let justFocused=false;
  inp.addEventListener('focus',()=>{ justFocused=true; inp.select(); setTimeout(()=>{ justFocused=false; },0); });
  inp.addEventListener('mouseup',e=>{ if(justFocused) e.preventDefault(); });
  inp.addEventListener('input',()=>{ typing=true; kb=-1; if(!open) show(true); else paint(); });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); caret(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); caret(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); pickKb(); }
    else if(e.key==='Escape'){ if(open){ e.preventDefault(); sync(); show(false); } }
  });
  bt.addEventListener('keydown',e=>{   // 箭头按钮上也支持上下键(纯键盘不用先 Tab 进输入框)
    if(e.key==='ArrowDown'){ e.preventDefault(); caret(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); caret(-1); }
    else if(e.key==='Enter'){ if(open){ e.preventDefault(); pickKb(); } }
    else if(e.key==='Escape'&&open){ e.preventDefault(); sync(); show(false); }
  });
  // 点外面:关掉并**把输入框还原成当前值** —— 打着半截字点走,框里留着「广」会很误导
  document.addEventListener('click',e=>{
    if(open && !e.target.closest('#'+cfg.root)){ sync(); show(false); }
  },true);
  sync();
  return {paint:paint, sync:sync};
}

// ── 加减号步进器 ──
// 三张清单页各一个,共用这一个工厂。值仍然读写各页自己的 L*D —— 显示与实际筛选永远是
// 同一个变量(这条是 P6 守的,换成步进器后它改守「工厂的 getter 必须是 l*k*red」)。
// 按住连发:范围 60 格(−10~50),一格一格点太累 —— 按住 400ms 后每 90ms 走一格。
const STEPS={};
// opt:{step, dec, plus, unit} —— 生源增幅是整数百分比带正号;在校生门槛是小数(地级 0.5 / 县城 0.1)、不带正号。
// 两个控件共用一套交互(click 单步 / pointerdown 连发 / 到头禁用),只有显示与步长不同。
function makeStep(host,lo,hi,get,set,opt){
  opt=opt||{};
  const stp=opt.step||1;
  const fmt=v=>{
    let t=(opt.dec!=null) ? v.toFixed(opt.dec) : String(v);
    if(opt.dec==null) t=String(+v.toFixed(2));      // 0.5 的累加会飘出 5.000000001,先收一下
    if(opt.dec!=null) t=t.replace(/\.0+$/,'');      // 5.0 → 5(库里就是 5 / 1.4 / 9 / 2.8 这样写的)
    if(opt.zero && v<=lo+1e-9) return opt.zero;      // 到下限时显示「不限」这类词,而不是「0」
    return (opt.plus&&v>0?'+':'')+t+(opt.unit||'');
  };
  const box=$(host); if(!box) return null;
  const out=box.querySelector('b'), bs=[...box.querySelectorAll('button')];
  const api={paint:function(){
    const v=get();
    out.textContent=fmt(v);
    bs[0].disabled=v<=lo+1e-9; bs[1].disabled=v>=hi-1e-9;   // 到头就禁用,免得点了没反应还以为是坏的
  }};
  // ★ 2026-09-28 用户口径:「加减号那个数字不能自己输入吗 改成可以自己输入吧」。
  //   点中间那个数字 → 就地换成输入框,回车/失焦生效、Esc 放弃。
  //   为什么必须有:有些门槛的**量程长而步距小**(人均收入 0–20 万、0.1 万一格 —— 从 4.4 调到 6.0
  //   要按 16 下),只会点加减号的话这种门槛基本没法用。
  //   做在 makeStep 里而不是某个控件上:所有步进器(红利门槛/收入门槛/生源前 N%/排名/在校生)
  //   共用这一个工厂,一处改全部受益 —— 只给收入那一处加的话,下一轮用户还会问同样的问题。
  out.title='点数字可直接输入';
  out.addEventListener('click',function(){
    if(box.querySelector('.stpin')) return;                  // 已经在编辑,别叠第二个
    // ⚠ 不能用 `el(...)` —— 那个工厂是 `createElementNS(SVG_NS, …)`,造出来的是 **SVG** 的 input:
    //   挂上去不报错、元素也在,但 `select()`/取值全不对(实测报 "inp.select is not a function")。
    //   HTML 元素一律走 document.createElement。
    const inp=document.createElement('input');
    inp.className='stpin'; inp.type='text'; inp.inputMode='decimal'; inp.value=String(get());
    inp.style.width=out.offsetWidth+'px';
    out.style.display='none';
    box.insertBefore(inp,out);
    inp.focus(); inp.select();
    let closed=false;
    const done=function(ok){
      if(closed) return; closed=true;                        // ⚠ 回车与失焦会**连着火**:不设这个标志
                                                             //   就会 done 两次(第二次拿已被移除的 input 读值)
      if(ok){ const v=parseFloat(inp.value);
              if(!isNaN(v)) set(Math.max(lo,Math.min(hi,v))); }   // 超范围就夹到边界,不静默丢弃
      inp.remove(); out.style.display='';
      api.paint();
    };
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); done(true); }
      else if(e.key==='Escape'){ e.preventDefault(); done(false); }
    });
    inp.addEventListener('blur',function(){ done(true); });
  });
  const bump=d=>{ const v=Math.max(lo,Math.min(hi,+(get()+d*stp).toFixed(4))); if(v===get()) return; set(v); api.paint(); };
  let t1=null,t2=null,held=false;
  const stop=()=>{ clearTimeout(t1); clearInterval(t2); t1=t2=null; };
  bs.forEach(b=>{
    const d=+b.dataset.d;
    // ⚠ 单步走 **click** 而不是 pointerdown(踩过):只监听 pointerdown 的话,
    //   键盘(焦点在按钮上按 Enter/Space 触发的是 click)与程序化 .click() 全都点不动 ——
    //   按钮看着好好的、鼠标也能用,只有键盘用户和自动化点不动,最难发现的一类。
    //   pointerdown 退回去只管"按住连发":400ms 后每 90ms 一格;它一开火就置 held,
    //   抬手时那个 click 便被吃掉(否则按住一次会多走一格)。
    b.addEventListener('pointerdown',()=>{ held=false;
      t1=setTimeout(()=>{ held=true; bump(d); t2=setInterval(()=>bump(d),90); },400); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    b.addEventListener('click',()=>{ if(held){ held=false; return; } bump(d); });
  });
  return api;
}
// 小学档的空态文案(四处清单页共用):空**不是筛选筛没了**,而是这一档的数据还没采 ——
// 所以不能沿用「放宽门槛试试」(那句话会让读者去调门槛,调了也不会有人)。
const priWhy = () => '这一档要看的是**小学**盘子,它和初中/高中不是一套算法:'
  + '初中在校(y) = Σ招生(y−6..y−8),全是已经发生的招生;而小学在校(y) = Σ招生(y..y−5) **含当年招生** ——'
  + '要算 2026–2028 就得知道那时的招生,那时还没招生,只能**从出生推**(2020 年出生 → 2026 年入学)。'
  + '所以这一档依赖**城市级出生人口**:采到 2019–2022 四年的城会自动亮,没采到的留空。'
  + '缺的不是按钮,也不放宽门槛能解决 —— 是出生数据还在采。';
// 省份筛选的两句文案(三页共用,免得三处各写一份、哪天改一处漏两处)
function provCntTxt(n,prov){
  if(!prov) return '当前 '+n+' 城';
  const tot=D.all.filter(x=>x.p===prov).length;
  return '<b>'+prov+'</b> · 当前 '+n+' 城 / 该省共 '+tot+' 城';
}
function provEmptyTxt(k){
  const p=PROVP[k]||'';
  return p ? ('<b>'+p+'</b>在本页当前条件下没有城市')
               : '当前条件下没有城市';
}
// ── 「自由筛选」计数行的两段补充(2026-09-29)──
// 这一页的条件是用户当场设的,所以计数行除了城数还要交代两件事 —— 不说就是让人以为城丢了:
//   ① 这 N 城怎么构成的(已进入 / 未进入 / 未调研 各多少);
//   ② **设了数值门槛之后**,库里有多少城因为这个字段是空的而"无法判断"被排除在外。
// ②是这一页特有的:战略空白市场**不过滤增幅**,缺增幅的城照收(只是画不上);这一页一旦设了
//   门槛,缺值的城就必须排除 —— 排除就得点名,否则「452 城筛出 42 城」看着像丢了 410 城。
function freeMissTxt(rs){
  // ⚠ 口径是「其中」而不是「另有」:这些城**在表里**(2026-09-29 改),只是没参与门槛判定。
  //   写成「另有 N 城…无法判断」会让人以为它们被排除了 —— 那是改之前的行为。
  const p=[];
  if(FD.red>FREE_RED_LO){

function freeNoPaint(rs){

  const nt=no.filter(function(x){ return RED_OF(x)==null; }).length;

    +'<span class="tg">'+(FREE_NO_OPEN?'收起':'展开全部')+'</span>';

  el.title='图上没有的 '+no.length+' 城:'+names.join('、')

function freeCntTxt(rs){

  //   rs 已经被「进入」那一档筛过,再报它的构成就只剩那一档(「未进入 10」),既不含信息,
  //   还把**未调研那 359 城的存在**藏掉了 —— 而「未进入」只筛出 17 城(不是 376 城)这件事,
  //   恰恰是拿掉「未调研」按钮之后最容易被误读的一处。候选集构成是稳定的,正好回答它。
  // 措辞里写明是哪一层(全库 / 该省),免得与「当前 N 城」并排看着像自相矛盾。
  const cand=D.all.filter(function(x){ return !PROVP.free || x.p===PROVP.free; });
  let a=0,b=0,c=0;
  cand.forEach(function(r){ const e=r.es||'unknown'; if(e==='in')a++; else if(e==='out')b++; else c++; });
  const parts=[];
  if(a) parts.push('已进入 '+a);
  if(b) parts.push('未进入 '+b);
  if(c) parts.push('未调研 '+c);
  const head=(PROVP.free?'该省':'全库')+'三态';
  // 选了「未进入」时把那 21 城拆开说 —— 它是两种城合起来的(调研过确认没进 / 还没调研),
  // 不让「还没调研」被读成「调研了、没进」。这是合并筛选口径之后必须补的一句。
  let entPick='';
  if(FD.ent){
    const no=rs.filter(function(x){ return x.es==='out'; }).length;
    entPick=' · 本档 '+rs.length+' 城 = 调研过未进 '+no+' + 还没调研 '+(rs.length-no);
  }
  return (parts.length?' · '+head+' '+parts.join(' / '):'')+entPick+freeMissTxt(rs);
}

// 去掉「省」列(整张表同省),顺序也照它的默认序(2025 高中在校生降序)。
// ⚠ 用 shortName(fm) 去配 r.p:生成器里 r.p 是 re.sub 剥后缀后的短名,
// 与 shortName 的五种后缀规则实测一致(新疆维吾尔自治区 → 两边都出「新疆」)。

// 免得两张表的「空值沉底」「默认升降」各写一套(那种分叉最难查)。
// 列定义(2026-09-29 规整):

// ★ 表头一律**显式 <br>**:原来靠自动折行,结果「2025 高中 / 在校(万)」把数字和单位拆在两行,
//   而「级别」「校区」只有一行,表头高矮参差。现在统一按「标目行 + 单位行」切,九列对齐。
// ★ 「级别」写「地级 / 县级」而不是「地级行政区」—— 五个字在 64px 里要折行,而这一列的值
//   也只有这两种(直辖市在省级页,不在这张表)。
const PVCOLS=[['城市','l','c'],['级别','l','lv'],
  ['2025 高中<br>在校(万)','r','hs25'],['高中 26–28<br>增幅 vs 25','r','t'],
  ['2025 初中<br>在校(万)','r','mid25'],['初中 26–28<br>增幅 vs 25','r','g3'],
  ['城镇居民<br>人均可支配<br>收入(万元)','r','pci'],
  ['校区','r','campus'],['本市<br>排名','r','rank']];

const PVIDX=[0,2,3,4,5,6,10,8,9];
let pvSort='hs25', pvDir=-1;       // 默认与全量表一致:2025 高中在校生降序
function pvRows(fm){
  const f=SK[pvSort];
  return D.all.filter(r=>r.p===shortName(fm)).slice().sort((a,b)=>{
    const av=f(a), bv=f(b);
    const an=(av==null||av===''), bn=(bv==null||bv==='');
    if(an&&bn) return a.c.localeCompare(b.c,'zh');   // 两边都空 → 按城名,避免顺序抖动
    if(an) return 1; if(bn) return -1;               // 空值永远沉底,与升降无关
    const r=(typeof av==='number'&&typeof bv==='number') ? av-bv : String(av).localeCompare(String(bv),'zh');
    return pvDir<0 ? -r : r;
  });
}
function provBox(fm){
  const rs=pvRows(fm);
  if(!rs.length) return '';
  // 列宽给个提示值:不给的话 auto 布局会把 9 列均分(实测每列 99px),
  // 「城市」「本市排名」被压得比数值列还窄,读起来别扭。
  // 列宽(2026-09-29 按**实测内容**重排,不再拍脑袋):
  // · 城市:**按本省最长的城名算** —— 固定宽度是两头不讨好:浙江(3 字)白占 77px,
  //   而贵州/新疆(11 字,如「克孜勒苏柯尔克孜自治州」)反而不够、要折行。
  //   每字 ≈14px(17px 字号下实测),加 24px 内边距,夹在 [88,190]。
  // · 级别 64:值只有「地级/县级」两个字;
  // · 两个增幅列 106:「高中 26–28」「增幅 vs 25」两行里最宽那行 ≈64px,加箭头 16px 与内边距;
  // · 收入 100:三行表头里最宽那行「人均可支配」≈58px;
  // · 校区/排名 62/68:表头两字 + 箭头即可(原来排名给到 94,实测白占 33px)。
  const maxName=rs.reduce((m,r)=>Math.max(m,r.c.length),0);
  const cityW=Math.min(190,Math.max(88,24+14*maxName));
  const W=[cityW,64,96,106,96,106,100,62,68];
  const lbl=(PVCOLS.filter(c=>c[2]===pvSort)[0]||['—'])[0].replace(/<br>/g,'');
  return '<div class="trcap">该省各市 · '+rs.length+' 城 · 按 <b>'+lbl+'</b> '+(pvDir<0?'↓':'↑')
    +' 排(点表头切换)· 左侧红条 = 学成已进入 · 点行开竞对格局 deck(仅部分城市有)</div>'
    +'<div class="pvbox"><table><colgroup>'
    + W.map(w=>'<col style="width:'+w+'px">').join('') + '</colgroup><thead><tr>'
    + PVCOLS.map(c=>'<th class="'+c[1]+(c[2]===pvSort?' on':'')+'" data-ps="'+c[2]+'" title="点此排序">'
        + c[0]+'<span class="ar">'+(c[2]===pvSort?(pvDir<0?'▼':'▲'):'⇅')+'</span></th>').join('')
    +'</tr></thead><tbody>'
    + rs.map(r=>{
        const cs=acells(r);
        // 判据与 rankCell 用同一个 r.deck(有 deck 才可点),但**不要求** rank 有值 ——
        // rank 是空的、deck 却在的城(91 个 deck 里有 16 个)照样能整行点开。
        return '<tr'+(r.ent?' class="ent"':'')
          +(r.deck?' data-deck="'+r.deck+'" data-city="'+r.c+'" title="打开 '+r.c+' 竞对格局 deck"':'')+'>'
          + PVIDX.map((j,i)=>'<td class="'+PVCOLS[i][1]+'">'+cs[j]+'</td>').join('')+'</tr>';
      }).join('')
    +'</tbody></table></div>';
}
// 生源趋势视图的滚动高度上限 = 画布下沿 − 工具条下沿 − 该栏下内边距。
// 锚点全部取自**这个滚动区管不着**的东西(#vp 的显式高度、.phead 的高度、padding),
// 所以反复调用结果恒定;写成"量 .paneR 现在多高"的话会自噬(见 showProvTrend 里的注释)。
// resize 后画布高会变,由 fitCharts 末尾再调一次。
function trCap(hostId){
  const cp=$(hostId||'cp'); if(!cp) return;
  const w=cp.querySelector('.trwrap'); if(!w) return;
  const pane=cp.parentNode, head=pane&&pane.querySelector('.phead'); if(!head) return;
  const avail=$('vp').getBoundingClientRect().bottom - head.getBoundingClientRect().bottom
    - parseFloat(getComputedStyle(pane).paddingBottom||0) - 6;
  w.style.maxHeight=Math.max(240,Math.round(avail))+'px';

// 各市生源概览 —— 「各省生源 × 收入」整页下移一级(用户口径 2026-09-27)
//
// 能这么快做完,靠的是一条:**图用 chartProv、表用 provBox,两边的代码一行没改** ——
// 前提是把城市行**投影成省行那套字段名**(见 pcRows)。这是这次唯一值得记住的设计:
// 复用的门槛不是"函数写得通用",而是"数据形状一致"。
//
// 与省级页的三处不同:
//   ① 顶部是一个**选省**下拉(默认广东),不是搜索框;
//   ② X 轴那条全国基准竖线用**城市口径**的数(D.nat_base),不是 31 省聚合 —— 两页各说各的口径;
//   ③ 下钻钻的是"市":钻下去只有该市的趋势线,城市下面没有更细一层了。
// ══════════════════════════════════════════════════════════════════════════
// 省份短名 → 全称:provBox 是按全称找城市的。自治区/直辖市不是简单加个「省」,
// 所以必须查 lvRows() 拿 fm,不能拼字符串(拼的话「内蒙古省」直接落空)。
// ⚠ 这两个写成 **function 声明**而不是 const 箭头:首屏初始化在脚本中段就调 redrawPC(),
//   而 const 不提升 —— 写成箭头函数,那两个在初始化时还是 TDZ,整段脚本当场中断
//   (pageerror 只报一行,表现是九页全不动)。函数声明会提升,这才是它存在的意义。
function pcFull(v){ const r=lvRows().filter(x=>!x.isNat).find(x=>x.n===PCV[v].sel); return r?r.fm:PCV[v].sel; }
function pcAll(v){ return D.all.filter(r=>r.p===PCV[v].sel); }

// 城市行 → 省行形状。右边这串字段名是 chartProv 认的那几个(cf. chartProv 里所有 p.r.*)。
// red/inc/pool 是**投影出来的**(随口径变),不是行里现成的:
//   inc 用 pci(城镇人均可支配收入,元)—— 与省级页的 inc 同一个量纲,图上不用除两次;
//   ⚠ 城市行的 `inc` 字段**不是收入**(是高中在校的 26–28 均值与 2025 实测之差),
//     别看着眼熟就拿来用 —— 这条差点踩进去。
//   pool 随 LV 切(hs25 ↔ mid25),red 随 LV 切(t ↔ g3),与全站口径切换同一套。
// ★ 2026-09-30:yrs/pk/flat 改成**按档现算**(pkOf),原来写的是 `yrs: r.left` ——
//   而 left 来自 junior_mix,是**初中**的峰值偏移,于是高中/小学两档印的都是初中的数:
//   实测广东 15 座有完整高中序列的城,**15 座**都不对(深圳表印「4 年」,真实高中峰在 7 年后;
//   东莞印「已过顶 1 年」,真实高中峰在 3 年后)。初中那档碰巧对,所以一直没被发现。
function pkOf(r){
  const S={};
  let base=null;
  if(LV==='high'){
    // 与省级同法:2025 实测,2026–28 实测初中在校 × 普高率,2029+ 用 r × 初中池(y−3) 外推
    if(r.hs25!=null)  S[2025]=r.hs25;
    if(r.u26!=null)   S[2026]=r.u26;
    if(r.v27!=null)   S[2027]=r.v27;
    if(r.b28!=null)   S[2028]=r.b28;
    base=r.hs25;
    if(r.pugao) for(const k in (r.jf||{})) S[Number(k)+3]=r.pugao*r.jf[k];
  } else if(LV==='jun'){
    // 城市层有 2023–2025 三年实测(mid23/mid24/mid25)+ jf 推算;再往前主库没有。
    if(r.mid23!=null) S[2023]=r.mid23;
    if(r.mid24!=null) S[2024]=r.mid24;
    if(r.mid25!=null) S[2025]=r.mid25;
    base=r.mid25;
    for(const k in (r.jf||{})) S[Number(k)]=r.jf[k];
  } else {
    return {pk:null, flat:false};   // 小学:城市层没有序列,恒为「—」
  }
  const ks=Object.keys(S).filter(k=>S[k]!=null);
  if(!ks.length || base==null) return {pk:null, flat:false};
  const pk=ks.reduce((a,b)=>S[b]>S[a]?Number(b):a, Number(ks[0]));
  return {pk:pk, flat:(S[pk]/base-1)<0.01};
}
function pcRows(v){
  return pcAll(v).map(r=>{
    const g=pkOf(r);
    return Object.assign({},r,{
      n: shortName(r.c), fm: r.c,
      red: RED_OF(r), inc: r.pci,
      pool: POOL_OF(r),
      r: r.pugao, rnote: null,
      pk:g.pk, flat:g.flat, yrs:(g.pk==null?null:g.pk-2026),
    });
  });
}

// ★ 2026-09-28 用户口径:换页**只用键盘 ←/→**(以及点 tab)。
//   原先还支持「在卡片上按住拖动」换页(横向拖过 55px 翻一页),但它会误伤正常操作 ——
//   在图或表格上按住拖一下(选文字、拖气泡)就翻页了。整块拖拽逻辑已删除,
//   连带 `dragging/startX/startY/dx/dy/axis` 六个状态变量(留着只会让人以为还有这条路)。
const vp=$('vp'), track=$('track'), tabs=[...document.querySelectorAll('.tab')];
let cur=0;
function go(i,anim){
  cur=Math.max(0,Math.min(ORDER.length-1,i));
  if(anim!==false){ track.style.transition=''; }
  track.style.transform='translateX('+(-cur*100)+'%)';
  tabs.forEach((t,j)=>t.classList.toggle('on',j===cur));
  // 搜索词是五页共用的,但每页的图是各自画的 —— 切过来时得把这一页补算一遍,
  // 否则会出现「框里写着昆山,图上没高亮,提示还停着上一页的话」。
  const _k=ORDER[cur];
  if(QDIRTY[_k] && QREAPPLY[_k]) QREAPPLY[_k]();
  // 省视图懒渲染:第一次切到这一页才画(见 pcEnsure 那段的说明)。
  // ⚠ **画完必须重排一次高度**(refit):图是刚建出来的,而卡片高/缩放比是按「当时已有的图」
  //   算的 —— 不重排的话新图比卡片高,底部那条 x 轴正好被 .viewport{overflow:hidden} 裁掉
  //   (用户实测:「这些新增的 tab 气泡图看不到 x 轴了」,2026-10-08)。
  if(pcEnsure(_k)) refit();
  // 兜底:.vp 是 overflow:hidden 的滑动容器,任何一次 scrollIntoView 都能把它横向滚掉一页,
  // 于是 transform 与它叠加,显示的就成了隔壁那页。切页时抹平,免得一次意外滚动的后遗症留到下一次。
  vp.scrollLeft=0;
  if(typeof moveInd==='function') moveInd(anim===false);
  followTab(anim!==false);
}
// 把当前 tab **对到 tab 条的正中**(用户口径 2026-09-28 改成「一屏三个 + 可横向滚」之后新增,
// 同日再改一次:原来是"最小滚动、看得见就行",用户要求「每次选中的tab保持在中间」)。
//
// ★ **绝不能用 scrollIntoView**:它会连锁滚动**所有**可滚动祖先,而 `.vp` 是 overflow:hidden
//   的换页容器 —— hidden 的元素照样能被程序滚,于是一行滚进来、整页横向跳掉一页
//   (这个坑本项目在表格那边踩过一次,协议 P10 有一条断言专门钉着 scrollIntoView)。
//   所以自己算:用 tab 的 offsetLeft/offsetWidth(相对 .tabs),与滚动位置同一套坐标。
//
// ★ 两端**必须夹住**:第一页左边没有内容,想居中就得把 scrollLeft 算成负数 ——
//   夹到 0 之后它是"贴着左边"而不是居中。末页同理。这不是 bug,是滚动的物理边界;
//   硬要居中只能在两端留白,那会让第一屏的排版跟别处不一样。
function followTab(smooth){
  const bar=$('tabs'), t=tabs[cur]; if(!bar||!t) return;
  const max=bar.scrollWidth-bar.clientWidth;
  if(max<=0) return;                                  // 一屏装得下,不用滚
  // 让 tab 中心落在条中心:目标 = tab 中心 - 半条宽
  const want=t.offsetLeft + t.offsetWidth/2 - bar.clientWidth/2;
  const target=Math.max(0, Math.min(want, max));
  if(Math.abs(target-bar.scrollLeft)<1) return;       // 已经在中了(或夹住后没变化)就别动
  if(smooth && bar.scrollTo) bar.scrollTo({left:target,behavior:'smooth'});
  else bar.scrollLeft=target;
}
// 把白色拇指挪到当前那一段下面。量的是**整段**的框(不是里面的字)——
// 分段控件的拇指是盖满一段的,和上一版那条「只跟文字一样宽」的下划线不是一回事。
// 首屏与 resize 用 .ini 关掉过渡:不然页面一加载,拇指会从左边滑到默认位置。
const TIND=$('tind');
function moveInd(noAnim){
  const t=tabs[cur]; if(!t||!TIND) return;
  if(noAnim) TIND.classList.add('ini');
  // ⚠ 用 offsetLeft/offsetWidth,不要用 getBoundingClientRect 的差值 ——
  //   后者返回的是**已被祖先 zoom 缩放**的像素,而 left/width 是在元素自身坐标系里解释的,
  //   两者差一个缩放比(hardFit 会给 .wrap 设 zoom),红条就会偏。
  //   offset* 不受祖先 zoom 影响,和 left/width 同一套坐标。
  TIND.style.left=t.offsetLeft+'px';
  TIND.style.width=t.offsetWidth+'px';
  if(noAnim){ void TIND.offsetWidth; TIND.classList.remove('ini'); }
}
tabs.forEach((t,i)=>t.onclick=()=>{

  // 早先这里只有一个出口:右侧那个「← 返回气泡图」。但用户的直觉是「点回我现在这个 tab」——
  // tab 明明亮着,点它却什么都不发生,看起来像卡住了。两种返回并存,不冲突。
  // 判据用 PROVTREND(下钻状态的真源)而不是「tab 是否已选中」:没有下钻时重复点 tab

// 体量数字没丢:同一组值在「城市趋势」页的 .corpus 统计条里(那边也是从 D 实算,不是写死的)。
// 「竞争格局」页原有的右栏(画不上几城的说明 + 城市研究地图入口卡片)已整块删除。
// 地图现在只能从 城市调研/survey-map.html 直接打开,本页不再有入口。
// ── 竞对格局 deck 悬浮窗 ──
// 为什么用 iframe 而不是把 deck 的渲染并进本页:deck 是 4 页 1280×720 的整屏幻灯片,
// 并进来要给本页背上一整套幻灯片布局 + 91 城数据加载,耦合太重;iframe 天然隔离它的
// Tailwind 主题与键盘处理,代价只有下面这几十行。
// ⚠ file:// 下父页读不到 iframe 内部(contentDocument 为 null,跨源),所以一切交互走
//   postMessage:deck 里的关闭键回传 closeDeck,父页把方向键回传 nav。
const DECKW=1280, DECKH=720;
function fitDeck(){
  // deck 是固定 1280×720,不是响应式的(只有 ≤768 的 mobile 重排,中间宽度是空档),
  // 所以小屏靠整体缩放,而不是让它自己重排。
  const s=Math.min(1,(window.innerWidth-64)/DECKW,(window.innerHeight-64)/DECKH);
  $('deckovBox').style.transform = s<1 ? 'scale('+s+')' : '';
}
function openDeck(url,city){
  $('deckCity').textContent=city||'';
  $('deckFrame').src=url;
  $('deckov').hidden=false;
  fitDeck();
  // 让 iframe 拿到焦点 —— 拿不到的话 deck 自己的键盘监听收不到方向键,
  // 得靠 deckKey() 从父页转发(两条路互不冲突:iframe 内的按键不会冒泡到父页)。
  setTimeout(function(){ try{ $('deckFrame').focus(); }catch(e){} }, 120);
}
function closeDeck(){
  $('deckov').hidden=true;
  $('deckFrame').src='about:blank';   // 卸掉 deck,免得留在后台继续跑
}
function deckKey(e){
  if($('deckov').hidden) return;
  if(e.key==='Escape'){ e.preventDefault(); closeDeck(); return; }
  const dir={'ArrowRight':'next','ArrowDown':'next','ArrowLeft':'prev','ArrowUp':'prev'}[e.key];
  if(!dir) return;
  e.preventDefault();
  try{ $('deckFrame').contentWindow.postMessage({type:'nav',dir:dir},'*'); }catch(err){}
}
document.addEventListener('keydown',deckKey);
// 父页收到 deck 的回传(deck 里的「✕ 关闭」按钮、以及嵌入模式下的 Esc)
window.addEventListener('message',function(e){
  const d=e.data||{};
  if(d.type==='closeDeck') closeDeck();
});
// 点「本市排名」→ 开悬浮窗。修饰键/中键不拦,交给浏览器原生开新标签。
document.addEventListener('click',function(e){
  const a=e.target.closest('a.deck'); if(!a) return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  e.preventDefault();
  openDeck(a.getAttribute('href'), a.dataset.city);
});
window.addEventListener('resize',function(){ if(!$('deckov').hidden) fitDeck(); });

go(0,false);   // 默认落在最左的「全国趋势」(ORDER 见上面那行 —— 那里才是真源,这行只是说明)
// 字体到位后重量一次红条位置:首屏那次量的是回退字体的宽度,换成微软雅黑后每项宽度都变
// 字体到位后**整套重算**。首屏那次 setTimeout(fitCharts,0) 跑在字体加载之前,
// 量的是回退字体的行高;微软雅黑一到位,所有文字的盒子都会变高,文档就顶出窗口 ——
// 表现正是「明明算过能放下,打开却要滚」。所以字体就绪、window.load 之后都要再来一遍。
// 字体换掉之后每格宽度会变(回退字体与微软雅黑的字宽不同),条宽也就变了 ——
// 当前 tab 得**重新居中**一次,否则它还停在按旧宽度算出来的位置。用瞬移(false)。
function refit(){ fitCharts(); moveInd(true); followTab(false); }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(refit);
window.addEventListener('load',refit);
setTimeout(refit,600);
// 全部初始化完成后才量高度并自适应 —— 见 fitCharts 那段注释。首次调用只能放这里:
// 它会重画七页,而 applyL1/applyL2/applyL3 读的是后面才声明的 const(l1red 那些),
// 放前面就是 TDZ(「Cannot access 'l1red' before initialization」)。
// ⚠ 各市生源概览的**首次**绘制放在这里,而不是像 redrawProv() 那样紧跟其后 ——
//   它的依赖链更长(pcRows → RED_OF / pvSort → provBox),其中 pvSort 是 let、声明在脚本下半段,
//   提前调就是 TDZ(pageerror 只报一行,表现是九页全不动)。放在末尾,那一行之前所有声明都已就位。
//   之后的重画走 CHART_REDRAW(口径切换、resize)与选省/下钻,不经过这里。
// 三个门槛控件(步进器)与首屏重置放在**这里**、不放各自的函数旁边:
// initSteps 要读 L1D/L2D/L3D,而 resetL* 要读 STEPS —— 两头都是 const,谁在前都 TDZ。
// 放在脚本末尾,那时所有声明都已就位(与 redrawPC 同一个理由)。
initSteps();
// 四页各自的省份筛选器(每页一份,见 PROVP)。换省只重算自己这一页 ——
// 框里显示的永远只属于它自己那一页,不存在"显示与实际不符"。
// 换省:**只重算这一页**(用户口径 2026-09-28)。四页各记各的,互不影响 ——
// 框里显示的永远只属于它自己那一页,不存在"显示与实际不符",也就不用四页一起重算。
// ⚠ 这里调的是 applyL* 而**不是** resetL*:reset 会把用户调过的门槛一起打回默认值 ——
//   上一轮写成了 reset,于是"换个省"顺手把门槛清了(实测确认过,已改)。
function setProv(k,v){
  PROVP[k]=v||'';
  const inp=$({l1:'l1In',l2:'l2In',l3:'l3In',mkt:'mktIn',big:'bigIn',free:'freeIn'}[k]);
  if(inp && document.activeElement!==inp) inp.value=PROVP[k]||'全部省份';
  ({l1:applyL1,l2:applyL2,l3:applyL3,mkt:applyMkt,
    big:()=>applyPool('big'),free:()=>applyPool('free')}[k]||function(){})();
}
makeProvPick({root:'l1W',input:'l1In',btn:'l1Btn',menu:'l1Menu',all:true,
  cur:()=>PROVP.l1, pick:v=>setProv('l1',v)});
makeProvPick({root:'l2W',input:'l2In',btn:'l2Btn',menu:'l2Menu',all:true,
  cur:()=>PROVP.l2, pick:v=>setProv('l2',v)});
makeProvPick({root:'l3W',input:'l3In',btn:'l3Btn',menu:'l3Menu',all:true,
  cur:()=>PROVP.l3, pick:v=>setProv('l3',v)});
makeProvPick({root:'mktW',input:'mktIn',btn:'mktBtn',menu:'mktMenu',all:true,
  cur:()=>PROVP.mkt, pick:v=>setProv('mkt',v)});
makeProvPick({root:'bigW',input:'bigIn',btn:'bigBtn',menu:'bigMenu',all:true,
  cur:()=>PROVP.big, pick:v=>setProv('big',v)});
makeProvPick({root:'freeW',input:'freeIn',btn:'freeBtn',menu:'freeMenu',all:true,
  cur:()=>PROVP.free, pick:v=>setProv('free',v)});
// 自由筛选的「进入」三档开关(不是步进器,所以不进 STEPS)。绑一次即可 ——
// paint 由 freeEntPaint 负责,重置按钮里也会调它(resetPool 的 free 分支)。
document.querySelectorAll('#freeEnt button').forEach(function(b){
  b.onclick=function(){ FD.ent=b.dataset.ent||''; freeEntPaint(); applyPool('free'); };
// 「画不出」带子:点一下展开全部/收起。⚠ 走 fitCharts() 而不是 applyPool() —— 展开会占掉图的高度,
// 得让整页重新贴合一次(与窗口 resize、切口径同一条路径);只重画这一页的话,
// 多出来的一行会把内容顶出 .viewport(overflow:hidden)被裁掉。
$('freeNo').addEventListener('click',function(){ FREE_NO_OPEN=!FREE_NO_OPEN; fitCharts(); });
});
resetL1();
resetL2();
resetL3();
// 战略空白市场:同样在脚本末尾 —— resetPool 要读 STEPS(initSteps 刚建好)与 BIGD
resetPool('big');
// 自由筛选:同一个理由(resetPool 要读 STEPS 与 FD),并且它还要读到上面刚绑好的 freeEnt 开关
resetPool('free');

// ★ 省视图**懒渲染**(2026-10-08,加到 31 个省视图时改的;同日稍后撤掉新疆/西藏/海南三页,现 28 页):
//   首屏全画的话,一次要建 31 张气泡图 + 31 张右表 —— 而观众一次只看得到一页。
//   改成「切到哪页画哪页」:判据就是宿主里还没有 <svg>(画过就有)。首屏只画当前页。
function pcEnsure(k){
  if(!PCV[k]) return false;
  if($(PCV[k].chart).querySelector('svg')) return false;   // 画过了
  redrawPC(k);
  return true;                                            // ← 报告「本次现画」,调用方要重排高度
}
pcEnsure(ORDER[cur]);
setTimeout(fitCharts,0);

</script>

<div class="deckov" id="deckov" hidden>
  <div class="deckov-bd" onclick="closeDeck()"></div>
  <div class="deckov-box" id="deckovBox">
    <div class="deckov-hint"><b id="deckCity"></b>竞对格局 · ‹ › 或方向键翻页 · Esc 关闭</div>
    <button class="deckov-x" onclick="closeDeck()" title="关闭 (Esc)" aria-label="关闭">✕</button>
    <iframe id="deckFrame" title="竞对格局 deck" src="about:blank"></iframe>
  </div>
</div>
</body>
</html>
